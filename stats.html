function tally(list) {
  const r = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, y: 0, rd: 0, clean: 0 };
  list.forEach(m => {
    const s = D().scoreParts(m); if (s.ours == null) return;
    r.p++; r.gf += s.ours; r.ga += s.theirs; if (s.theirs === 0) r.clean++;
    s.ours > s.theirs ? r.w++ : s.ours === s.theirs ? r.d++ : r.l++;
    r.y += entries(m.yellow_cards).length; r.rd += entries(m.red_cards).length;
  });
  r.win = r.p ? Math.round(r.w / r.p * 100) : 0;
  return r;
}

function entries(text) {
  if (!text || text === 'なし' || text === 'Nessuno') return [];
  return String(text).split(/[,、]/).map(x => x.trim()).filter(Boolean).map(s => {
    s = s.replace(/\s*[(（][^)）]*[)）]\s*$/, '').trim();
    const m = s.match(/^(.*?)\s*[xX*]\s*(\d+)$/);
    return m ? { name: m[1].trim(), count: parseInt(m[2], 10) || 1 } : { name: s, count: 1 };
  }).filter(e => e.name);
}
function who(name) { const p = D().findPlayer(P, name); return { key: p ? p.id : 'raw:' + name, p, raw: name }; }
function bump(map, name, n, extra) {
  const w = who(name); const o = map[w.key] || (map[w.key] = Object.assign({ p: w.p, raw: name, n: 0 }, extra || {}));
  o.n += n; return o;
}

function aggregate(list) {
  const A = { apps: {}, goals: {}, assists: {}, mvp: {}, yellow: {}, red: {}, gk: {} };

    const subs = Array.isArray(m.substitutes_in) ? m.substitutes_in : (m.bench_details || []).filter(b => b.subbed_in).map(b => b.player);
    starters.forEach(n => { const o = bump(A.apps, n, 1, { subs: 0 }); });
    subs.forEach(n => { const o = bump(A.apps, n, 1, { subs: 0 }); o.subs++; });
    entries(m.scorers).forEach(e => bump(A.goals, e.name, e.count));
    entries(m.assists).forEach(e => bump(A.assists, e.name, e.count));
    entries(m.mvp).forEach(e => bump(A.mvp, e.name, 1));
    entries(m.yellow_cards).forEach(e => bump(A.yellow, e.name, 1));

    String(m.goalkeepers || '').split(/[,、]/).map(x => x.trim()).filter(Boolean).forEach(g => {
      const mt = g.match(/^(.+?)\s*[(（]\s*(\d+)\s*[)）]$/);
      const name = mt ? mt[1].trim() : g, conc = mt ? parseInt(mt[2], 10) : ga;
      const o = bump(A.gk, name, conc, { played: 0 }); o.played++;
    });
  });
  return A;
}

function nameHtml(o) {
  const nm = o.p ? D().playerName(o.p, YC.lang()) : o.raw;
  return `<span class="rank-name">${esc(nm)}</span>${o.p ? '' : `<span class="trial-badge">${t('s.trial')}</span>`}`;
}
function rankCard(id, icon, title, hint, rows, valFn, sortFn) {
  const list = rows.slice().sort(sortFn);
  const open = expanded[id], shown = open ? list : list.slice(0, 5);
  let body = shown.length ? shown.map((o, i) => `<li class="ranking-item"><div class="rank-left"><span class="rank-number ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</span>${nameHtml(o)}</div><div class="rank-val">${valFn(o)}</div></li>`).join('') : `<li class="empty">${t('s.no_data')}</li>`;
  const btn = list.length > 5 ? `<button class="more-btn" data-more="${id}">${open ? t('s.less') : t('s.more')}</button>` : '';
  return `<div class="ranking-card"><h3 class="ranking-title"><i class="fas ${icon}"></i> ${title} ${hint ? `<small style="font-family:var(--font-main);font-size:.7rem;color:#64748b">${hint}</small>` : ''}</h3><ul class="ranking-list">${body}</ul>${btn}</div>`;
}

function renderKpis(list) {
  const r = tally(list), k = (v, key) => `<div class="kpi"><b>${v}</b><span>${t(key)}</span></div>`;
  document.getElementById('kpis').innerHTML = k(r.p, 's.k_played') + k(`${r.w}-${r.d}-${r.l}`, 's.k_wdl') + k(`${r.gf}-${r.ga}`, 's.k_goals') + k(r.win + '%', 's.k_winrate') + k(r.clean, 's.k_clean');
}

function renderForm(list) {
  const last = list.slice(-5);
  if (!last.length) { document.getElementById('formBox').innerHTML = `<p class="empty">${t('s.no_data')}</p>`; return; }
  const dots = last.map(m => {
    const res = D().result(m), s = D().scoreParts(m), o = D().oppInfo(m, YC.lang(), OPP).name;
    return `<span class="form-dot ${res}" title="${esc(m.date + ' · vs ' + o + ' · ' + s.text)}">${res === 'W' ? 'V' : res === 'D' ? 'N' : 'P'}</span>`;
  }).join('');
  const last10 = list.slice(-10), max = Math.max(1, ...last10.map(m => Math.max(D().scoreParts(m).ours || 0, D().scoreParts(m).theirs || 0)));
  const bars = last10.map(m => {
    const s = D().scoreParts(m);
    return `<div class="goal-bar" title="${esc(m.date + ' ' + s.text)}"><div class="cols"><i class="gf" style="height:${(s.ours || 0) / max * 100}%"></i><i class="ga" style="height:${(s.theirs || 0) / max * 100}%"></i></div><span>${esc(String(m.date).slice(5).replace('-', '/'))}</span></div>`;
  }).join('');
  document.getElementById('formBox').innerHTML = `<div class="form-strip">${dots}</div><div class="goal-bars" aria-label="${t('s.last5')}">${bars}</div><p class="lineup-note"><i class="fas fa-square" style="color:#12A0D7"></i> ${t('s.th_gf')} &nbsp; <i class="fas fa-square" style="color:#f87171"></i> ${t('s.th_ga')}</p>`;
}

function renderRecord(sm, cm) {
  const rows = [['friendly', 'row_friendly'], ['league', 'row_league'], ['cup', 'row_cup']].map(([c, k]) => ({ c, k, r: tally(sm.filter(m => D().normCat(m.category) === c)) })).filter(x => x.r.p > 0 || ui.comp === x.c);
  const tot = tally(sm);
  const th = ['th_cat', 'th_p', 'th_w', 'th_d', 'th_l', 'th_gf', 'th_ga', 'th_win'].map((k, i) => `<th class="${i ? '' : 'left'}">${t('s.' + k)}</th>`).join('');
  const tr = (label, r, hl) => `<tr class="${hl ? 'hl' : ''}"><td class="left"><b>${label}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td><b>${r.win}%</b></td></tr>`;
  document.getElementById('recordBox').innerHTML = `<table class="stats-table"><thead><tr>${th}</tr></thead><tbody>${rows.map(x => tr(t('s.' + x.k), x.r, ui.comp === x.c)).join('')}${tr(t('s.row_total'), tot, ui.comp === 'all')}</tbody></table>`;
  const dr = (label, r, hl) => `<tr class="${hl ? 'hl' : ''}"><td class="left"><b>${label}</b></td><td>${r.y}</td><td>${r.rd}</td><td>${r.p ? ((r.y + r.rd) / r.p).toFixed(1) : '0.0'}</td></tr>`;
  document.getElementById('discBox').innerHTML = `<table class="stats-table"><thead><tr><th class="left">${t('s.th_cat')}</th><th>${t('s.th_y')}</th><th>${t('s.th_r')}</th><th>${t('s.th_avg')}</th></tr></thead><tbody>${rows.map(x => dr(t('s.' + x.k), x.r, ui.comp === x.c)).join('')}${dr(t('s.row_total'), tot, ui.comp === 'all')}</tbody></table>`;
}

function renderStandings() {
  const panel = document.getElementById('standingsPanel'), box = document.getElementById('standingsBox');
  panel.style.display = (ui.comp === 'cup' || ui.comp === 'friendly') ? 'none' : '';
  const data = STAND[ui.season];
  const teams = Array.isArray(data) ? data : (data && data.teams) || [];
  if (!teams.length) { box.innerHTML = `<p class="empty">${t('s.no_standings')}</p>`; return; }
  const rows = teams.map(x => Object.assign({}, x, { pts: x.wins * 3 + x.draws, gd: x.gf - x.ga })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  const name = data && data.league_name ? `<p class="sub-title" style="margin-top:0">${esc(data.league_name)}</p>` : '';
  box.innerHTML = name + `<div class="stats-table-wrapper"><table class="stats-table"><thead><tr><th>${t('s.pos')}</th><th class="left">${t('s.team')}</th><th>${t('s.th_p')}</th><th>${t('s.th_w')}</th><th>${t('s.th_d')}</th><th>${t('s.th_l')}</th><th>${t('s.th_gf')}</th><th>${t('s.th_ga')}</th><th>${t('s.gd')}</th><th>${t('s.pts')}</th></tr></thead><tbody>` +
    rows.map((x, i) => `<tr class="${/yokohama\s*calcio|ヨコハマ・?カルチョ/i.test(x.team) ? 'hl' : ''}"><td><b>${i + 1}</b></td><td class="left">${esc(x.team)}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd > 0 ? '+' + x.gd : x.gd}</td><td><b>${x.pts}</b></td></tr>`).join('') + '</tbody></table></div>';
}

function renderLineup(list) {
  const box = document.getElementById('lineupBox');
  const withLineup = list.filter(m => m.formation && m.starters_positions && FORMATIONS[m.formation]);
  if (!withLineup.length) { box.innerHTML = `<p class="empty">${t('s.no_lineup')}</p>`; return; }

  const cnt = {};
  withLineup.forEach(m => { cnt[m.formation] = (cnt[m.formation] || 0) + 1; });
  const formation = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const used = withLineup.filter(m => m.formation === formation);
  const slots = FORMATIONS[formation], tally2 = {};

  used.forEach(m => Object.entries(m.starters_positions).forEach(([slot, name]) => {
    const w = who(name);
    ((tally2[slot] = tally2[slot] || {})[w.key] = tally2[slot][w.key] || { w, n: 0 }).n++;
  }));

  const taken = new Set(), pick = {};
  Object.keys(slots).forEach(slot => {
    const cands = Object.values(tally2[slot] || {}).sort((a, b) => b.n - a.n).filter(c => !taken.has(c.w.key));
    if (cands[0]) { pick[slot] = cands[0]; taken.add(cands[0].w.key); }
  });

  const chips = Object.entries(slots).map(([slot, [x, y]]) => {
    const c = pick[slot];
    if (!c) return `<div class="lineup-chip empty" style="left:${x}%;top:${y}%"><div class="num">?</div><div class="nm">${slot}</div></div>`;
    const p = c.w.p, nm = p ? D().playerName(p, YC.lang()) : c.w.raw;
    const short = String(nm).split(/\s+/)[0];
    return `<div class="lineup-chip" style="left:${x}%;top:${y}%" title="${esc(nm)} · ${c.n}/${used.length}"><div class="num">${p && p.number != null ? p.number : '·'}</div><div class="nm">${esc(short)}</div></div>`;
  }).join('');

  const list2 = Object.entries(slots).map(([slot]) => {
    const c = pick[slot];
    if (!c) return '';
    const p = c.w.p;
    return `<tr><td class="left"><b>${slot}</b></td><td class="left">${esc(p ? D().playerName(p, YC.lang()) : c.w.raw)}</td><td class="num">${c.n}/${used.length}</td></tr>`;
  }).join('');

  box.innerHTML = `<div class="lineup-wrap">
    <div>
      <div class="lineup-pitch">${chips}</div>
    </div>
    <div>
      <table class="mini-table">
        <thead>
          <tr><th>#</th><th>${t('s.th_cat') === '' ? '' : ''}</th><th class="num">${t('s.k_played')}</th></tr>
        </thead>
        <tbody>${list2}</tbody>
      </table>
      <p class="lineup-note">${t('s.lineup_note').replace('{n}', used.length).replace('{f}', formation)}</p>
    </div>
  </div>`;
}

function renderH2H(list) {
  const g = {};
  list.forEach(m => { const s = D().scoreParts(m); if (s.ours == null) return; const r = g[m.opponent_id] || (g[m.opponent_id] = { m, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 }); r.p++; r.gf += s.ours; r.ga += s.theirs; s.ours > s.theirs ? r.w++ : s.ours === s.theirs ? r.d++ : r.l++; });
  const rows = Object.values(g).sort((a, b) => b.p - a.p || b.w - a.w);
  document.getElementById('h2hBox').innerHTML = rows.length ? `<table class="mini-table"><thead><tr><th>${t('s.th_opp')}</th><th class="num">${t('s.th_p')}</th><th class="num">${t('s.th_w')}-${t('s.th_d')}-${t('s.th_l')}</th><th class="num">${t('s.th_gf')}-${t('s.th_ga')}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(D().oppInfo(r.m, YC.lang(), OPP).name)}</td><td class="num">${r.p}</td><td class="num">${r.w}-${r.d}-${r.l}</td><td class="num">${r.gf}-${r.ga}</td></tr>`).join('')}</tbody></table>` : `<p class="empty">${t('s.no_data')}</p>`;
}
function renderByFormation(list) {
  const g = {};
  list.forEach(m => { if (!m.formation) return; (g[m.formation] = g[m.formation] || []).push(m); });
  const rows = Object.entries(g).map(([f, l]) => [f, tally(l)]).sort((a, b) => b[1].p - a[1].p);
  document.getElementById('formationBox').innerHTML = rows.length ? `<table class="mini-table"><thead><tr><th>${t('s.th_form')}</th><th class="num">${t('s.th_p')}</th><th class="num">${t('s.th_w')}-${t('s.th_d')}-${t('s.th_l')}</th><th class="num">${t('s.th_gf')}-${t('s.th_ga')}</th></tr></thead><tbody>${rows.map(([f, r]) => `<tr><td><b>${esc(f)}</b></td><td class="num">${r.p}</td><td class="num">${r.w}-${r.d}-${r.l}</td><td class="num">${r.gf}-${r.ga}</td></tr>`).join('')}</tbody></table>` : `<p class="empty">${t('s.no_data')}</p>`;
}

function renderRankings(list) {
  const A = aggregate(list), V = Object.values, n = list.length;
  const byN = (a, b) => b.n - a.n || ((b.p && b.p.caps) || 0) - ((a.p && a.p.caps) || 0);
  const unit = u => o => `${o.n} ${t(u)}`;
  const gkRows = V(A.gk).filter(o => !o.p || o.p.role === 'gk').map(o => Object.assign(o, { avg: o.played ? o.n / o.played : 0 }));
  document.getElementById('rankings').innerHTML =
    rankCard('apps', 'fa-running', t('s.r_apps'), t('s.r_apps_hint'), V(A.apps), o => `${o.n}${o.subs ? ` <small>(${o.subs})</small>` : ''}<small>${n ? Math.round(o.n / n * 100) : 0}%</small>`, (a, b) => b.n - a.n || a.subs - b.subs) +
    rankCard('goals', 'fa-futbol', t('s.r_goals'), '', V(A.goals), unit('s.u_goals'), byN) +
    rankCard('assists', 'fa-shoe-prints', t('s.r_assists'), '', V(A.assists), unit('s.u_assists'), byN) +
    rankCard('gk', 'fa-shield-halved', t('s.r_gk'), '', gkRows, o => `${o.n} ${t('s.u_conceded')} <small>(${o.played} ${t('s.u_matches')}) · ${t('s.avg')} ${o.avg.toFixed(2)}</small>`, (a, b) => a.avg - b.avg || a.n - b.n) +
    rankCard('mvp', 'fa-star', t('s.r_mvp'), '', V(A.mvp), unit('s.u_mvp'), byN) +
    rankCard('yellow', 'fa-square', t('s.r_yellow'), '', V(A.yellow), unit('s.u_cards'), byN) +
    rankCard('red', 'fa-square', t('s.r_red'), '', V(A.red), unit('s.u_cards'), byN);
}

function renderControls() {
  const years = [...new Set(M.map(m => String(m.date).slice(0, 4)).concat(YC.todayJST().slice(0, 4)))].sort().reverse();
  document.getElementById('season').innerHTML = `<option value="all" ${ui.season === 'all' ? 'selected' : ''}>${t('s.all_seasons')}</option>` + years.map(y => `<option value="${y}" ${ui.season === y ? 'selected' : ''}>${y}</option>`).join('');
  document.getElementById('compPills').innerHTML = ['all', 'league', 'cup', 'friendly'].map(c => `<button type="button" class="pill ${ui.comp === c ? 'active' : ''}" data-comp="${c}">${t('s.comp_' + c)}</button>`).join('');
}
function render() {
  const sm = seasonMatches(), cm = compMatches();
  renderControls(); renderKpis(cm); renderForm(cm); renderRecord(sm, cm); renderStandings();
  renderLineup(cm); renderH2H(cm); renderByFormation(cm); renderRankings(cm);
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-comp]'); if (c) { ui.comp = c.dataset.comp; Object.keys(expanded).forEach(k => delete expanded[k]); render(); return; }
  const m = e.target.closest('[data-more]'); if (m) { expanded[m.dataset.more] = !expanded[m.dataset.more]; renderRankings(compMatches()); }
});
document.getElementById('season').addEventListener('change', e => { ui.season = e.target.value; Object.keys(expanded).forEach(k => delete expanded[k]); render(); });

Promise.all([YC.data.load(['matches', 'players', 'opponents']), YC.fetchJson('standings.json', {})]).then(([d, st]) => {
  M = Array.isArray(d.matches) ? d.matches : []; P = Array.isArray(d.players) ? d.players : []; OPP = d.opponents || {}; STAND = st || {};
  const years = M.map(m => String(m.date).slice(0, 4)); if (ui.season !== 'all' && !years.includes(ui.season)) ui.season = 'all';
  ready = true; render();
});
document.addEventListener('yc:langchange', () => ready && render());
</script>
</body>
</html>
