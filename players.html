    <style>
        .player-card {
            perspective: 1000px;
            -webkit-perspective: 1000px;
            height: 400px;
            cursor: pointer;
        }

        .player-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .player-card.is-flipped .player-card-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        .player-card-front,
        .player-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .player-card-front {
            z-index: 2;
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);
        }

        .player-card-back {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            background: #fafafa;
            z-index: 1;
        }

        /* BODY A TUTTA SCHEDA TIPO RETRO MAGLIA */
        .player-body-jersey {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centra il numero perfettamente */
            background: linear-gradient(135deg, #12A0D7 0%, #0d7aa5 100%);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.12);
        }

        /* Trama striata stile tessuto maglia */
        .player-body-jersey::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.05),
                rgba(255, 255, 255, 0.05) 2px,
                transparent 2px,
                transparent 6px
            );
            pointer-events: none;
        }

        /* MAGLIA PORTIERE #32CD62 */
        .player-body-jersey.jersey-gk {
            background: linear-gradient(135deg, #32CD62 0%, #28a74e 100%);
        }

        .player-body-jersey.jersey-staff {
            background: linear-gradient(135deg, #db2777 0%, #9d1751 100%);
        }

        /* COGNOME - SPOSTATO IN ALTO, FONT OSWALD, PIÙ GRANDE */
        .jersey-surname-large {
            font-family: 'Oswald', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
            
            /* Posizionamento in alto assoluto */
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            
            /* Bordatura pulita multi-direzionale in Blu Scuro per giocatori di movimento */
            text-shadow: 
                -1.5px -1.5px 0 #00224a,
                 1.5px -1.5px 0 #00224a,
                -1.5px  1.5px 0 #00224a,
                 1.5px  1.5px 0 #00224a,
                 0px    2px 5px rgba(0,0,0,0.4);
        }

        /* NUMERO DI MAGLIA - CENTRATO E LEGGERMENTE INGRANDITO */
        .jersey-number-large {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 7rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            z-index: 1;
            /* Bordatura pulita multi-direzionale in Blu Scuro */
            text-shadow: 
                -2px -2px 0 #00224a,
                 2px -2px 0 #00224a,
                -2px  2px 0 #00224a,
                 2px  2px 0 #00224a,
                 0px   3px 8px rgba(0,0,0,0.4);
        }

        /* BORDATURA NERA SPECIFICA PER I PORTIERI */
        .jersey-gk .jersey-surname-large {
            text-shadow: 
                -1.5px -1.5px 0 #000000,
                 1.5px -1.5px 0 #000000,
                -1.5px  1.5px 0 #000000,
                 1.5px  1.5px 0 #000000,
                 0px    2px 5px rgba(0,0,0,0.5);
        }

        .jersey-gk .jersey-number-large {
            text-shadow: 
                -2px -2px 0 #000000,
                 2px -2px 0 #000000,
                -2px  2px 0 #000000,
                 2px  2px 0 #000000,
                 0px   3px 8px rgba(0,0,0,0.5);
        }

        .player-name-block-front {
            text-align: center;
            padding: 10px 16px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            z-index: 2;
        }

        .player-name-kanji {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--dark-navy, #003c82);
            margin-bottom: 2px;
        }

        .player-name-romaji {

        }

        .player-flip-indicator {
            background: #f1f5f9;
            color: var(--dark-navy, #003c82);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-top: 1px solid #e2e8f0;
            width: 100%;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            z-index: 2;
        }

        .player-flip-indicator i {
            transition: transform 0.4s ease;
        }

        .player-card:hover .player-flip-indicator {
            background: var(--dark-navy, #003c82);
            color: #ffffff;
        }

        .player-card:hover .player-flip-indicator i {
            transform: rotate(180deg);
        }

        .player-back-name-block {

            padding: 16px 16px 8px;
            background: #fafafa;
        }

        .player-details-inner {
            padding: 12px 14px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.83rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #475569;
            gap: 8px;
        }

        .player-detail-row strong {
            text-align: right;

        .role-badge-back {
            display: inline-flex;

    function calculateAge(birthDate) {
        if (!birthDate) return '-';
        const today = new Date();
        const birth = new Date(birthDate);
        if (isNaN(birth.getTime())) return '-';
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
        return age;
    }

    function cleanStr(s) {
        return String(s || '').toLowerCase().replace(/[\s\u3000]+/g, '').trim();
    }

    function getRoleAbbreviation(position, role, lang) {
        if (role === 'staff') return 'MGR';
        if (lang === 'it') {
            const mapIT = {
                'GK': 'Por', 'CB': 'DC', 'SB': 'Ter', 'CM': 'CC', 'SH': 'Est', 'CAM': 'Trq', 'FW': 'PC',
                'SB / SH': 'Ter / Est', 'CM / SB': 'CC / Ter', 'CM / SH': 'CC / Est', 'CM / CB': 'CC / DC',
                'SH / SB': 'Est / Ter', 'CM / CAM': 'CC / Trq', 'SH / FW': 'Est / PC', 'CM / FW': 'CC / PC',
                'FW / SH': 'PC / Est', 'FW / SB': 'PC / Ter', 'FW / SH / CAM': 'PC / Trq',
                'SB / CM / CAM': 'Ter / CC / Trq', 'FW / SH / CM': 'PC / Est / CC'
            };
            return mapIT[position] || position || 'GIO';
        }
        return position || role.toUpperCase();
    }

    function getSurnameRomaji(nameRomaji, nameKanji) {
        const raw = (nameRomaji && nameRomaji !== '-') ? nameRomaji : nameKanji;
        if (!raw || raw === '-') return 'YOKOHAMA';
        
        const parts = raw.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].toUpperCase();

        const prefixes = ['di', 'de', 'da', 'del', 'della', 'van', 'von', 'san', 'st.'];
        if (parts.length >= 2 && prefixes.includes(parts[0].toLowerCase())) {
            return (parts[0] + ' ' + parts[1]).toUpperCase();
        }

        return parts[0].toUpperCase();
    }

        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (translations[lang][key]) elem.innerHTML = translations[lang][key];
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        document.querySelectorAll('.player-card').forEach(card => {
            const kana = card.getAttribute('data-player-kana');
            const romaji = card.getAttribute('data-player-romaji');
            const pos = card.getAttribute('data-player-pos');
            const role = card.getAttribute('data-player-role');
            
            const displayName = (lang === 'ja') ? (kana || romaji || '-') : (romaji || kana || '-');
            card.querySelectorAll('.player-name-romaji').forEach(el => {
                el.textContent = displayName;
            });

            const badgeTextElem = card.querySelector('.role-badge-text');
            if (badgeTextElem) {
                badgeTextElem.textContent = getRoleAbbreviation(pos, role, lang);
            }
        });

        document.querySelectorAll('[data-hometown]').forEach(elem => {
            const rawCode = elem.getAttribute('data-hometown') || '';
            const code = rawCode.toLowerCase().trim();
            if (prefList[code]) {
                elem.textContent = prefList[code][lang] || prefList[code]['ja'];
            } else {
                elem.textContent = rawCode === '-' || !rawCode ? '-' : rawCode;
            }
        });

        document.querySelectorAll('[data-age]').forEach(elem => {
            const num = elem.getAttribute('data-age');
            const unit = translations[lang]['unit.age'];
            if (num === '-') {
                elem.textContent = '-';
            } else {
                elem.textContent = `${num} ${unit}`;
            }
        });
    }

    function findPlayerObj(query) {
        if (!query || query === 'なし' || query === 'Nessuno') return null;
        if (!globalPlayers || globalPlayers.length === 0) return null;

        const target = cleanStr(query);
        if (!target) return null;

        let found = globalPlayers.find(p => {
            const k = cleanStr(p.name_kanji);
            const kn = cleanStr(p.name_kana);
            const r = cleanStr(p.name_romaji);
            return (k && k === target) || (kn && kn === target) || (r && r === target);
        });

        if (found) return found;

        return globalPlayers.find(p => {
            const k = cleanStr(p.name_kanji);
            const kn = cleanStr(p.name_kana);
            const r = cleanStr(p.name_romaji);

            return (k && (k.includes(target) || target.includes(k))) ||
                   (kn && (kn.includes(target) || target.includes(kn))) ||
                   (r && (r.includes(target) || target.includes(r)));
        }) || null;
    }

    async function calculateStatsFromMatchesJSON() {
        try {
            const response = await fetch('matches.json');
            if (!response.ok) return;
            const matches = await response.json();

            const goalCounts = {}, assistCounts = {}, mvpCounts = {}, yellowCounts = {}, redCounts = {}, goalkeeperStats = {};

            const addStat = (map, rawName, count = 1) => {
                if (!rawName) return;
                let cleanName = rawName.trim();
                if (!cleanName || cleanName === 'なし' || cleanName === 'Nessuno') return;

                let countToAdd = count;
                const multMatch = cleanName.match(/(.*?)\s*(?:x|\*|\()(\d+)\)?$/i);
                if (multMatch) {
                    cleanName = multMatch[1].trim();
                    countToAdd = parseInt(multMatch[2], 10) || count;
                }

                if (!cleanName) return;

                const pObj = findPlayerObj(cleanName);
                const key = pObj ? (pObj.id || pObj.number || pObj.name_kanji) : cleanName;

                map[key] = (map[key] || 0) + countToAdd;
            };

            const recordGKStat = (gkRawName, gaGoals) => {
                if (!gkRawName) return;
                const pObj = findPlayerObj(gkRawName);
                const key = pObj ? (pObj.id || pObj.number || pObj.name_kanji) : gkRawName;

                if (!goalkeeperStats[key]) {
                    goalkeeperStats[key] = { appearances: 0, goals_conceded: 0, clean_sheets: 0 };
                }
                goalkeeperStats[key].appearances += 1;
                goalkeeperStats[key].goals_conceded += gaGoals;
                if (gaGoals === 0) {
                    goalkeeperStats[key].clean_sheets += 1;
                }
            };

            matches.forEach(m => {
                if (m.status !== 'past') return;

                let matchGA = 0;
                const scoreText = m.score ? m.score.trim() : '';
                if (scoreText && scoreText.includes('-')) {
                    const parts = scoreText.split('-').map(n => parseInt(n.trim(), 10));
                    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                        const isHome = m.isHome !== undefined ? m.isHome : true;
                        matchGA = isHome ? parts[1] : parts[0];
                    }
                }

                if (m.scorers && m.scorers !== 'なし' && m.scorers !== 'Nessuno') {
                    const entries = m.scorers.split(/[,、]/);
                    entries.forEach(entry => {
                        let text = entry.trim();
                        if (!text) return;

                        let assistName = '';
                        const parenthesisedMatch = text.match(/^([^(（]+)[(（]([^)）]+)[)）]\s*(.*)$/);
                        if (parenthesisedMatch) {
                            text = (parenthesisedMatch[1] + ' ' + parenthesisedMatch[3]).trim();
                            assistName = parenthesisedMatch[2].trim();
                        }

                        if (text) addStat(goalCounts, text);
                        if (assistName) addStat(assistCounts, assistName);
                    });
                }

                if (m.mvp && m.mvp !== 'なし' && m.mvp !== 'Nessuno') {
                    m.mvp.split(/[,、]/).forEach(name => addStat(mvpCounts, name));
                }

                if (m.yellow_cards && m.yellow_cards !== 'なし' && m.yellow_cards !== 'Nessuno') {
                    m.yellow_cards.split(/[,、]/).forEach(name => addStat(yellowCounts, name));
                }

                if (m.red_cards && m.red_cards !== 'なし' && m.red_cards !== 'Nessuno') {
                    m.red_cards.split(/[,、]/).forEach(name => addStat(redCounts, name));
                }

                let handledGK = false;
                if (m.goalkeepers && m.goalkeepers.trim() !== '') {
                    m.goalkeepers.split(/[,、]/).forEach(entry => {
                        const clean = entry.trim();
                        if (!clean) return;

                        const match = clean.match(/^([^(（]+)[(（]\s*(\d+)\s*[)）]$/);
                        if (match) {
                            const rawGkName = match[1].trim();
                            const gkGoals = parseInt(match[2], 10);
                            recordGKStat(rawGkName, isNaN(gkGoals) ? matchGA : gkGoals);
                            handledGK = true;
                        } else {
                            recordGKStat(clean, matchGA);
                            handledGK = true;
                        }
                    });
                }

                if (!handledGK && globalPlayers && globalPlayers.length > 0) {
                    const defaultGK = globalPlayers.find(p => p.role === 'gk');
                    if (defaultGK) {
                        const key = defaultGK.id || defaultGK.number || defaultGK.name_kanji;
                        if (!goalkeeperStats[key]) {
                            goalkeeperStats[key] = { appearances: 0, goals_conceded: 0, clean_sheets: 0 };
                        }
                        goalkeeperStats[key].appearances += 1;
                        goalkeeperStats[key].goals_conceded += matchGA;
                        if (matchGA === 0) goalkeeperStats[key].clean_sheets += 1;
                    }
                }
            });

            document.querySelectorAll('.player-card').forEach(card => {
                const cardKey = card.getAttribute('data-player-id');
                const mainName = card.getAttribute('data-player-name');

                const pObj = findPlayerObj(mainName);
                const lookupKey = pObj ? (pObj.id || pObj.number || pObj.name_kanji) : cardKey;

                const goalElem = card.querySelector('[data-stat="goals"]');
                const assistElem = card.querySelector('[data-stat="assists"]');
                const mvpElem = card.querySelector('[data-stat="mvps"]');
                const yellowElem = card.querySelector('[data-stat="yellows"]');
                const redElem = card.querySelector('[data-stat="reds"]');
                const gkGoalElem = card.querySelector('[data-stat="goals_conceded"]');
                const cleanSheetElem = card.querySelector('[data-stat="clean_sheets"]');

                if (goalElem) goalElem.textContent = goalCounts[lookupKey] || 0;
                if (assistElem) assistElem.textContent = assistCounts[lookupKey] || 0;
                if (mvpElem) mvpElem.textContent = mvpCounts[lookupKey] || 0;
                if (yellowElem) yellowElem.textContent = yellowCounts[lookupKey] || 0;
                if (redElem) redElem.textContent = redCounts[lookupKey] || 0;

                if (goalkeeperStats[lookupKey]) {
                    if (gkGoalElem) gkGoalElem.textContent = goalkeeperStats[lookupKey].goals_conceded;
                    if (cleanSheetElem) cleanSheetElem.textContent = goalkeeperStats[lookupKey].clean_sheets;
                }
            });

        } catch (e) {
            console.error("Errore nel calcolo statistiche giocatori:", e);
        }
    }

    async function populatePlayers(players) {
        globalPlayers = players;
        const sections = { gk: [], df: [], mf: [], fw: [], staff: [] };
        players.forEach(p => {
            if (sections[p.role]) sections[p.role].push(p);
        });

        Object.keys(sections).forEach(role => {
            const container = document.getElementById(`players-${role}`);
            if (container) container.innerHTML = sections[role].map(createPlayerCard).join('');
        });

        setLanguage(currentLang);
        await calculateStatsFromMatchesJSON();
    }

    async function loadPlayersJSON() {
        try {
            const response = await fetch('players.json');
            if (!response.ok) throw new Error('Errore nella fetch');
            const players = await response.json();
            await populatePlayers(players);
        } catch (error) {
            console.error('Errore nel caricamento dei giocatori:', error);
        }
    }
