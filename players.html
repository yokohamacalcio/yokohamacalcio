    <style>
        .player-card {
            position: relative;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .player-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }

        .player-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: var(--dark-navy, #003c82);
            line-height: 1;
        }

        .role-badge-tactical {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .role-badge-gk { background: #16a34a; }
        .role-badge-df { background: #0284c7; }
        .role-badge-mf { background: #d97706; }
        .role-badge-fw { background: #dc2626; }
        .role-badge-staff { background: #db2777; }

        .player-body {
            padding: 16px;
            text-align: center;
            flex-grow: 1;
        }

        .player-photo {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e2e8f0;
        }

        .player-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-name-kanji {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--dark-navy, #003c82);
            margin-bottom: 2px;
        }

        .player-name-romaji {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .player-expand-btn {
            background: #f1f5f9;
            color: var(--dark-navy, #003c82);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #e2e8f0;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .player-card:hover .player-expand-btn {
            background: var(--primary-sky, #12a0d7);
            color: #ffffff;
        }

        .player-expand-btn i.arrow-icon {
            transition: transform 0.3s ease;
        }

        .player-card.active .player-expand-btn i.arrow-icon {
            transform: rotate(180deg);
        }

        .player-details-expand {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
            background: #fafafa;
        }

        .player-card.active .player-details-expand {
            max-height: 480px;
            transition: max-height 0.4s cubic-bezier(1, 0, 1, 0);
        }

        .player-details-inner {
            padding: 12px 14px;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.83rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #475569;
            gap: 8px;
        }

        .player-detail-row strong {
            text-align: right;
            margin-left: auto;
            word-break: break-word;
        }

        .stats-highlight {
            font-weight: 700;
            color: var(--dark-navy, #003c82);
        }

    function calculateAge(birthDate) {
        if (!birthDate) return '-';
        const today = new Date();
        const birth = new Date(birthDate);
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
            age--;
        }
        return age;
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;
        localStorage.setItem('preferred_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (translations[lang][key]) {
                elem.innerHTML = translations[lang][key];
            }
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        document.querySelectorAll('.player-card').forEach(card => {
            const kana = card.getAttribute('data-player-kana');
            const romaji = card.getAttribute('data-player-romaji');
            const romajiElem = card.querySelector('.player-name-romaji');
            if (romajiElem) {
                romajiElem.textContent = (lang === 'ja') ? kana : romaji;
            }
        });

        document.querySelectorAll('[data-hometown]').forEach(elem => {
            const code = elem.getAttribute('data-hometown');
            const key = `hometown.${code}`;
            if (translations[lang][key]) {
                elem.textContent = translations[lang][key];
            } else {
                elem.textContent = code; // fallback al valore originale
            }
        });

        document.querySelectorAll('[data-age]').forEach(elem => {
            const num = elem.getAttribute('data-age');
            const unit = translations[lang]['unit.age'];
            if (num === '-') {
                elem.textContent = '-';
            } else {
                elem.textContent = `${num} ${unit}`;
            }
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
        });
    });

    function createPlayerCard(player) {
        const isStaff = player.role === 'staff';
        const numberDisplay = player.number ? `#${player.number}` : '#-';
        const roleClass = `role-badge-${player.role}`;

        const roleIcons = {
            gk: 'fa-hands',
            df: 'fa-shield-alt',
            mf: 'fa-running',
            fw: 'fa-bullseye',
            staff: 'fa-clipboard-list'
        };
        const roleIcon = roleIcons[player.role] || 'fa-user';
        const avatarBg = {
            gk: '16a34a',
            df: '0284c7',
            mf: 'd97706',
            fw: 'dc2626',
            staff: 'f472b6'
        }[player.role] || '003C82';
        const initials = player.name_romaji.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const avatarUrl = `https://ui-avatars.com/api/?name=${initials}&background=${avatarBg}&color=ffffff&size=200&bold=true`;
        const hometownCode = player.hometown || 'unknown';
        const age = calculateAge(player.birth_date);
        const roleLabel = isStaff ? 'MGR' : player.position;

        let detailsRows = '';
        if (isStaff) {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.staff_role">役割:</span> <strong data-i18n="role.manager">マネージャー</strong></div>
            `;
        } else if (player.role === 'gk') {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.role_detail">役割:</span> <strong>${player.position}</strong></div>
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.age">年齢:</span> <strong data-age="${age}">${age} 歳</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-shield-halved"></i> <span data-i18n="label.goals_conceded">失点:</span></span> <strong class="stats-highlight" data-stat="goals_conceded">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-lock"></i> <span data-i18n="label.clean_sheets">クリーンシート:</span></span> <strong class="stats-highlight" data-stat="clean_sheets">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-star" style="color: #f59e0b;"></i> MVP:</span> <strong class="stats-highlight" data-stat="mvps">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #f59e0b;"></i> <span data-i18n="label.yellows">警告:</span></span> <strong class="stats-highlight" data-stat="yellows">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #ef4444;"></i> <span data-i18n="label.reds">退場:</span></span> <strong class="stats-highlight" data-stat="reds">0</strong></div>
            `;
        } else {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.role_detail">役割:</span> <strong>${player.position}</strong></div>
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.age">年齢:</span> <strong data-age="${age}">${age} 歳</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-futbol" style="color: var(--dark-navy);"></i> <span data-i18n="label.goals">得点:</span></span> <strong class="stats-highlight" data-stat="goals">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-shoe-prints" style="color: var(--primary-sky);"></i> <span data-i18n="label.assists">アシスト:</span></span> <strong class="stats-highlight" data-stat="assists">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-star" style="color: #f59e0b;"></i> MVP:</span> <strong class="stats-highlight" data-stat="mvps">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #f59e0b;"></i> <span data-i18n="label.yellows">警告:</span></span> <strong class="stats-highlight" data-stat="yellows">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #ef4444;"></i> <span data-i18n="label.reds">退場:</span></span> <strong class="stats-highlight" data-stat="reds">0</strong></div>
            `;
        }

        return `
            <div class="player-card" data-player-name="${player.name_kanji}" data-player-kana="${player.name_kana}" data-player-romaji="${player.name_romaji}">
                <div class="player-card-header">
                    <span class="player-number">${numberDisplay}</span>
                    <span class="role-badge-tactical ${roleClass}"><i class="fas ${roleIcon}"></i> ${roleLabel}</span>
                </div>
                <div class="player-body">
                    <div class="player-photo">
                        <img src="${avatarUrl}" alt="${player.name_kanji}">
                    </div>
                    <div class="player-name-kanji">${player.name_kanji}</div>
                    <div class="player-name-romaji">${player.name_kana}</div>
                </div>
                <div class="player-expand-btn">
                    <span><i class="fas fa-chart-bar"></i> <span data-i18n="${isStaff ? 'btn.details_staff' : 'btn.details'}">${isStaff ? '詳細情報' : '詳細・個人成績'}</span></span>
                    <i class="fas fa-chevron-down arrow-icon"></i>
                </div>
                <div class="player-details-expand">
                    <div class="player-details-inner">
                        ${detailsRows}
                    </div>
                </div>
            </div>
        `;
    }

    function populatePlayers(players) {
        const sections = { gk: [], df: [], mf: [], fw: [], staff: [] };
        players.forEach(p => {
            if (sections[p.role]) sections[p.role].push(p);
        });

        Object.keys(sections).forEach(role => {
            const container = document.getElementById(`players-${role}`);
            if (container) {
                container.innerHTML = sections[role].map(createPlayerCard).join('');
            }
        });

        setLanguage(currentLang);
        calculateStatsFromMatchesJSON();
    }

    async function loadPlayersJSON() {
        try {
            const response = await fetch('players.json');
            if (!response.ok) throw new Error('Errore nella fetch');
            const players = await response.json();
            populatePlayers(players);
        } catch (error) {
            console.error('Errore nel caricamento dei giocatori:', error);
        }
    }

    let currentLang = localStorage.getItem('preferred_lang') || 'ja';

    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        loadPlayersJSON();
    });

    const menuBtn = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    
    if (menuBtn && mobileNav) {
        menuBtn.addEventListener('click', () => {
            mobileNav.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });

        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileNav.classList.add('hidden');
                const icon = menuBtn.querySelector('i');
                icon.classList.add('fa-bars');
                icon.classList.remove('fa-times');
            });
        });
    }

    document.addEventListener('click', (e) => {
        const card = e.target.closest('.player-card');
        if (card) {
            card.classList.toggle('active');
        }
    });

    const roleFilterBtns = document.querySelectorAll('[data-role-filter]');
    const roleSections = document.querySelectorAll('[data-role-section]');

    roleFilterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            roleFilterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filterVal = btn.getAttribute('data-role-filter');

            roleSections.forEach(section => {
                if (filterVal === 'all' || section.getAttribute('data-role-section') === filterVal) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        });
    });

    async function calculateStatsFromMatchesJSON() {
        try {
            const response = await fetch('matches.json');
            if (!response.ok) return;
            const matches = await response.json();

            const goalCounts = {};
            const assistCounts = {};
            const mvpCounts = {};
            const yellowCounts = {};
            const redCounts = {};
            const goalkeeperStats = {};

            const addStat = (map, name, count = 1) => {
                if (!name) return;
                const clean = name.trim();
                if (clean && clean !== 'なし' && clean !== 'Nessuno') {
                    map[clean] = (map[clean] || 0) + count;
                }
            };

            matches.forEach(m => {
                if (m.status !== 'past') return;

                if (m.scorers && m.scorers !== 'なし' && m.scorers !== 'Nessuno') {
                    m.scorers.split(',').forEach(entry => {
                        let text = entry.trim();
                        if (!text) return;
                        let assistName = '';
                        const assistMatch = text.match(/\(([^)]+)\)/) || text.match(/（([^）]+)）/);
                        if (assistMatch) {
                            assistName = assistMatch[1].trim();
                            text = text.replace(/\([^)]+\)/, '').replace(/（[^）]+）/, '').trim();
                        }
                        if (text) addStat(goalCounts, text);
                        if (assistName) addStat(assistCounts, assistName);
                    });
                }

                if (m.mvp && m.mvp !== 'なし' && m.mvp !== 'Nessuno') {
                    m.mvp.split(',').forEach(name => addStat(mvpCounts, name));
                }

                if (m.yellow_cards && m.yellow_cards !== 'なし' && m.yellow_cards !== 'Nessuno') {
                    m.yellow_cards.split(',').forEach(name => addStat(yellowCounts, name));
                }

                if (m.red_cards && m.red_cards !== 'なし' && m.red_cards !== 'Nessuno') {
                    m.red_cards.split(',').forEach(name => addStat(redCounts, name));
                }

                if (m.goalkeepers && m.goalkeepers !== '') {
                    m.goalkeepers.split(',').forEach(entry => {
                        const clean = entry.trim();
                        if (!clean) return;
                        const match = clean.match(/^(.+)\((\d+)\)$/);
                        if (match) {
                            const gkName = match[1].trim();
                            const gkGoals = parseInt(match[2], 10) || 0;
                            if (!goalkeeperStats[gkName]) {
                                goalkeeperStats[gkName] = { appearances: 0, goals_conceded: 0, clean_sheets: 0 };
                            }
                            goalkeeperStats[gkName].appearances += 1;
                            goalkeeperStats[gkName].goals_conceded += gkGoals;
                            if (gkGoals === 0) {
                                goalkeeperStats[gkName].clean_sheets += 1;
                            }
                        }
                    });
                }
            });

            document.querySelectorAll('.player-card').forEach(card => {
                const mainName = card.getAttribute('data-player-name');
                const kanaName = card.getAttribute('data-player-kana');
                const romajiName = card.getAttribute('data-player-romaji');

                const getStatValue = (map) => {
                    let total = 0;
                    if (mainName && map[mainName]) total += map[mainName];
                    if (kanaName && map[kanaName]) total += map[kanaName];
                    if (romajiName && map[romajiName]) total += map[romajiName];
                    return total;
                };

                const goalElem = card.querySelector('[data-stat="goals"]');
                const assistElem = card.querySelector('[data-stat="assists"]');
                const mvpElem = card.querySelector('[data-stat="mvps"]');
                const yellowElem = card.querySelector('[data-stat="yellows"]');
                const redElem = card.querySelector('[data-stat="reds"]');
                const gkGoalElem = card.querySelector('[data-stat="goals_conceded"]');
                const cleanSheetElem = card.querySelector('[data-stat="clean_sheets"]');

                if (goalElem) goalElem.textContent = getStatValue(goalCounts);
                if (assistElem) assistElem.textContent = getStatValue(assistCounts);
                if (mvpElem) mvpElem.textContent = getStatValue(mvpCounts);
                if (yellowElem) yellowElem.textContent = getStatValue(yellowCounts);
                if (redElem) redElem.textContent = getStatValue(redCounts);

                // Statistiche portiere
                const gkName = [mainName, kanaName, romajiName].find(n => goalkeeperStats[n]);
                if (gkName && gkGoalElem) {
                    gkGoalElem.textContent = goalkeeperStats[gkName].goals_conceded;
                }
                if (gkName && cleanSheetElem) {
                    cleanSheetElem.textContent = goalkeeperStats[gkName].clean_sheets;
                }
            });

        } catch (e) {
            console.error("Errore nel calcolo statistiche giocatori:", e);
        }
    }

    const topBtn = document.getElementById('scrollToTopBtn');
    if (topBtn) {
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                topBtn.classList.add('show');
            } else {
                topBtn.classList.remove('show');
            }
        });

        topBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    const yearSpan = document.getElementById('currentYear');
    if (yearSpan) {
        yearSpan.textContent = new Date().getFullYear();
    }
</script>
</body>
</html>
