  if (FOREIGN[c]) return FOREIGN[c][lang];
  if (JA_PREF[c]) { if (lang === 'ja') return JA_PREF[c]; const n = c[0].toUpperCase() + c.slice(1); return c === 'tokyo' ? n : (lang === 'it' ? 'Pref. di ' + n : n + ' Pref.'); }
  return code && code !== '-' ? code : '-';
}
function surname(p, all) {
  const raw = p.name_romaji || p.name_kanji || ''; const parts = raw.trim().split(/\s+/);
  const pre = ['di', 'de', 'da', 'del', 'della', 'van', 'von', 'san', 'st.'];
  const base = (parts.length > 1 && pre.includes(parts[0].toLowerCase())) ? (parts[0] + ' ' + parts[1]).toUpperCase() : (parts[0] || 'YOKOHAMA').toUpperCase();
  const dup = all.filter(x => { const r = (x.name_romaji || x.name_kanji || '').trim().split(/\s+/); return (r[0] || '').toUpperCase() === base || (r[0] + ' ' + r[1]).toUpperCase() === base; }).length > 1;
  return dup && parts.length > 1 ? base + ' ' + parts[parts.length - 1][0].toUpperCase() + '.' : base;
}
const stat = p => S[p.id] || {};
const ageOf = p => YC.data.age(p.birth_date);

function sortFn(a, b) {
  const lang = L(), sa = stat(a), sb = stat(b);
  switch (ui.sort) {
    case 'name': return YC.data.playerName(a, lang).localeCompare(YC.data.playerName(b, lang), lang);
    case 'caps': return (sb.caps || 0) - (sa.caps || 0) || (sb.starters || 0) - (sa.starters || 0);
    case 'goals': return ((sb.goals || 0) + (sb.assists || 0)) - ((sa.goals || 0) + (sa.assists || 0));
    case 'age': return (ageOf(a) ?? 99) - (ageOf(b) ?? 99);
    default: return (a.number ?? 9999) - (b.number ?? 9999);
  }
}
function matches(p) {
  if (!ui.q) return true;
  const q = YC.cleanStr(ui.q);
  return [p.name_kanji, p.name_kana, p.name_romaji, p.position, String(p.number ?? '')].some(v => YC.cleanStr(v).includes(q));
}

function renderKpi() {
  const ages = P.map(ageOf).filter(a => a != null);
  const avg = ages.length ? (ages.reduce((x, y) => x + y, 0) / ages.length).toFixed(1) : '-';
  const nat = new Set(P.map(p => FOREIGN[String(p.hometown).toLowerCase()] ? String(p.hometown).toLowerCase() : 'japan')).size;
  const goals = P.reduce((s, p) => s + (stat(p).goals || 0), 0);
  const cap = P.find(p => p.leadership_role === 'captain');
  const k = (v, key) => `<div class="kpi"><b>${esc(v)}</b><span>${YC.t(key)}</span></div>`;
  const counts = ROLES.map(r => `${r.toUpperCase()} ${P.filter(p => p.role === r).length}`).join(' · ');
  document.getElementById('squadKpi').innerHTML = k(P.length, 'p.k_total') + k(avg, 'p.k_age') + k(nat, 'p.k_nat') + k(goals, 'p.k_goals') +
    `<div class="kpi"><b style="font-size:1.25rem">${esc(cap ? YC.data.playerName(cap, L()) : '-')}</b><span>${YC.t('p.k_captain')}</span></div>` +
    `<div class="kpi"><b style="font-size:1.05rem;line-height:2.1rem">${counts}</b><span>${YC.t('p.hm_sub') === '' ? '' : 'GK · DF · MF · FW'}</span></div>`;
}

function row(iconClass, label, html) { 
  return `<div class="player-detail-row"><span class="stat-label"><i class="${iconClass}"></i>${label}</span> ${html}</div>`; 
}

function card(p) {
  const lang = L(), st = stat(p), gk = p.role === 'gk', age = ageOf(p);
  const fascia = p.leadership_role === 'captain' ? '<div class="captain-fascia">CAPTAIN</div>' : p.leadership_role === 'vice_captain' ? '<div class="captain-fascia vc-fascia">VICE CAPT.</div>' : '';
  
  // Titoli & Sottotitoli Nomi
  const mainName = YC.data.playerName(p, lang) || p.name_kanji || '-';
  const subName = lang === 'ja' ? (p.name_kana || p.name_romaji || '') : (p.name_kanji || p.name_kana || '');

  const n = k => st[k] || 0;
  const t = YC.t;

  let rows = row('fas fa-user-tag', t('p.role'), `<span class="role-badge-back role-badge-${p.role}">${esc(p.position || '-')}</span>`) +
    row('fas fa-map-marker-alt', t('p.hometown'), `<strong>${esc(hometown(p.hometown, lang))}</strong>`) +
    row('fas fa-birthday-cake', t('p.age'), `<strong>${age == null ? '-' : age + ' ' + t('p.years')}</strong>`) +
    row('fas fa-tshirt', t('p.caps'), `<strong class="stats-highlight">${n('caps')}<span class="sub-stat-detail">(${n('starters')}/${n('subs')})</span></strong>`);

  rows += gk 
    ? row('fas fa-shield-virus', t('p.conceded'), `<strong class="stats-highlight">${n('goals_conceded')}</strong>`) + 
      row('fas fa-shield-alt', t('p.clean'), `<strong class="stats-highlight">${n('clean_sheets')}</strong>`)
    : row('fas fa-futbol', t('p.goals'), `<strong class="stats-highlight">${n('goals')}</strong>`) + 
      row('fas fa-hands-helping', t('p.assists'), `<strong class="stats-highlight">${n('assists')}</strong>`);

  rows += row('fas fa-star icon-gold', 'MVP:', `<strong class="stats-highlight">${n('mvps')}</strong>`) + 
    row('fas fa-square icon-yellow', t('p.yellows'), `<strong class="stats-highlight">${n('yellows')}</strong>`) + 
    row('fas fa-square icon-red', t('p.reds'), `<strong class="stats-highlight">${n('reds')}</strong>`);

  const hasPos = st.positions_played && Object.keys(st.positions_played).length;

  return `<div class="player-card" id="${esc(p.id)}" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(mainName)}">
  <div class="player-card-inner">
    <div class="player-card-front">
      <div class="player-body-jersey ${gk ? 'jersey-gk' : ''}">${fascia}<div class="jersey-surname-large">${esc(surname(p, P))}</div><div class="jersey-number-large">${p.number ?? '-'}</div></div>
      <div class="player-name-block-front"><div class="player-name-kanji">${esc(mainName)}</div><div class="player-name-romaji">${esc(subName)}</div></div>
      <div class="player-flip-indicator"><i class="fas fa-rotate"></i> ${t('p.flip')}</div>
    </div>
    <div class="player-card-back">
      <div class="player-back-name-block"><div class="player-name-kanji">${esc(mainName)}</div><div class="player-name-romaji">${esc(subName)}</div></div>
      <div class="player-details-inner">${rows}</div>
      <div class="card-actions">${hasPos ? `<button type="button" data-heat="${esc(p.id)}"><i class="fas fa-map-location-dot"></i> ${t('p.heat')}</button>` : ''}<button type="button" class="share" data-share="${esc(p.id)}"><i class="fas fa-share-nodes"></i> ${t('p.share')}</button></div>
      <div class="player-flip-indicator"><i class="fas fa-rotate"></i> ${t('p.back')}</div>
    </div>
  </div></div>`;
}

function render() {
  const root = document.getElementById('playersRoot'), t = YC.t;
  document.getElementById('sort').innerHTML = ['number', 'name', 'caps', 'goals', 'age'].map(k => `<option value="${k}" ${ui.sort === k ? 'selected' : ''}>${t('p.sort_' + k)}</option>`).join('');
  document.getElementById('rolePills').innerHTML = ['all', ...ROLES].map(r => `<button type="button" class="pill ${ui.role === r ? 'active' : ''}" data-role="${r}">${t('p.' + r)}</button>`).join('');
  renderKpi();
  let html = '';
  ROLES.forEach(r => {
    if (ui.role !== 'all' && ui.role !== r) return;
    const list = P.filter(p => p.role === r && matches(p)).sort(sortFn);
    if (!list.length) return;
    html += `<section class="role-group"><h2 class="role-title"><i class="fas ${ROLE_ICON[r] || 'fa-user'}"></i> ${t('p.sec_' + r)} <small>(${list.length})</small></h2><div class="players-grid">${list.map(card).join('')}</div></section>`;
  });
  root.innerHTML = html || `<p class="no-results">${t('p.none')}</p>`;
}

/* --- Interazioni --- */
function toast() { const el = document.getElementById('copyToast'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }

async function share(id) {
  const url = location.origin + location.pathname + '#' + id;
  const p = P.find(x => x.id === id);
  if (navigator.share) { try { await navigator.share({ title: 'Yokohama Calcio – ' + YC.data.playerName(p, L()), url }); return; } catch (_) { return; } }
  try { await navigator.clipboard.writeText(url); toast(); } catch (_) { prompt('URL', url); }
}

function heat(id) {
  const p = P.find(x => x.id === id), pos = (stat(p).positions_played) || {};
  const total = Object.values(pos).reduce((a, b) => a + b, 0), norm = {};
  Object.entries(pos).forEach(([k, v]) => { const u = k.toUpperCase().replace(/-[LRC]$/, ''); const c = POS[u] ? u : (ALIAS[k.toUpperCase()] || ALIAS[u]); if (c) norm[c] = (norm[c] || 0) + v; });
  document.getElementById('hmName').textContent = '#' + (p.number ?? '') + ' ' + YC.data.playerName(p, L());
  document.getElementById('hmSub').textContent = YC.t('p.hm_sub') + ' · ' + total + ' ' + YC.t('p.apps');
  
  const dotsHtml = Object.entries(POS).map(([tag, [x, y]]) => {
    const c = norm[tag] || 0, pc = total ? c / total * 100 : 0, lv = pc > 60 ? 4 : pc > 40 ? 3 : pc > 20 ? 2 : pc > 0 ? 1 : 0;
    return `<div class="heatmap-dot ${c ? 'on' : ''}" data-i="${lv}" style="left:${x}%;top:${y}%" title="${tag} ${c}/${total}">${tag}</div>`;
  }).join('');
  
  document.getElementById('hmField').innerHTML = '<div class="hm-area-top"></div><div class="hm-area-bottom"></div>' + dotsHtml;

  const m = document.getElementById('heatmapModal'); m.classList.add('show'); m.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
}

function closeHeat() { const m = document.getElementById('heatmapModal'); m.classList.remove('show'); m.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }

document.addEventListener('click', e => {
  const sh = e.target.closest('[data-share]'); if (sh) { e.stopPropagation(); share(sh.dataset.share); return; }
  const ht = e.target.closest('[data-heat]'); if (ht) { e.stopPropagation(); heat(ht.dataset.heat); return; }
  if (e.target.closest('[data-close], #hmClose')) { closeHeat(); return; }
  const rp = e.target.closest('[data-role]'); if (rp) { ui.role = rp.dataset.role; render(); return; }
  const c = e.target.closest('.player-card'); if (c) c.classList.toggle('is-flipped');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeHeat();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('player-card')) { e.preventDefault(); e.target.classList.toggle('is-flipped'); }
});

document.getElementById('q').addEventListener('input', e => { ui.q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { ui.sort = e.target.value; render(); });

function openHash() {
  const id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
  const el = document.getElementById(id); if (!el) return;
  setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('is-flipped'); }, 250);
}

YC.data.load(['players', 'stats']).then(d => {
  P = (d.players || []).filter(p => p.role !== 'staff' && ROLES.includes(p.role));
  S = (d.stats && d.stats.players) || {};
  ready = true; render(); openHash();
});

document.addEventListener('yc:langchange', () => ready && render());
window.addEventListener('hashchange', openHash);
</script>
</body>
</html>
