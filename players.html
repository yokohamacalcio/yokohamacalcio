    <style>
        /* Stili base per le card */
        .player-card {
            perspective: 1000px;
            height: 400px;
            cursor: pointer; /* Indica che l'intera card è cliccabile */
        }

        .player-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .player-card.is-flipped .player-card-inner {
            transform: rotateY(180deg);
        }

        .player-card-front,
        .player-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .player-card-front {
            z-index: 2;
        }

        .player-card-back {
            transform: rotateY(180deg);
            background: #fafafa;
        }

        /* Header front */
        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }

        .player-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: var(--dark-navy, #003c82);
            line-height: 1;
        }

        /* Badge ruolo */
        .role-badge-tactical {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .role-badge-gk { background: #16a34a; }
        .role-badge-df { background: #0284c7; }
        .role-badge-mf { background: #d97706; }
        .role-badge-fw { background: #dc2626; }
        .role-badge-staff { background: #db2777; }

        /* Corpo front: silhouette calcistica realistica */
        .player-body {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .player-silhouette {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85; /* Resa visiva più morbida */
        }

        .player-silhouette svg {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }

        /* Nome in basso sul front */
        .player-name-block-front {
            text-align: center;
            padding: 10px 16px;
            background: rgba(255,255,255,0.9);
            border-top: 1px solid #f1f5f9;
        }

        .player-name-kanji {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--dark-navy, #003c82);
            margin-bottom: 2px;
        }

        .player-name-romaji {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Indicatore di Flip (sostituisce il pulsante) */
        .player-flip-indicator {
            background: #f1f5f9;
            color: var(--dark-navy, #003c82);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid #e2e8f0;
            width: 100%;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .player-card:hover .player-flip-indicator {
            background: var(--primary-sky, #12a0d7);
            color: #fff;
        }

        /* Retro: dettagli */
        .player-back-name-block {
            text-align: center;
            padding: 16px 16px 8px;
            background: #fafafa;
        }

        .player-details-inner {
            padding: 12px 14px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.83rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #475569;
            gap: 8px;
        }

        .player-detail-row strong {
            text-align: right;
            margin-left: auto;
            word-break: break-word;
        }

        .stats-highlight {
            font-weight: 700;
            color: var(--dark-navy, #003c82);

    function calculateAge(birthDate) {
        if (!birthDate) return '-';
        const today = new Date();
        const birth = new Date(birthDate);
        if (isNaN(birth.getTime())) return '-';
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
        return age;
    }

    let currentLang = localStorage.getItem('preferred_lang') || 'ja';

    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (translations[lang][key]) elem.innerHTML = translations[lang][key];
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        document.querySelectorAll('.player-card').forEach(card => {
            const kana = card.getAttribute('data-player-kana');
            const romaji = card.getAttribute('data-player-romaji');
            const displayName = (lang === 'ja') ? (kana || romaji || '-') : (romaji || kana || '-');
            card.querySelectorAll('.player-name-romaji').forEach(el => {
                el.textContent = displayName;
            });
        });

        document.querySelectorAll('[data-hometown]').forEach(elem => {
            const code = elem.getAttribute('data-hometown');
            const key = `hometown.${code}`;
            if (translations[lang][key]) {
                elem.textContent = translations[lang][key];
            } else {
                elem.textContent = code === '-' ? '-' : code;
            }
        });

        document.querySelectorAll('[data-age]').forEach(elem => {
            const num = elem.getAttribute('data-age');
            const unit = translations[lang]['unit.age'];
            if (num === '-') {
                elem.textContent = '-';
            } else {
                elem.textContent = `${num} ${unit}`;
            }
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
        });
    });

    const silhouetteSVG = `
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <path fill="#cbd5e1" d="M370.4 133.7c17.5-16 18.7-43.2 2.7-60.7s-43.2-18.7-60.7-2.7c-17.5 16-18.7 43.2-2.7 60.7 16 17.6 43.2 18.8 60.7 2.7zm-147.2 29.8l15.1 52.4-60.5 30.6-32.9-50-34 14.5 46.2 70.1c5.9 9 16.3 13.5 26.6 12.6 1.1-.1 2.2-.3 3.2-.6 9.5-2.2 17.2-9 20.5-18.3l37.8-106.1 47 25-2.9 83.1 42.1 1.5 5.2-111.4c.5-9.8-4.4-19.1-12.8-24.3l-50.6-31.5 11.2-39.7 43.1 17.5 12.9-34.6-64.8-26.1c-9.6-3.8-20.5-2.4-28.7 3.8l-37 28.5zm-55.9 261l15.3-118 36.1 10.9-15.3 118-35.8-10.9zm138.8-154.5l17.7 32-55.2 56.4 28.5 14.2 55.2-56.4 17.7 32 28.5-14.2-46.2-96.1-46.2 32.1zm-213 189c-19.3 0-35 15.7-35 35s15.7 35 35 35 35-15.7 35-35-15.7-35-35-35z"/>
        </svg>
    `;

    function createPlayerCard(p) {
        const isStaff = p.role === 'staff';
        const numberDisplay = p.number ? `#${p.number}` : '#-';
        const roleClass = `role-badge-${p.role}`;
        const roleIcon = getRoleIcon(p.role);
        const nameKanji = p.name_kanji || '-';
        const nameKana = p.name_kana || nameKanji;
        const nameRomaji = p.name_romaji || nameKanji;
        const hometownCode = p.hometown || '-';
        const age = calculateAge(p.birth_date);
        const roleLabel = isStaff ? 'MGR' : (p.position || '-');

        let detailsRows = '';
        if (isStaff) {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.staff_role">役割:</span> <strong data-i18n="role.manager">マネージャー</strong></div>
            `;
        } else if (p.role === 'gk') {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.role_detail">役割:</span> <strong>${roleLabel}</strong></div>
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.age">年齢:</span> <strong data-age="${age}">${age} 歳</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-shield-halved"></i> <span data-i18n="label.goals_conceded">失点:</span></span> <strong class="stats-highlight" data-stat="goals_conceded">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-lock"></i> <span data-i18n="label.clean_sheets">クリーンシート:</span></span> <strong class="stats-highlight" data-stat="clean_sheets">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-star" style="color: #f59e0b;"></i> MVP:</span> <strong class="stats-highlight" data-stat="mvps">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #f59e0b;"></i> <span data-i18n="label.yellows">警告:</span></span> <strong class="stats-highlight" data-stat="yellows">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #ef4444;"></i> <span data-i18n="label.reds">退場:</span></span> <strong class="stats-highlight" data-stat="reds">0</strong></div>
            `;
        } else {
            detailsRows = `
                <div class="player-detail-row"><span data-i18n="label.role_detail">役割:</span> <strong>${roleLabel}</strong></div>
                <div class="player-detail-row"><span data-i18n="label.hometown">出身地:</span> <strong data-hometown="${hometownCode}"></strong></div>
                <div class="player-detail-row"><span data-i18n="label.age">年齢:</span> <strong data-age="${age}">${age} 歳</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-futbol" style="color: var(--dark-navy);"></i> <span data-i18n="label.goals">得点:</span></span> <strong class="stats-highlight" data-stat="goals">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-shoe-prints" style="color: var(--primary-sky);"></i> <span data-i18n="label.assists">アシスト:</span></span> <strong class="stats-highlight" data-stat="assists">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-star" style="color: #f59e0b;"></i> MVP:</span> <strong class="stats-highlight" data-stat="mvps">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #f59e0b;"></i> <span data-i18n="label.yellows">警告:</span></span> <strong class="stats-highlight" data-stat="yellows">0</strong></div>
                <div class="player-detail-row"><span><i class="fas fa-square" style="color: #ef4444;"></i> <span data-i18n="label.reds">退場:</span></span> <strong class="stats-highlight" data-stat="reds">0</strong></div>
            `;
        }

        return `
            <div class="player-card" data-player-name="${nameKanji}" data-player-kana="${nameKana}" data-player-romaji="${nameRomaji}">
                <div class="player-card-inner">
                    <div class="player-card-front">
                        <div class="player-card-header">
                            <span class="player-number">${numberDisplay}</span>
                            <span class="role-badge-tactical ${roleClass}"><i class="fas ${roleIcon}"></i> ${roleLabel}</span>
                        </div>
                        <div class="player-body">
                            <div class="player-silhouette">
                                ${silhouetteSVG}
                            </div>
                        </div>
                        <div class="player-name-block-front">
                            <div class="player-name-kanji">${nameKanji}</div>
                            <div class="player-name-romaji">${nameKana}</div>
                        </div>
                        <div class="player-flip-indicator">
                            <i class="fas fa-hand-pointer"></i> <span data-i18n="btn.details">詳細・個人成績</span>
                        </div>
                    </div>
                    <div class="player-card-back">
                        <div class="player-back-name-block">
                            <div class="player-name-kanji">${nameKanji}</div>
                            <div class="player-name-romaji">${nameKana}</div>
                        </div>
                        <div class="player-details-inner">
                            ${detailsRows}
                        </div>
                        <div class="player-flip-indicator">
                            <i class="fas fa-arrow-left"></i> <span data-i18n="btn.back">戻る</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function populatePlayers(players) {
        const sections = { gk: [], df: [], mf: [], fw: [], staff: [] };
        players.forEach(p => {
            if (sections[p.role]) sections[p.role].push(p);
        });

        Object.keys(sections).forEach(role => {
            const container = document.getElementById(`players-${role}`);
            if (container) container.innerHTML = sections[role].map(createPlayerCard).join('');
        });

        setLanguage(currentLang);
        calculateStatsFromMatchesJSON();
    }

    async function loadPlayersJSON() {
        try {
            const response = await fetch('players.json');
            if (!response.ok) throw new Error('Errore nella fetch');
            const players = await response.json();
            populatePlayers(players);
        } catch (error) {
            console.error('Errore nel caricamento dei giocatori:', error);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        loadPlayersJSON();
    });

    // Mobile menu toggle
    const menuBtn = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    if (menuBtn && mobileNav) {
        menuBtn.addEventListener('click', () => {
            mobileNav.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileNav.classList.add('hidden');
                menuBtn.querySelector('i').classList.add('fa-bars');
                menuBtn.querySelector('i').classList.remove('fa-times');
            });
        });
    }

    // Flip card logic universale: basato sull'intera card
    document.addEventListener('click', (e) => {
        const card = e.target.closest('.player-card');
        if (card) {
            card.classList.toggle('is-flipped');
        }
    });

    // Role filter
    const roleFilterBtns = document.querySelectorAll('[data-role-filter]');
    const roleSections = document.querySelectorAll('[data-role-section]');
    roleFilterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            roleFilterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterVal = btn.getAttribute('data-role-filter');
            roleSections.forEach(section => {
                section.style.display = (filterVal === 'all' || section.getAttribute('data-role-section') === filterVal) ? 'block' : 'none';
            });
        });
    });

    // Stats calculation
    async function calculateStatsFromMatchesJSON() {
        try {
            const response = await fetch('matches.json');
            if (!response.ok) return;
            const matches = await response.json();

            const goalCounts = {}, assistCounts = {}, mvpCounts = {}, yellowCounts = {}, redCounts = {}, goalkeeperStats = {};

            const addStat = (map, name, count = 1) => {
                if (!name) return;
                const clean = name.trim();
                if (clean && clean !== 'なし' && clean !== 'Nessuno') map[clean] = (map[clean] || 0) + count;
            };

            matches.forEach(m => {
                if (m.status !== 'past') return;
                if (m.scorers && m.scorers !== 'なし' && m.scorers !== 'Nessuno') {
                    m.scorers.split(',').forEach(entry => {
                        let text = entry.trim();
                        if (!text) return;
                        let assistName = '';
                        const assistMatch = text.match(/\(([^)]+)\)/) || text.match(/（([^）]+)）/);
                        if (assistMatch) {
                            assistName = assistMatch[1].trim();
                            text = text.replace(/\([^)]+\)/, '').replace(/（[^）]+）/, '').trim();
                        }
                        if (text) addStat(goalCounts, text);
                        if (assistName) addStat(assistCounts, assistName);
                    });
                }
                if (m.mvp && m.mvp !== 'なし' && m.mvp !== 'Nessuno') m.mvp.split(',').forEach(name => addStat(mvpCounts, name));
                if (m.yellow_cards && m.yellow_cards !== 'なし' && m.yellow_cards !== 'Nessuno') m.yellow_cards.split(',').forEach(name => addStat(yellowCounts, name));
                if (m.red_cards && m.red_cards !== 'なし' && m.red_cards !== 'Nessuno') m.red_cards.split(',').forEach(name => addStat(redCounts, name));
                if (m.goalkeepers && m.goalkeepers !== '') {
                    m.goalkeepers.split(',').forEach(entry => {
                        const clean = entry.trim();
                        if (!clean) return;
                        const match = clean.match(/^(.+)\((\d+)\)$/);
                        if (match) {
                            const gkName = match[1].trim();
                            const gkGoals = parseInt(match[2], 10) || 0;
                            if (!goalkeeperStats[gkName]) goalkeeperStats[gkName] = { appearances: 0, goals_conceded: 0, clean_sheets: 0 };
                            goalkeeperStats[gkName].appearances += 1;
                            goalkeeperStats[gkName].goals_conceded += gkGoals;
                            if (gkGoals === 0) goalkeeperStats[gkName].clean_sheets += 1;
                        }
                    });
                }
            });

            document.querySelectorAll('.player-card').forEach(card => {
                const mainName = card.getAttribute('data-player-name');
                const kanaName = card.getAttribute('data-player-kana');
                const romajiName = card.getAttribute('data-player-romaji');

                const getStatValue = (map) => {
                    let total = 0;
                    if (mainName && map[mainName]) total += map[mainName];
                    if (kanaName && map[kanaName]) total += map[kanaName];
                    if (romajiName && map[romajiName]) total += map[romajiName];
                    return total;
                };

                const goalElem = card.querySelector('[data-stat="goals"]');
                const assistElem = card.querySelector('[data-stat="assists"]');
                const mvpElem = card.querySelector('[data-stat="mvps"]');
                const yellowElem = card.querySelector('[data-stat="yellows"]');
                const redElem = card.querySelector('[data-stat="reds"]');
                const gkGoalElem = card.querySelector('[data-stat="goals_conceded"]');
                const cleanSheetElem = card.querySelector('[data-stat="clean_sheets"]');

                if (goalElem) goalElem.textContent = getStatValue(goalCounts);
                if (assistElem) assistElem.textContent = getStatValue(assistCounts);
                if (mvpElem) mvpElem.textContent = getStatValue(mvpCounts);
                if (yellowElem) yellowElem.textContent = getStatValue(yellowCounts);
                if (redElem) redElem.textContent = getStatValue(redCounts);

                const gkName = [mainName, kanaName, romajiName].find(n => goalkeeperStats[n]);
                if (gkName && gkGoalElem) gkGoalElem.textContent = goalkeeperStats[gkName].goals_conceded;
                if (gkName && cleanSheetElem) cleanSheetElem.textContent = goalkeeperStats[gkName].clean_sheets;
            });

        } catch (e) {
            console.error("Errore nel calcolo statistiche giocatori:", e);
        }
    }

    // Scroll to top
    const topBtn = document.getElementById('scrollToTopBtn');
    if (topBtn) {
        window.addEventListener('scroll', () => topBtn.classList.toggle('show', window.scrollY > 300));
        topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    const yearSpan = document.getElementById('currentYear');
    if (yearSpan) yearSpan.textContent = new Date().getFullYear();
</script>
</body>
</html>
