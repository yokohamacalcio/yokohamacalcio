                    <option value="all" data-i18n="matches_page.all_seasons">全期間</option>
                    <option value="2026" selected>2026年</option>

        <div class="matches-list-wrapper">

                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-calendar-check" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.upcoming_title">試合日程</span>
                </h3>

                <!-- Contenitore Partite Future -->
                <div id="upcomingContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>

            <div class="matches-section-block" style="margin-top: 50px;">

        <div class="back-home-wrapper" style="margin-top: 50px;">
            <a href="index.html" class="google-form-btn back-btn" style="max-width: 250px; margin: 0 auto;">

</section>

<button id="scrollToTopBtn" aria-label="Torna in cima"><i class="fas fa-chevron-up"></i></button>

<footer class="footer">

<script>
    // Stile animazione per badge LIVE
    const style = document.createElement('style');
    style.innerHTML = `@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }`;
    document.head.appendChild(style);

    if ('scrollRestoration' in history) { history.scrollRestoration = 'auto'; }

    let currentLang = localStorage.getItem('preferred_lang') || 'ja';
    let visiblePastMatchesCount = 3;

    // Dizionario Traduzioni
    const translations = {
        ja: {
            "nav.team": "チーム", "nav.about": "チーム紹介", "nav.players": "選手紹介", "nav.stats": "成績・スタッツ",
            "nav.gallery": "ギャラリー", "nav.matches": "試合日程・結果", "nav.shop": "ショップ", "nav.sponsors": "スポンサー",
            "nav.faq": "よくある質問", "nav.contact": "お問い合わせ", "matches_page.title": "試合日程・結果一覧",
            "matches_page.intro": "Yokohama Calcioの試合スケジュールと対戦情報です。", "matches_page.upcoming_title": "試合日程",
            "matches_page.past_title": "試合結果", "matches_page.season_label": "シーズン:", "matches_page.all_seasons": "全期間",
            "filter.all": "すべて", "filter.league": "リーグ戦", "filter.cup": "カップ戦", "filter.friendly": "練習試合",
            "badge.friendly": "次戦 (練習試合)", "badge.live": "🔴 LIVE", "badge.past_friendly": "練習試合",
            "label.venue": "会場:", "label.kickoff": "キックオフ:", "label.scorers": "得点者:",
            "label.mvp": "MVP:", "label.yellow_cards": "警告:", "label.red_cards": "退場:",
            "btn.details": "詳細を見る", "btn.load_more": "過去の試合をもっと見る", "btn.back_home": "ホームに戻る"
        },
        it: {
            "nav.team": "Squadra", "nav.about": "Info Squadra", "nav.players": "Giocatori", "nav.stats": "Statistiche",
            "nav.gallery": "Galleria", "nav.matches": "Partite", "nav.shop": "Store", "nav.sponsors": "Sponsor",
            "nav.faq": "FAQ", "nav.contact": "Contatti", "matches_page.title": "Calendario & Risultati",
            "matches_page.intro": "Calendario delle partite e dettagli di Yokohama Calcio.", "matches_page.upcoming_title": "Prossime Partite",
            "matches_page.past_title": "Risultati Passati", "matches_page.season_label": "Stagione:", "matches_page.all_seasons": "Tutte",
            "filter.all": "Tutti", "filter.league": "Campionato", "filter.cup": "Coppa", "filter.friendly": "Amichevoli",
            "badge.friendly": "Prossima (Amichevole)", "badge.live": "🔴 IN DIRETTA", "badge.past_friendly": "Amichevole",
            "label.venue": "Campo:", "label.kickoff": "Calcio d'inizio:", "label.scorers": "Marcatori:",
            "label.mvp": "MVP:", "label.yellow_cards": "Ammoniti:", "label.red_cards": "Espulsi:",
            "btn.details": "Dettagli", "btn.load_more": "Mostra altri risultati", "btn.back_home": "Torna alla Home"
        },
        en: {
            "nav.team": "Team", "nav.about": "About Us", "nav.players": "Players", "nav.stats": "Statistics",
            "nav.gallery": "Gallery", "nav.matches": "Matches", "nav.shop": "Shop", "nav.sponsors": "Sponsors",
            "nav.faq": "FAQ", "nav.contact": "Contact", "matches_page.title": "Fixtures & Results",
            "matches_page.intro": "Match schedule and match information for Yokohama Calcio.", "matches_page.upcoming_title": "Upcoming Matches",
            "matches_page.past_title": "Match Results", "matches_page.season_label": "Season:", "matches_page.all_seasons": "All Time",
            "filter.all": "All", "filter.league": "League", "filter.cup": "Cup", "filter.friendly": "Friendly",
            "badge.friendly": "Next (Friendly)", "badge.live": "🔴 LIVE", "badge.past_friendly": "Friendly Match",
            "label.venue": "Venue:", "label.kickoff": "Kick-Off:", "label.scorers": "Scorers:",
            "label.mvp": "MVP:", "label.yellow_cards": "Yellow Cards:", "label.red_cards": "Red Cards:",
            "btn.details": "Details", "btn.load_more": "Load More Results", "btn.back_home": "Back to Home"
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-lang') === lang));
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                const icon = el.querySelector('i');
                if (icon) {
                    el.childNodes[el.childNodes.length - 1].textContent = " " + translations[lang][key];
                } else {
                    el.textContent = translations[lang][key];
                }
            }
        });
    }

    function filterAndPaginateMatches() {
        const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
        const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';

        const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
        let visibleMatches = 0;

        pastCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);

            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);

            if (categoryMatch && seasonMatch) {
                visibleMatches++;
                if (visibleMatches <= visiblePastMatchesCount) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            } else {
                card.style.display = 'none';
            }
        });

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            if (visibleMatches > visiblePastMatchesCount) {
                loadMoreBtn.style.display = 'inline-flex';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        const upcomingCards = document.querySelectorAll('#upcomingContainer .match-detail-card');
        upcomingCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);
            card.style.display = (categoryMatch && seasonMatch) ? 'block' : 'none';
        });
    }

    async function loadMatchesFromJSON() {
        try {
            const response = await fetch('matches.json');
            const matches = await response.json();

            const upcomingContainer = document.getElementById('upcomingContainer');
            const pastContainer = document.getElementById('pastContainer');
            upcomingContainer.innerHTML = '';
            pastContainer.innerHTML = '';

            matches.forEach(m => {
                const isPast = m.status === 'past';
                const cardClass = isPast ? 'match-detail-card match-past-item' : 'match-detail-card match-upcoming';
                const scoreClass = isPast ? 'match-vs-score score-past' : 'match-vs-score';
                
                const rawDate = m.date ? m.date.trim().replace(/\./g, '-').substring(0, 10) : '';

                let badgeHtml = '';
                if (m.status === 'live') {
                    badgeHtml = `<span class="match-badge" style="background: #ef4444; color: white; animation: pulse 1.5s infinite;" data-i18n="badge.live">🔴 LIVE</span>`;
                } else if (isPast) {
                    badgeHtml = `<span class="match-badge badge-friendly" data-i18n="badge.past_friendly">${m.type || '練習試合'}</span>`;
                } else {
                    badgeHtml = `<span class="match-badge badge-next" data-i18n="badge.friendly">${m.type || '次戦 (練習試合)'}</span>`;
                }

                const team2Logo = m.team2Logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.team2Name)}&background=random&color=ffffff&size=100&bold=true`;

                // --- NUOVA LOGICA: ordine squadre e punteggio in base a isHome ---
                const isHome = m.isHome !== undefined ? m.isHome : true;
                let leftTeamName, leftTeamLogo, rightTeamName, rightTeamLogo, displayScore;

                if (isHome) {
                    // Yokohama a sinistra (casa)
                    leftTeamName = m.team1Name || 'Yokohama Calcio';
                    leftTeamLogo = './immagini/logo.png';
                    rightTeamName = m.team2Name || '-';
                    rightTeamLogo = team2Logo;
                    displayScore = m.score;
                } else {
                    // Yokohama a destra (trasferta)
                    leftTeamName = m.team2Name || '-';
                    leftTeamLogo = team2Logo;
                    rightTeamName = m.team1Name || 'Yokohama Calcio';
                    rightTeamLogo = './immagini/logo.png';
                    // Inverti punteggio se non è "VS"
                    if (m.score && m.score !== 'VS' && m.score.includes('-')) {
                        const parts = m.score.split('-');
                        if (parts.length === 2) {
                            displayScore = `${parts[1].trim()} - ${parts[0].trim()}`;
                        } else {
                            displayScore = m.score;
                        }
                    } else {
                        displayScore = m.score;
                    }
                }

                const displayDateTime = m.time ? `${m.date} ${m.time}` : m.date;

                let detailsHtml = `
                    <div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span><strong data-i18n="label.venue">会場:</strong> ${m.venue}</span></div>
                `;
                
                if (m.time) {
                    detailsHtml += `<div class="detail-item"><i class="fas fa-clock"></i> <span><strong data-i18n="label.kickoff">キックオフ:</strong> ${m.time}</span></div>`;
                }
                if (m.scorers && m.scorers !== 'なし' && m.scorers !== 'Nessuno') {
                    detailsHtml += `<div class="detail-item"><i class="fas fa-futbol"></i> <span><strong data-i18n="label.scorers">得点者:</strong> ${m.scorers}</span></div>`;
                }
                if (m.mvp && m.mvp !== 'なし' && m.mvp !== 'Nessuno') {
                    detailsHtml += `<div class="detail-item"><i class="fas fa-star" style="color: #f59e0b;"></i> <span><strong data-i18n="label.mvp">MVP:</strong> ${m.mvp}</span></div>`;
                }
                if (m.yellow_cards && m.yellow_cards !== 'なし' && m.yellow_cards !== 'Nessuno') {
                    detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #eab308;"></i> <span><strong data-i18n="label.yellow_cards">警告:</strong> ${m.yellow_cards}</span></div>`;
                }
                if (m.red_cards && m.red_cards !== 'なし' && m.red_cards !== 'Nessuno') {
                    detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #ef4444;"></i> <span><strong data-i18n="label.red_cards">退場:</strong> ${m.red_cards}</span></div>`;
                }

                const cardHtml = `
                    <div class="${cardClass}" id="${m.id}" data-match-category="${m.category}" data-match-date="${rawDate}">
                        <div class="match-header-row">
                            ${badgeHtml}
                            <span class="match-date-text"><i class="far fa-calendar-alt"></i> ${displayDateTime}</span>
                        </div>
                        <div class="match-teams-row">
                            <div class="match-team">
                                <img src="${leftTeamLogo}" alt="${leftTeamName}">
                                <span>${leftTeamName}</span>
                            </div>
                            <div class="${scoreClass}">${displayScore}</div>
                            <div class="match-team">
                                <img src="${rightTeamLogo}" alt="${rightTeamName}" class="opponent-logo">
                                <span>${rightTeamName}</span>
                            </div>
                        </div>
                        <button class="toggle-details-btn"><i class="fas fa-info-circle"></i> <span data-i18n="btn.details">詳細を見る</span></button>
                        <div class="match-expand-details" style="display: none;">
                            <div class="details-inner">
                                ${detailsHtml}
                            </div>
                        </div>
                    </div>
                `;

                if (isPast) {
                    pastContainer.insertAdjacentHTML('beforeend', cardHtml);
                } else {
                    upcomingContainer.insertAdjacentHTML('beforeend', cardHtml);
                }
            });

            // Gestione Click Espansione Dettagli (chiude gli altri)
            document.querySelectorAll('.toggle-details-btn').forEach(btn => {
                btn.onclick = function(e) {
                    e.preventDefault();
                    const card = this.closest('.match-detail-card');
                    const details = card.querySelector('.match-expand-details');
                    const wasActive = card.classList.contains('active');

                    document.querySelectorAll('.match-detail-card').forEach(c => {
                        c.classList.remove('active');
                        const det = c.querySelector('.match-expand-details');
                        if (det) det.style.display = 'none';
                    });

                    if (!wasActive) {
                        card.classList.add('active');
                        if (details) details.style.display = 'block';
                    }
                };
            });

        } catch (error) {
            console.error("Errore nel caricamento del file JSON:", error);
        }
    }

    // Apre automaticamente il dettaglio se l'URL contiene un hash (es. #match-1)
    function handleHashOnLoad() {
        const hash = window.location.hash;
        if (!hash) return;

        document.querySelectorAll('[data-match-filter]').forEach(btn => btn.classList.remove('active'));
        document.querySelector('[data-match-filter="all"]')?.classList.add('active');
        const seasonSelect = document.getElementById('matchSeasonSelect');
        if (seasonSelect) seasonSelect.value = 'all';
        visiblePastMatchesCount = 1000;

        filterAndPaginateMatches();

        const targetCard = document.querySelector(hash);
        if (targetCard) {
            setTimeout(() => {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('active');
                const details = targetCard.querySelector('.match-expand-details');
                if (details) details.style.display = 'block';
            }, 100);
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const currentYearEl = document.getElementById('currentYear');
        if (currentYearEl) currentYearEl.textContent = new Date().getFullYear();

        await loadMatchesFromJSON();
        
        setLanguage(currentLang);
        filterAndPaginateMatches();
        handleHashOnLoad();

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
        });

        document.querySelectorAll('[data-match-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-match-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        });

        const seasonSelect = document.getElementById('matchSeasonSelect');
        if (seasonSelect) {
            seasonSelect.addEventListener('change', () => {
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        }

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', (e) => {
                e.preventDefault();
                visiblePastMatchesCount += 3;
                filterAndPaginateMatches();
            });
        }

        const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
        const mobileNav = document.querySelector('.mobile-nav');
        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', () => mobileNav.classList.toggle('hidden'));
        }

        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            window.addEventListener('scroll', () => scrollToTopBtn.style.display = window.scrollY > 300 ? 'block' : 'none');
            scrollToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
    });
</script>
</body>
</html>
