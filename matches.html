<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合日程・結果 | Yokohama Calcio</title>
    <meta name="description" content="Yokohama Calcioの試合日程および過去の対戦結果一覧です。">
    
    <link rel="icon" href="./immagini/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .match-detail-card.active .match-expand-details {
            display: block !important;
            margin-top: 15px;
        }
        #matchesCounter {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark-navy, #003c82);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header class="header">
  <div class="top-bar">
    <div class="container top-bar-container">
      <div class="top-bar-social">
        <a href="https://x.com/yokohamacalcio" target="_blank" aria-label="X"><i class="fab fa-x-twitter"></i></a>
        <a href="https://instagram.com/yokohamacalcio" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://youtube.com/@yokohamacalcio?si=NBPkZ0qFxFVrOIof" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      </div>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ja">JP</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="it">IT</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div class="main-header-bar">
    <div class="container header-container">
      <div class="logo-title">
        <a href="index.html">
          <img src="./immagini/logo.png" alt="Yokohama Calcio" class="logo">
        </a>
        <a href="index.html" class="brand-name">
          <span>YOKOHAMA</span>
          <span class="brand-sub">CALCIO</span>
        </a>
      </div>

      <div class="desktop-nav-wrapper">
        <nav class="main-nav">
          <div class="nav-item dropdown">
            <a href="index.html#about" class="dropdown-toggle"><span data-i18n="nav.team">チーム</span> <i class="fas fa-chevron-down nav-arrow"></i></a>
            <div class="dropdown-menu">
              <a href="index.html#about" data-i18n="nav.about">チーム紹介</a>
              <a href="players.html" data-i18n="nav.players">選手紹介</a>
              <a href="stats.html" data-i18n="nav.stats">成績・スタッツ</a>
              <a href="index.html#gallery" data-i18n="nav.gallery">ギャラリー</a>
            </div>
          </div>
          <a href="matches.html" style="color: var(--primary-sky);" data-i18n="nav.matches">試合日程・結果</a>
          <a href="index.html#shop" data-i18n="nav.shop">ショップ</a>
          <a href="index.html#sponsors" data-i18n="nav.sponsors">スポンサー</a>
          <a href="faq.html" data-i18n="nav.faq">よくある質問</a>
          <a href="index.html#contact" class="nav-cta-btn" data-i18n="nav.contact">お問い合わせ</a>
        </nav>
      </div>

      <button class="mobile-menu-toggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </div>

  <nav class="mobile-nav hidden">
    <a href="index.html#about" class="mobile-link" data-i18n="nav.about">チーム紹介</a>
    <a href="players.html" class="mobile-link" data-i18n="nav.players">選手紹介</a>
    <a href="stats.html" class="mobile-link" data-i18n="nav.stats">成績・スタッツ</a>
    <a href="index.html#gallery" class="mobile-link" data-i18n="nav.gallery">ギャラリー</a>
    <a href="matches.html" class="mobile-link" data-i18n="nav.matches">試合日程・結果</a>
    <a href="index.html#shop" class="mobile-link" data-i18n="nav.shop">ショップ</a>
    <a href="index.html#sponsors" class="mobile-link" data-i18n="nav.sponsors">スポンサー</a>
    <a href="faq.html" class="mobile-link" data-i18n="nav.faq">よくある質問</a>
    <a href="index.html#contact" class="mobile-link mobile-cta" data-i18n="nav.contact">お問い合わせ</a>
  </nav>
</header>

<section class="section matches-page-section">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-trophy"></i> <span data-i18n="matches_page.title">試合日程・結果一覧</span></h2>
        <p class="matches-intro" data-i18n="matches_page.intro">Yokohama Calcioの試合スケジュールと対戦情報です。</p>

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 30px;">
            <div class="filter-wrapper" style="margin-bottom: 0;">
                <button class="filter-btn active" data-match-filter="all" data-i18n="filter.all">すべて</button>
                <button class="filter-btn" data-match-filter="league" data-i18n="filter.league">リーグ戦</button>
                <button class="filter-btn" data-match-filter="cup" data-i18n="filter.cup">カップ戦</button>
                <button class="filter-btn" data-match-filter="friendly" data-i18n="filter.friendly">練習試合</button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <label for="matchSeasonSelect" style="font-weight: 700; color: var(--dark-navy, #003c82); font-size: 0.9rem;">
                    <i class="fas fa-calendar-alt"></i> <span data-i18n="matches_page.season_label">シーズン:</span>
                </label>
                <select id="matchSeasonSelect" class="filter-btn" style="padding: 6px 14px; cursor: pointer; outline: none;">
                </select>
            </div>
        </div>

        <div class="matches-list-wrapper">
            <div class="matches-section-block">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-calendar-check" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.upcoming_title">試合日程</span>
                </h3>
                <div id="upcomingContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>

            <div class="matches-section-block" style="margin-top: 50px;">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-history" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.past_title">試合結果</span>
                </h3>
                <div id="pastContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>

                <div style="text-align: center; margin-top: 25px;">
                    <span id="matchesCounter"></span>
                    <button id="loadMoreMatchesBtn" class="filter-btn" style="background: var(--dark-navy, #003c82); color: #ffffff; border: none; padding: 10px 24px; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fas fa-chevron-down"></i> <span id="loadMoreText">さらに3試合を表示</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="back-home-wrapper" style="margin-top: 50px;">
            <a href="index.html" class="google-form-btn back-btn" style="max-width: 250px; margin: 0 auto;">
                <i class="fas fa-arrow-left"></i> <span data-i18n="btn.back_home">ホームに戻る</span>
            </a>
        </div>
    </div>
</section>

<button id="scrollToTopBtn" aria-label="Torna in cima"><i class="fas fa-chevron-up"></i></button>

<footer class="footer">
    <p>&copy; <span id="currentYear"></span> Yokohama Calcio. All Rights Reserved.</p>
</footer>

<script>
    const style = document.createElement('style');
    style.innerHTML = `@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }`;
    document.head.appendChild(style);

    if ('scrollRestoration' in history) { history.scrollRestoration = 'auto'; }

    let currentLang = localStorage.getItem('preferred_lang') || 'ja';
    let visiblePastMatchesCount = 3;
    let rawMatches = [];

    const translations = {
        ja: {
            "nav.team": "チーム", "nav.about": "チーム紹介", "nav.players": "選手紹介", "nav.stats": "成績・スタッツ",
            "nav.gallery": "ギャラリー", "nav.matches": "試合日程・結果", "nav.shop": "ショップ", "nav.sponsors": "スポンサー",
            "nav.faq": "よくある質問", "nav.contact": "お問い合わせ", "matches_page.title": "試合日程・結果一覧",
            "matches_page.intro": "Yokohama Calcioの試合スケジュールと対戦情報です。", "matches_page.upcoming_title": "試合日程",
            "matches_page.past_title": "試合結果", "matches_page.season_label": "シーズン:", "matches_page.all_seasons": "全期間",
            "filter.all": "すべて", "filter.league": "リーグ戦", "filter.cup": "カップ戦", "filter.friendly": "練習試合",
            "badge.friendly": "次戦 (練習試合)", "badge.live": "🔴 LIVE", "badge.past_friendly": "練習試合",
            "label.venue": "会場:", "label.kickoff": "キックオフ:", "label.scorers": "得点者:",
            "label.mvp": "MVP:", "label.yellow_cards": "警告:", "label.red_cards": "退場:",
            "btn.details": "詳細を見る", "btn.load_more_3": "さらに3試合を表示", "btn.show_less": "最初の3試合に戻す", "btn.back_home": "ホームに戻る"
        },
        it: {
            "nav.team": "Squadra", "nav.about": "Info Squadra", "nav.players": "Giocatori", "nav.stats": "Statistiche",
            "nav.gallery": "Galleria", "nav.matches": "Partite", "nav.shop": "Store", "nav.sponsors": "Sponsor",
            "nav.faq": "FAQ", "nav.contact": "Contatti", "matches_page.title": "Calendario & Risultati",
            "matches_page.intro": "Calendario delle partite e dettagli di Yokohama Calcio.", "matches_page.upcoming_title": "Prossime Partite",
            "matches_page.past_title": "Risultati Passati", "matches_page.season_label": "Stagione:", "matches_page.all_seasons": "Tutte",
            "filter.all": "Tutti", "filter.league": "Campionato", "filter.cup": "Coppa", "filter.friendly": "Amichevoli",
            "badge.friendly": "Prossima (Amichevole)", "badge.live": "🔴 IN DIRETTA", "badge.past_friendly": "Amichevole",
            "label.venue": "Campo:", "label.kickoff": "Calcio d'inizio:", "label.scorers": "Marcatori:",
            "label.mvp": "MVP:", "label.yellow_cards": "Ammoniti:", "label.red_cards": "Espulsi:",
            "btn.details": "Dettagli", "btn.load_more_3": "Mostra le prossime 3 partite", "btn.show_less": "Riduci elenco", "btn.back_home": "Torna alla Home"
        },
        en: {
            "nav.team": "Team", "nav.about": "About Us", "nav.players": "Players", "nav.stats": "Statistics",
            "nav.gallery": "Gallery", "nav.matches": "Matches", "nav.shop": "Shop", "nav.sponsors": "Sponsors",
            "nav.faq": "FAQ", "nav.contact": "Contact", "matches_page.title": "Fixtures & Results",
            "matches_page.intro": "Match schedule and match information for Yokohama Calcio.", "matches_page.upcoming_title": "Upcoming Matches",
            "matches_page.past_title": "Match Results", "matches_page.season_label": "Season:", "matches_page.all_seasons": "All Time",
            "filter.all": "All", "filter.league": "League", "filter.cup": "Cup", "filter.friendly": "Friendly",
            "badge.friendly": "Next (Friendly)", "badge.live": "🔴 LIVE", "badge.past_friendly": "Friendly Match",
            "label.venue": "Venue:", "label.kickoff": "Kick-Off:", "label.scorers": "Scorers:",
            "label.mvp": "MVP:", "label.yellow_cards": "Yellow Cards:", "label.red_cards": "Red Cards:",
            "btn.details": "Details", "btn.load_more_3": "Show next 3 matches", "btn.show_less": "Show less", "btn.back_home": "Back to Home"
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        if (rawMatches.length > 0) {
            renderMatches();
            filterAndPaginateMatches();
        }
    }

    function updateCounter(shown, total) {
        const counterEl = document.getElementById('matchesCounter');
        if (!counterEl) return;
        if (total === 0) {
            counterEl.style.display = 'none';
            return;
        }
        counterEl.style.display = 'block';
        let text = '';
        if (currentLang === 'ja') text = `表示中: ${shown} / ${total} 試合`;
        else if (currentLang === 'it') text = `Mostrate: ${shown} di ${total} partite`;
        else text = `Showing: ${shown} of ${total} matches`;
        counterEl.textContent = text;
    }

    function filterAndPaginateMatches() {
        const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
        const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';
        const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
        let visibleMatches = 0;

        pastCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);

            if (categoryMatch && seasonMatch) {
                visibleMatches++;
                card.style.display = (visibleMatches <= visiblePastMatchesCount) ? 'block' : 'none';
            } else {
                card.style.display = 'none';
            }
        });

        const shown = Math.min(visiblePastMatchesCount, visibleMatches);
        updateCounter(shown, visibleMatches);

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            if (visibleMatches > 0) {
                loadMoreBtn.style.display = 'inline-flex';
                if (visibleMatches > visiblePastMatchesCount) {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> <span>${translations[currentLang]['btn.load_more_3']}</span>`;
                } else {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-up"></i> <span>${translations[currentLang]['btn.show_less']}</span>`;
                }
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        const upcomingCards = document.querySelectorAll('#upcomingContainer .match-detail-card');
        upcomingCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);
            card.style.display = (categoryMatch && seasonMatch) ? 'block' : 'none';
        });
    }

    function renderMatches() {
        const upcomingContainer = document.getElementById('upcomingContainer');
        const pastContainer = document.getElementById('pastContainer');
        if (!upcomingContainer || !pastContainer) return;

        upcomingContainer.innerHTML = '';
        pastContainer.innerHTML = '';

        rawMatches.forEach(m => {
            const isPast = m.status === 'past';
            const cardClass = isPast ? 'match-detail-card match-past-item' : 'match-detail-card match-upcoming';
            const scoreClass = isPast ? 'match-vs-score score-past' : 'match-vs-score';
            
            const rawDate = m.date ? m.date.trim().replace(/\./g, '-').substring(0, 10) : '';

            let badgeHtml = '';
            if (m.status === 'live') {
                badgeHtml = `<span class="match-badge" style="background: #ef4444; color: white; animation: pulse 1.5s infinite;">${translations[currentLang]['badge.live']}</span>`;
            } else if (isPast) {
                badgeHtml = `<span class="match-badge badge-friendly">${m.type || '練習試合'}</span>`;
            } else {
                badgeHtml = `<span class="match-badge badge-next">${m.type || '次戦 (練習試合)'}</span>`;
            }

            const team2Logo = m.team2Logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.team2Name || 'VS')}&background=003C82&color=ffffff&size=100&bold=true`;

            const isHome = m.isHome !== undefined ? m.isHome : true;
            let leftTeamName, leftTeamLogo, leftTeamLogoClass, rightTeamName, rightTeamLogo, rightTeamLogoClass, displayScore;

            if (isHome) {
                leftTeamName = m.team1Name || 'Yokohama Calcio';
                leftTeamLogo = './immagini/logo.png';
                leftTeamLogoClass = '';
                rightTeamName = m.team2Name || '-';
                rightTeamLogo = team2Logo;
                rightTeamLogoClass = 'opponent-logo';
                displayScore = m.score;
            } else {
                leftTeamName = m.team2Name || '-';
                leftTeamLogo = team2Logo;
                leftTeamLogoClass = 'opponent-logo';
                rightTeamName = m.team1Name || 'Yokohama Calcio';
                rightTeamLogo = './immagini/logo.png';
                rightTeamLogoClass = '';
                if (m.score && m.score !== 'VS' && m.score.includes('-')) {
                    const parts = m.score.split('-');
                    displayScore = parts.length === 2 ? `${parts[1].trim()} - ${parts[0].trim()}` : m.score;
                } else {
                    displayScore = m.score;
                }
            }

            const displayDateTime = m.time ? `${m.date} ${m.time}` : m.date;

            let detailsHtml = `<div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span><strong>${translations[currentLang]['label.venue']}</strong> ${m.venue || '-'}</span></div>`;
            if (m.time) detailsHtml += `<div class="detail-item"><i class="fas fa-clock"></i> <span><strong>${translations[currentLang]['label.kickoff']}</strong> ${m.time}</span></div>`;
            if (m.scorers && m.scorers !== 'なし' && m.scorers !== 'Nessuno') detailsHtml += `<div class="detail-item"><i class="fas fa-futbol"></i> <span><strong>${translations[currentLang]['label.scorers']}</strong> ${m.scorers}</span></div>`;
            if (m.mvp && m.mvp !== 'なし' && m.mvp !== 'Nessuno') detailsHtml += `<div class="detail-item"><i class="fas fa-star" style="color: #f59e0b;"></i> <span><strong>${translations[currentLang]['label.mvp']}</strong> ${m.mvp}</span></div>`;
            if (m.yellow_cards && m.yellow_cards !== 'なし' && m.yellow_cards !== 'Nessuno') detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #eab308;"></i> <span><strong>${translations[currentLang]['label.yellow_cards']}</strong> ${m.yellow_cards}</span></div>`;
            if (m.red_cards && m.red_cards !== 'なし' && m.red_cards !== 'Nessuno') detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #ef4444;"></i> <span><strong>${translations[currentLang]['label.red_cards']}</strong> ${m.red_cards}</span></div>`;
            if (m.goalkeepers && m.goalkeepers !== '') detailsHtml += `<div class="detail-item"><i class="fas fa-hands"></i> <span><strong>GK:</strong> ${m.goalkeepers}</span></div>`;

            const cardHtml = `
                <div class="${cardClass}" id="${m.id}" data-match-category="${m.category}" data-match-date="${rawDate}">
                    <div class="match-header-row">
                        ${badgeHtml}
                        <span class="match-date-text"><i class="far fa-calendar-alt"></i> ${displayDateTime}</span>
                    </div>
                    <div class="match-teams-row">
                        <div class="match-team">
                            <img src="${leftTeamLogo}" alt="${leftTeamName}" class="${leftTeamLogoClass}">
                            <span>${leftTeamName}</span>
                        </div>
                        <div class="${scoreClass}">${displayScore}</div>
                        <div class="match-team">
                            <img src="${rightTeamLogo}" alt="${rightTeamName}" class="${rightTeamLogoClass}">
                            <span>${rightTeamName}</span>
                        </div>
                    </div>
                    <button class="toggle-details-btn"><i class="fas fa-info-circle"></i> <span>${translations[currentLang]['btn.details']}</span></button>
                    <div class="match-expand-details" style="display: none;">
                        <div class="details-inner">${detailsHtml}</div>
                    </div>
                </div>
            `;

            (isPast ? pastContainer : upcomingContainer).insertAdjacentHTML('beforeend', cardHtml);
        });

        populateSeasonSelect(rawMatches);

        document.querySelectorAll('.toggle-details-btn').forEach(btn => {
            btn.onclick = function(e) {
                e.preventDefault();
                const card = this.closest('.match-detail-card');
                const details = card.querySelector('.match-expand-details');
                const wasActive = card.classList.contains('active');

                document.querySelectorAll('.match-detail-card').forEach(c => {
                    c.classList.remove('active');
                    const det = c.querySelector('.match-expand-details');
                    if (det) det.style.display = 'none';
                });

                if (!wasActive) {
                    card.classList.add('active');
                    if (details) details.style.display = 'block';
                }
            };
        });
    }

    function populateSeasonSelect(matches) {
        const select = document.getElementById('matchSeasonSelect');
        if (!select) return;
        const yearsSet = new Set();
        matches.forEach(m => {
            if (m.date) {
                const y = m.date.substring(0, 4);
                if (y && !isNaN(y)) yearsSet.add(y);
            }
        });
        let years = Array.from(yearsSet).sort((a, b) => b - a);
        select.innerHTML = '';
        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = translations[currentLang]['matches_page.all_seasons'] || '全期間';
        select.appendChild(allOption);
        years.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = `${year}年`;
            select.appendChild(option);
        });
        const currentYear = new Date().getFullYear().toString();
        select.value = years.includes(currentYear) ? currentYear : (years.length > 0 ? years[0] : 'all');
    }

    async function loadData() {
        try {
            const response = await fetch('matches.json');
            if (!response.ok) throw new Error('matches.json non trovato');
            rawMatches = await response.json();

            renderMatches();
            filterAndPaginateMatches();
        } catch (error) {
            console.error("Errore nel caricamento di matches.json:", error);
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('currentYear')?.textContent = new Date().getFullYear();

        await loadData();
        setLanguage(currentLang);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                if (lang) setLanguage(lang);
            });
        });

        document.querySelectorAll('[data-match-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-match-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        });

        const seasonSelect = document.getElementById('matchSeasonSelect');
        seasonSelect?.addEventListener('change', () => {
            visiblePastMatchesCount = 3;
            filterAndPaginateMatches();
        });

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        loadMoreBtn?.addEventListener('click', (e) => {
            e.preventDefault();
            const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
            const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';
            const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
            let totalPast = 0;
            pastCards.forEach(card => {
                const category = card.getAttribute('data-match-category');
                const date = card.getAttribute('data-match-date') || '';
                const matchYear = date.substring(0, 4);
                if ((activeCategory === 'all' || category === activeCategory) && (activeSeason === 'all' || matchYear === activeSeason)) {
                    totalPast++;
                }
            });
            visiblePastMatchesCount = (visiblePastMatchesCount < totalPast) ? visiblePastMatchesCount + 3 : 3;
            filterAndPaginateMatches();
        });

        const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
        const mobileNav = document.querySelector('.mobile-nav');
        mobileMenuBtn?.addEventListener('click', () => mobileNav.classList.toggle('hidden'));

        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            window.addEventListener('scroll', () => scrollToTopBtn.style.display = window.scrollY > 300 ? 'block' : 'none');
            scrollToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
    });
</script>
</body>
</html>
