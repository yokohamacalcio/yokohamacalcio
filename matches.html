<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合日程・結果 | Yokohama Calcio</title>
    <meta name="description" content="Yokohama Calcioの試合日程および過去の対戦結果一覧です。">
    <link rel="icon" href="./immagini/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .badge-live { background: #ef4444; color: white; animation: pulse 1.5s infinite; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

<header class="header">
  <!-- ... (Header invariato) ... -->
</header>

<section class="section matches-page-section">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-trophy"></i> <span data-i18n="matches_page.title">試合日程・結果一覧</span></h2>
        
        <div class="matches-list-wrapper">
            <!-- SEZIONE CALENDARIO -->
            <div class="matches-section-block">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-calendar-check" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.upcoming_title">試合日程</span>
                </h3>
                <div id="upcomingContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>

            <!-- SEZIONE RISULTATI -->
            <div class="matches-section-block" style="margin-top: 50px;">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-history" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.past_title">試合結果</span>
                </h3>
                <div id="pastContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>
        </div>
    </div>
</section>

<script>
    async function loadMatches() {
        try {
            const response = await fetch('matches.json');
            const matches = await response.json();
            const upcomingContainer = document.getElementById('upcomingContainer');
            const pastContainer = document.getElementById('pastContainer');
            
            matches.forEach(match => {
                const team2Logo = match.team2Logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(match.team2Name)}&background=random&color=ffffff&size=100&bold=true`;
                let badgeHtml = match.status === 'live' ? '<span class="badge-live">🔴 LIVE</span>' : `<span class="match-badge">${match.type}</span>`;
                
                const cardHtml = `
                    <div class="match-detail-card">
                        <div class="match-header-row">
                            ${badgeHtml}
                            <span class="match-date-text"><i class="far fa-calendar-alt"></i> ${match.date}</span>
                        </div>
                        <div class="match-teams-row">
                            <div class="match-team"><img src="./immagini/logo.png"><span>${match.team1Name}</span></div>
                            <div class="match-vs-score ${match.status === 'past' ? 'score-past' : ''}">${match.score}</div>
                            <div class="match-team"><img src="${team2Logo}" class="opponent-logo"><span>${match.team2Name}</span></div>
                        </div>
                        ${(match.scorers && match.scorers !== 'なし') ? `
                        <div class="match-expand-details" style="display:block; margin-top:10px;">
                            <div class="details-inner">
                                <div class="detail-item"><i class="fas fa-futbol"></i> <strong>得点者:</strong> ${match.scorers}</div>
                            </div>
                        </div>` : ''}
                    </div>
                `;

                if (match.status === 'upcoming' || match.status === 'live') {
                    upcomingContainer.insertAdjacentHTML('beforeend', cardHtml);
                } else {
                    pastContainer.insertAdjacentHTML('beforeend', cardHtml);
                }
            });
        } catch (e) { console.error("Errore caricamento:", e); }
    }
    window.addEventListener('DOMContentLoaded', loadMatches);
</script>
</body>
</html>
