function t(key) {
    const lang = localStorage.getItem('preferred_lang') || 'ja';
    return (YC.translations[lang] && YC.translations[lang][key]) || key;
}

function cleanStr(s) {
    return String(s || '').toLowerCase().replace(/[\s\u3000]+/g, '').trim();
}

function extractYear(dateStr) {
    if (!dateStr) return '';
    const match = String(dateStr).match(/\b(20\d\d)\b/);
    return match ? match[1] : '';
}

function getNormalizedCategory(cat) {
    const c = String(cat || '').toLowerCase().trim();
    if (c === 'official' || c === 'league') return 'league';
    if (c === 'cup' || c === 'tournament') return 'cup';
    return 'friendly';
}

function getUniqueTeamColor(idOrName) {
    let hash = 0;
    const str = String(idOrName || 'opponent').toLowerCase();
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = Math.abs(hash) % 360;
    const saturation = 70 + (Math.abs(hash >> 3) % 20);
    const lightness = 35 + (Math.abs(hash >> 5) % 15);
    const l = lightness / 100;
    const a = saturation * Math.min(l, 1 - l) / 100;
    const f = n => {
        const k = (n + hue / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
    };
    return `${f(0)}${f(8)}${f(4)}`;
}

function getRomajiName(match, defaultName) {
    if (match && match.opponent_id && opponentsData[match.opponent_id]) {
        const opp = opponentsData[match.opponent_id];
        if (opp.name) {
            const romaji = opp.name['en'] || opp.name['it'];
            if (romaji) return romaji;
        }
    }
    const rawName = defaultName || '';
    if (commonRomajiMap[rawName]) return commonRomajiMap[rawName];
    const cleanLatin = String(rawName).replace(/[^\x00-\x7F]/g, '').trim();
    if (cleanLatin.length > 0) return cleanLatin;
    return rawName || 'Opponent';
}

function getAvatarUrl(matchOrName, romajiFallback) {
    const identifier = (typeof matchOrName === 'object' && matchOrName !== null) 
        ? (matchOrName.opponent_id || matchOrName.opponent_name || matchOrName.team2Name || 'opponent') 
        : String(matchOrName || 'opponent');
    const romaji = (typeof matchOrName === 'object' && matchOrName !== null) 
        ? getRomajiName(matchOrName, romajiFallback) 
        : (romajiFallback || identifier);
    const bgHex = getUniqueTeamColor(identifier);
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(romaji)}&background=${bgHex}&color=ffffff&bold=true&size=128`;
}

function getOpponentInfo(match, lang) {
    let name = '';
    let logo = '';
    if (match.opponent_id && opponentsData[match.opponent_id]) {
        const opp = opponentsData[match.opponent_id];
        name = (opp.name && (opp.name[lang] || opp.name['ja'])) || match.opponent_name || match.team2Name || 'Opponent';
        logo = opp.logo || match.opponent_logo || match.team2Logo || '';
    } else {
        name = match.opponent_name || match.team2Name || 'Opponent';
        logo = match.opponent_logo || match.team2Logo || '';
    }
    const romajiName = getRomajiName(match, name);
    if (!logo || logo.trim() === '') {
        logo = getAvatarUrl(match, romajiName);
    }
    return { name, romajiName, logo };
}

function formatDateWithDay(dateStr, lang) {
    if (!dateStr) return '';
    if (dateStr.includes('(')) return dateStr;
    const cleanDateStr = dateStr.trim().replace(/\./g, '-');
    const dateObj = new Date(cleanDateStr);
    if (isNaN(dateObj)) return dateStr;
    const localeMap = { ja: 'ja-JP', it: 'it-IT', en: 'en-US' };
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
    return new Intl.DateTimeFormat(localeMap[lang] || 'ja-JP', options).format(dateObj);
}

function getLocationInfo(locId, venueFallback, lang) {
    const loc = locationsData[locId];
    if (!loc) {
        const fallbackName = venueFallback || locId || '-';
        return { name: fallbackName, maps: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fallbackName)}`, surface: '' };
    }
    const name = loc[lang] || loc['ja'] || venueFallback || locId;
    const surface = loc.surface ? (loc.surface[lang] || loc.surface['ja'] || '') : '';
    const maps = loc.maps || loc.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
    return { name, maps, surface };
}

function findPlayerObj(query) {
    if (!query || query === 'なし' || query === 'Nessuno') return null;
    if (!playersData || playersData.length === 0) return null;
    const target = cleanStr(query);
    if (!target) return null;

    let found = playersData.find(p => {
        const k = cleanStr(p.name_kanji);
        const kn = cleanStr(p.name_kana);
        const r = cleanStr(p.name_romaji);
        const pid = cleanStr(p.id);
        return (k && k === target) || (kn && kn === target) || (r && r === target) || (pid && pid === target);
    });
    if (found) return found;

    return playersData.find(p => {
        const k = cleanStr(p.name_kanji);
        const kn = cleanStr(p.name_kana);
        const r = cleanStr(p.name_romaji);
        return (k && (k.includes(target) || target.includes(k))) ||
               (kn && (kn.includes(target) || target.includes(kn))) ||
               (r && (r.includes(target) || target.includes(r)));
    }) || null;
}

function getPlayerNameInLang(query, lang) {
    const player = findPlayerObj(query);
    if (!player) return query;
    if (lang === 'ja') {
        if (player.name_kanji && /[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\uff00-\uffef\u4e00-\u9faf\u3400-\u4dbf]/.test(player.name_kanji)) return player.name_kanji;
        return player.name_kana || player.name_kanji || player.name_romaji || query;
    }
    return player.name_romaji || player.name_kanji || query;
}

function translatePlayerText(text, lang) {
    if (!text || typeof text !== 'string') return text || '';
    if (text === 'なし' || text === 'Nessuno') return text;

    const items = text.split(/[,、]/);
    return items.map(item => {
        let str = item.trim();
        if (!str) return '';

        let multiplier = '';
        const multMatch = str.match(/(.*?)\s*(x\d+|\*\d+|\(\d+\))$/i);
        if (multMatch) {
            str = multMatch[1].trim();
            multiplier = ' ' + multMatch[2];
        }

        const match = str.match(/^([^(（]+)[(（]([^)）]+)[)）]$/);
        if (match) {
            const mainName = match[1].trim();
            const extraVal = match[2].trim();
            const translatedMain = getPlayerNameInLang(mainName, lang);
            const translatedExtra = isNaN(extraVal) ? getPlayerNameInLang(extraVal, lang) : extraVal;
            return `${translatedMain} (${translatedExtra})${multiplier}`;
        }

        return `${getPlayerNameInLang(str, lang)}${multiplier}`;
    }).filter(Boolean).join(', ');
}

function startCountdown(dateStr, timeStr) {
    if (countdownInterval) clearInterval(countdownInterval);
    if (!dateStr) return;

    const time = timeStr ? timeStr.trim() : '10:00';
    const cleanDate = dateStr.trim().replace(/\./g, '-');
    const isoDate = `${cleanDate}T${time}:00+09:00`;
    const targetTime = new Date(isoDate).getTime();

    function updateTimer() {
        const now = new Date().getTime();
        const diff = targetTime - now;

        const daysEl = document.getElementById('cd-days');
        const hoursEl = document.getElementById('cd-hours');
        const minsEl = document.getElementById('cd-mins');
        const secsEl = document.getElementById('cd-secs');

        if (!daysEl) return;

        if (diff <= 0) {
            daysEl.textContent = '00';
            hoursEl.textContent = '00';
            minsEl.textContent = '00';
            secsEl.textContent = '00';
            if (countdownInterval) clearInterval(countdownInterval);
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        daysEl.textContent = String(days).padStart(2, '0');
        hoursEl.textContent = String(hours).padStart(2, '0');
        minsEl.textContent = String(minutes).padStart(2, '0');
        secsEl.textContent = String(seconds).padStart(2, '0');
    }

    updateTimer();
    countdownInterval = setInterval(updateTimer, 1000);
}

function updateCounter(shown, total) {
    const counterEl = document.getElementById('matchesCounter');
    if (!counterEl) return;
    if (total === 0) {
        counterEl.style.display = 'none';
        return;
    }
    counterEl.style.display = 'block';
    const lang = localStorage.getItem('preferred_lang') || 'ja';
    let text = '';

    else if (lang === 'it') text = `Mostrate: ${shown} di ${total} partite`;
    else text = `Showing: ${shown} of ${total} matches`;

function filterAndPaginateMatches() {
    const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
    const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';

    const pastCards = document.querySelectorAll('#pastContainer .match-box-card, #pastContainer .match-detail-card');
    let visibleMatches = 0;

    pastCards.forEach(card => {
        const rawCategory = card.getAttribute('data-match-category');
        const categoryNormalized = getNormalizedCategory(rawCategory);
        const date = card.getAttribute('data-match-date') || '';
        const matchYear = extractYear(date);
        
        const categoryMatch = (activeCategory === 'all' || categoryNormalized === activeCategory);
        const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason || !matchYear);

        if (categoryMatch && seasonMatch) {
            visibleMatches++;
            card.style.display = (visibleMatches <= visiblePastMatchesCount) ? 'block' : 'none';
        } else {
            card.style.display = 'none';
        }
    });

    const shown = Math.min(visiblePastMatchesCount, visibleMatches);
    updateCounter(shown, visibleMatches);

    const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
    if (loadMoreBtn) {
        if (visibleMatches > 0) {
            loadMoreBtn.style.display = 'inline-flex';
            if (visibleMatches > visiblePastMatchesCount) {
                loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> <span>${t('btn.load_more_3')}</span>`;
            } else {
                loadMoreBtn.innerHTML = `<i class="fas fa-chevron-up"></i> <span>${t('btn.show_less')}</span>`;
            }
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    const upcomingCards = document.querySelectorAll('#upcomingContainer .upcoming-item');
    upcomingCards.forEach((card, index) => {
        const rawCategory = card.getAttribute('data-match-category');
        const categoryNormalized = getNormalizedCategory(rawCategory);
        const date = card.getAttribute('data-match-date') || '';
        const matchYear = extractYear(date);

        const categoryMatch = (activeCategory === 'all' || categoryNormalized === activeCategory);
        const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason || !matchYear);

        if (categoryMatch && seasonMatch) {
            if (index === 0 || isAllUpcomingVisible) card.style.display = 'block';
            else card.style.display = 'none';
        } else {
            card.style.display = 'none';
        }
    });
}

        if (isHome) {
            leftTeamName = m.team1Name || 'Yokohama Calcio';
            leftTeamLogo = './immagini/logo.png?v=2';
            leftTeamClass = 'yokohama-logo';
            rightTeamName = oppInfo.name;
            rightTeamLogo = oppInfo.logo;
            rightTeamClass = 'opponent-logo';
            rightErr = `onerror="this.onerror=null;this.src='${fallbackAvatar}';"`;
            rawScore = m.score;
        } else {
            leftTeamName = oppInfo.name;
            leftTeamLogo = oppInfo.logo;
            leftTeamClass = 'opponent-logo';
            leftErr = `onerror="this.onerror=null;this.src='${fallbackAvatar}';"`;
            rightTeamName = m.team1Name || 'Yokohama Calcio';
            rightTeamLogo = './immagini/logo.png?v=2';
            rightTeamClass = 'yokohama-logo';
            if (m.score && m.score !== 'VS' && m.score.includes('-')) {
                const parts = m.score.split('-');
                rawScore = parts.length === 2 ? `${parts[1].trim()}-${parts[0].trim()}` : m.score;
            } else {
                rawScore = m.score;
            }
        }

        let displayScore = rawScore;
        if (rawScore && rawScore !== 'VS' && rawScore.includes('-')) {
            const parts = rawScore.split('-');
            if (parts.length === 2) {
                displayScore = `${parts[0].trim()} - ${parts[1].trim()}`;
            }
        }

        const mapsHtml = locInfo.maps !== '#' ? `<a href="${locInfo.maps}" target="_blank" rel="noopener" style="color:var(--dark-navy); text-decoration:none;"><span>${locInfo.name}</span> <i class="fas fa-external-link-alt" style="font-size: 0.72rem; opacity: 0.8; margin-left: 3px;"></i></a>` : locInfo.name;

        const scorersTranslated = translatePlayerText(m.scorers, currentLang);
        const assistsTranslated = translatePlayerText(m.assists, currentLang);
        const mvpTranslated = translatePlayerText(m.mvp, currentLang);
        const yellowCardsTranslated = translatePlayerText(m.yellow_cards, currentLang);
        const redCardsTranslated = translatePlayerText(m.red_cards, currentLang);

        let detailsHtml = `<div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span><strong>${t('label.venue')}</strong> ${mapsHtml}</span></div>`;
        if (locInfo.surface) {
            detailsHtml += `<div class="detail-item"><i class="fas fa-layer-group" style="color: var(--primary-sky);"></i> <span><strong>${t('label.surface')}</strong> ${locInfo.surface}</span></div>`;
        }
        if (m.time) {
            detailsHtml += `<div class="detail-item"><i class="fas fa-clock"></i> <span><strong>${t('label.kickoff')}</strong> ${m.time}</span></div>`;
        }
        if (scorersTranslated && scorersTranslated !== 'なし' && scorersTranslated !== 'Nessuno') {
            detailsHtml += `<div class="detail-item"><i class="fas fa-futbol"></i> <span><strong>${t('label.scorers')}</strong> ${scorersTranslated}</span></div>`;
        }
        if (assistsTranslated && assistsTranslated !== 'なし' && assistsTranslated !== 'Nessuno') {
            detailsHtml += `<div class="detail-item"><i class="fas fa-shoe-prints" style="color: var(--primary-sky);"></i> <span><strong>${t('label.assists')}</strong> ${assistsTranslated}</span></div>`;
        }
        if (mvpTranslated && mvpTranslated !== 'なし' && mvpTranslated !== 'Nessuno') {
            detailsHtml += `<div class="detail-item"><i class="fas fa-star" style="color: #f59e0b;"></i> <span><strong>${t('label.mvp')}</strong> ${mvpTranslated}</span></div>`;
        }
        if (yellowCardsTranslated && yellowCardsTranslated !== 'なし' && yellowCardsTranslated !== 'Nessuno') {
            detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #eab308;"></i> <span><strong>${t('label.yellow_cards')}</strong> ${yellowCardsTranslated}</span></div>`;
        }
        if (redCardsTranslated && redCardsTranslated !== 'なし' && redCardsTranslated !== 'Nessuno') {
            detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #ef4444;"></i> <span><strong>${t('label.red_cards')}</strong> ${redCardsTranslated}</span></div>`;
        }

        let quickInfoHtml = '';
        if (scorersTranslated && scorersTranslated !== 'なし' && scorersTranslated !== 'Nessuno') {
            quickInfoHtml += `<div class="match-info-item"><i class="fas fa-futbol" style="color: var(--dark-navy);"></i> <span>${scorersTranslated}</span></div>`;
        }
        if (mvpTranslated && mvpTranslated !== 'なし' && mvpTranslated !== 'Nessuno') {
            quickInfoHtml += `<div class="match-info-item"><i class="fas fa-star" style="color: #f59e0b;"></i> <strong style="color: var(--dark-navy);">${mvpTranslated}</strong></div>`;
        }

        const cardHtml = `
            <div class="match-box-card match-past-box match-detail-card" id="${m.id}" data-match-category="${catNormalized}" data-match-date="${rawDate}">
                <div class="match-past-header">
                    <div class="match-badge-group">
                        ${badgeHtml}
                    </div>
                    <span class="match-box-date"><i class="far fa-calendar-alt"></i> ${formattedDate}</span>
                </div>
                <div class="match-box-card-inner">
                    <div class="match-teams-wrapper">
                        <div class="teams-logos-row">
                            <div class="card-logo-wrap"><img src="${leftTeamLogo}" alt="${leftTeamName}" class="${leftTeamClass}" ${leftErr}></div>
                            <div class="match-vs-center score-past">${displayScore}</div>
                            <div class="card-logo-wrap"><img src="${rightTeamLogo}" alt="${rightTeamName}" class="${rightTeamClass}" ${rightErr}></div>
                        </div>
                        <div class="teams-names-row">
                            <div class="team-name-col" title="${leftTeamName}">${leftTeamName}</div>
                            <div></div>
                            <div class="team-name-col" title="${rightTeamName}">${rightTeamName}</div>
                        </div>
                    </div>
                    ${quickInfoHtml ? `<div class="match-info-hero-bar">${quickInfoHtml}</div>` : ''}
                </div>
                <div>
                    <div class="match-box-venue">
                        <i class="fas fa-map-marker-alt"></i> ${mapsHtml}
                    </div>
                    <div class="match-card-footer">
                        <button class="toggle-details-btn btn-match-detail">
                            <span class="btn-text">${t('btn.details')}</span> <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
                <div class="match-expand-details" style="display: none;">
                    <div class="details-inner">
                        ${detailsHtml}
                    </div>
                </div>
            </div>
        `;
        pastContainer.insertAdjacentHTML('beforeend', cardHtml);
    });

    populateSeasonSelect(rawMatches);

    document.querySelectorAll('#pastContainer .match-box-card, #upcomingContainer .match-box-card').forEach(card => {
        const toggleBtn = card.querySelector('.toggle-details-btn');
        const details = card.querySelector('.match-expand-details');

        if (toggleBtn) {
            toggleBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const wasActive = card.classList.contains('active');

                document.querySelectorAll('.match-box-card, .match-detail-card').forEach(c => {
                    c.classList.remove('active');
                    const det = c.querySelector('.match-expand-details');
                    if (det) det.style.display = 'none';
                });

                if (!wasActive) {
                    card.classList.add('active');
                    if (details) details.style.display = 'block';
                }
                updateBtnTexts();
            };
        }
    });

    updateBtnTexts();
}

function populateSeasonSelect(matches) {
    const select = document.getElementById('matchSeasonSelect');
    if (!select) return;

    const isUserSelected = select.dataset.userModified === "true";
    const currentSelected = select.value;
    
    const yearsSet = new Set();
    matches.forEach(m => {
        const y = extractYear(m.date);
        if (y) yearsSet.add(y);
    });

    let years = Array.from(yearsSet).sort((a, b) => b - a);
    const currentYearStr = new Date().getFullYear().toString();

    select.innerHTML = '';

    const allOption = document.createElement('option');
    allOption.value = 'all';
    allOption.textContent = t('matches_page.all_seasons');
    select.appendChild(allOption);

    years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = `${year}年`;
        select.appendChild(option);
    });

    if (isUserSelected && currentSelected) {
        select.value = currentSelected;
    } else if (years.includes(currentYearStr)) {
        select.value = currentYearStr;
    } else if (years.length > 0) {
        select.value = years[0];
    } else {
        select.value = 'all';
    }
}

function handleHashOnLoad() {
    const hash = window.location.hash;
    if (!hash) return;

    const previousCount = visiblePastMatchesCount;
    visiblePastMatchesCount = 1000;
    filterAndPaginateMatches();

    const targetCard = document.querySelector(hash);
    if (targetCard) {
        setTimeout(() => {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('active');
            const details = targetCard.querySelector('.match-expand-details');
            if (details) details.style.display = 'block';

            visiblePastMatchesCount = previousCount;
            filterAndPaginateMatches();
            targetCard.style.display = 'block';
            updateBtnTexts();

            if (history.replaceState) {
                history.replaceState(null, "", window.location.pathname + window.location.search);
            }
        }, 100);
    } else {
        visiblePastMatchesCount = previousCount;
        filterAndPaginateMatches();
    }
}

async function loadAllData() {
    try {
        const [mResp, lResp, pResp, oResp] = await Promise.allSettled([
            fetch('matches.json'),
            fetch('locations.json'),
            fetch('players.json'),
            fetch('opponents.json')
        ]);
        
        if (mResp.status === 'fulfilled' && mResp.value.ok) rawMatches = await mResp.value.json();
        if (lResp.status === 'fulfilled' && lResp.value.ok) locationsData = await lResp.value.json();
        if (pResp.status === 'fulfilled' && pResp.value.ok) playersData = await pResp.value.json();
        if (oResp.status === 'fulfilled' && oResp.value.ok) opponentsData = await oResp.value.json();

        if (rawMatches && rawMatches.length > 0) {
            renderMatches();
        }
        filterAndPaginateMatches();
        handleHashOnLoad();
    } catch (error) {
        console.error("Errore nel caricamento dati:", error);
        filterAndPaginateMatches();
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadAllData();

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setTimeout(() => {
                if (rawMatches && rawMatches.length > 0) {
                    renderMatches();
                }
                filterAndPaginateMatches();
            }, 50);
        });
    });

    document.querySelectorAll('[data-match-filter]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('[data-match-filter]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            visiblePastMatchesCount = 3;
            filterAndPaginateMatches();
        });
    });

    const seasonSelect = document.getElementById('matchSeasonSelect');
    if (seasonSelect) {
        seasonSelect.addEventListener('change', function() {
            this.dataset.userModified = "true";
            visiblePastMatchesCount = 3;
            filterAndPaginateMatches();
        });
    }

    const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
    if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
            const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';
            const pastCards = document.querySelectorAll('#pastContainer .match-box-card, #pastContainer .match-detail-card');
            let totalPast = 0;
            pastCards.forEach(card => {
                const rawCategory = card.getAttribute('data-match-category');
                const categoryNormalized = getNormalizedCategory(rawCategory);
                const date = card.getAttribute('data-match-date') || '';
                const matchYear = extractYear(date);
                
                if ((activeCategory === 'all' || categoryNormalized === activeCategory) && (activeSeason === 'all' || matchYear === activeSeason || !matchYear)) {
                    totalPast++;
                }
            });

            if (visiblePastMatchesCount < totalPast) {
                visiblePastMatchesCount += 3;
            } else {
                visiblePastMatchesCount = 3;
            }
            filterAndPaginateMatches();
        });
    }
});
</script>
