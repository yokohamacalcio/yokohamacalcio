<script>
YC.register({
  ja: { 'm.title': '試合日程・結果', 'm.intro': 'Yokohama Calcioの試合スケジュールと過去の対戦結果です。', 'm.upcoming': '試合日程', 'm.past': '試合結果', 'm.all': 'すべて', 'm.league': 'リーグ戦', 'm.cup': 'カップ戦', 'm.friendly': '練習試合', 'm.all_seasons': '全期間', 'm.next': '次戦', 'm.live': 'LIVE', 'm.details': '詳細', 'm.hide': '閉じる', 'm.more': 'さらに{n}試合を表示', 'm.less': '最初の{n}試合に戻す', 'm.counter': '表示中: {a} / {b} 試合', 'm.no_upcoming': '現在予定されている試合はありません。', 'm.no_past': '該当する試合結果がありません。', 'm.venue': '会場', 'm.surface': 'ピッチ', 'm.kickoff': 'キックオフ', 'm.scorers': '得点者', 'm.assists': 'アシスト', 'm.mvp': 'MVP', 'm.yellow': '警告', 'm.red': '退場', 'm.gk': 'GK（失点）', 'm.formation': '布陣', 'm.starters': '先発', 'm.subs': '途中出場', 'm.share': '共有', 'm.copied': 'リンクをコピーしました！', 'm.ics': 'カレンダー', 'm.pending': '結果待ち', 'm.win': '勝', 'm.draw': '分', 'm.loss': '負' },
  it: { 'm.title': 'Calendario & Risultati', 'm.intro': 'Il calendario delle partite e i risultati di Yokohama Calcio.', 'm.upcoming': 'Prossime partite', 'm.past': 'Risultati', 'm.all': 'Tutte', 'm.league': 'Campionato', 'm.cup': 'Coppa', 'm.friendly': 'Amichevoli', 'm.all_seasons': 'Tutte le stagioni', 'm.next': 'Prossima', 'm.live': 'IN DIRETTA', 'm.details': 'Dettagli', 'm.hide': 'Chiudi', 'm.more': 'Mostra altre {n} partite', 'm.less': 'Torna alle prime {n}', 'm.counter': 'Mostrate: {a} di {b} partite', 'm.no_upcoming': 'Nessuna partita in programma al momento.', 'm.no_past': 'Nessun risultato corrispondente.', 'm.venue': 'Campo', 'm.surface': 'Superficie', 'm.kickoff': 'Calcio d\'inizio', 'm.scorers': 'Marcatori', 'm.assists': 'Assist', 'm.mvp': 'MVP', 'm.yellow': 'Ammoniti', 'm.red': 'Espulsi', 'm.gk': 'Portieri (gol subiti)', 'm.formation': 'Modulo', 'm.starters': 'Titolari', 'm.subs': 'Subentrati', 'm.share': 'Condividi', 'm.copied': 'Link copiato!', 'm.ics': 'Calendario', 'm.pending': 'Risultato in arrivo', 'm.win': 'V', 'm.draw': 'N', 'm.loss': 'P' },
  en: { 'm.title': 'Fixtures & Results', 'm.intro': 'Match schedule and results for Yokohama Calcio.', 'm.upcoming': 'Upcoming matches', 'm.past': 'Results', 'm.all': 'All', 'm.league': 'League', 'm.cup': 'Cup', 'm.friendly': 'Friendlies', 'm.all_seasons': 'All seasons', 'm.next': 'Next', 'm.live': 'LIVE', 'm.details': 'Details', 'm.hide': 'Close', 'm.more': 'Show {n} more matches', 'm.less': 'Back to first {n}', 'm.counter': 'Showing {a} of {b} matches', 'm.no_upcoming': 'No upcoming matches scheduled.', 'm.no_past': 'No matching results.', 'm.venue': 'Venue', 'm.surface': 'Pitch', 'm.kickoff': 'Kick-off', 'm.scorers': 'Scorers', 'm.assists': 'Assists', 'm.mvp': 'MVP', 'm.yellow': 'Yellow cards', 'm.red': 'Red cards', 'm.gk': 'Goalkeepers (conceded)', 'm.formation': 'Formation', 'm.starters': 'Starters', 'm.subs': 'Substitutes used', 'm.share': 'Share', 'm.copied': 'Link copied!', 'm.ics': 'Calendar', 'm.pending': 'Result pending', 'm.win': 'W', 'm.draw': 'D', 'm.loss': 'L' }
});
YC.boot({ title: { ja: '試合日程・結果一覧 | Yokohama Calcio', it: 'Calendario & Risultati | Yokohama Calcio', en: 'Fixtures & Match Results | Yokohama Calcio' } });

const esc = YC.escapeHtml, t = k => YC.t(k), PAGE = 3;
const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : '#');
let D = null, ready = false, ui = { cat: 'all', season: 'all', shown: PAGE }, open = new Set(), pendingHash = decodeURIComponent(location.hash.slice(1));

const filterCat = c => { const n = YC.data.normCat(c); return n === 'tournament' ? 'cup' : n; };
const keyOf = m => (m.date || '') + (m.time || '');
function pass(m) { return (ui.cat === 'all' || filterCat(m.category) === ui.cat) && (ui.season === 'all' || String(m.date).slice(0, 4) === ui.season); }

/* ---- dettagli ---- */
function line(icon, label, html, customStyle = '') { return html ? `<div class="line"><i class="fas ${icon}" ${customStyle ? `style="${customStyle}"` : ''}></i><span><b>${label}:</b> ${html}</span></div>` : ''; }
function detailsHtml(m, past) {
  const lang = YC.lang(), d = YC.data, loc = d.locInfo(m.location_id, m.venue, lang, D.locations), P = D.players;
  const tx = txt => esc(d.translatePlayerText(txt, lang, P));

  let scorersStr = m.scorers;
  let assistsStr = m.assists;
  let yellowStr = m.yellow_cards;
  let redStr = m.red_cards;
  let gkStr = m.goalkeepers;
  let mvpStr = m.mvp;

  if (m.sub_matches && m.sub_matches.length > 0) {
    if (!scorersStr) scorersStr = m.sub_matches.map(s => s.scorers).filter(Boolean).join(', ');
    if (!assistsStr) assistsStr = m.sub_matches.map(s => s.assists).filter(Boolean).join(', ');
    if (!yellowStr) yellowStr = m.sub_matches.map(s => s.yellow_cards).filter(Boolean).join(', ');
    if (!redStr) redStr = m.sub_matches.map(s => s.red_cards).filter(Boolean).join(', ');
    if (!gkStr) gkStr = m.sub_matches.map(s => s.goalkeeper || s.goalkeepers).filter(Boolean).join(', ');
  }

  let h = line('fa-map-marker-alt', t('m.venue'), `<a href="${esc(safeUrl(loc.url))}" target="_blank" rel="noopener noreferrer">${esc(loc.name)} <i class="fas fa-external-link-alt" style="font-size:.65rem;width:auto"></i></a>`);
  h += line('fa-layer-group', t('m.surface'), esc(loc.surface)) + line('fa-clock', t('m.kickoff'), esc(m.time || ''));
  if (past) {
    h += line('fa-futbol', t('m.scorers'), tx(scorersStr)) 
       + line('fa-shoe-prints', t('m.assists'), tx(assistsStr)) 
       + line('fa-star', t('m.mvp'), tx(mvpStr), 'color:#f59e0b')
       + line('fa-square', t('m.yellow'), tx(yellowStr), 'color:#eab308') 
       + line('fa-square', t('m.red'), tx(redStr), 'color:#ef4444') 
       + line('fa-mitten', t('m.gk'), tx(gkStr))
       + line('fa-chess-board', t('m.formation'), m.formation ? esc(m.formation) : '');

    const sp = m.starters_positions || {};
    if (Object.keys(sp).length) {
      const chips = Object.entries(sp).map(([slot, n]) => { const p = d.findPlayer(P, n); return `<span><b>${esc(slot)}</b>${esc(p ? d.playerName(p, lang) : n)}</span>`; }).join('');
      h += `<div class="line"><i class="fas fa-users"></i><span><b>${t('m.starters')}</b><div class="lineup-chips">${chips}</div></span></div>`;
    }
    const subs = (m.substitutes_in || []).map(n => { const p = d.findPlayer(P, n); return esc(p ? d.playerName(p, lang) : n); });
    if (subs.length) h += line('fa-right-left', t('m.subs'), subs.join(', '));
  }
  return h;
}

/* ---- card ---- */
function card(m, kind) {
  const lang = YC.lang(), d = YC.data, o = d.oppInfo(m, lang, D.opponents), home = m.isHome !== false, badge = d.catBadge(m.category, lang);
  const upcoming = kind !== 'past';
  const sc = d.scoreParts(m), res = upcoming ? null : d.result(m);
  const id = esc(m.id || ''), isOpen = open.has(m.id);
  const live = m.status === 'live';

  const isTriangular = m.type === 'triangular' || m.category === 'triangular' || m.isTriangular || (m.sub_matches && m.sub_matches.length > 0) || (m.subMatches && m.subMatches.length > 0) || (Array.isArray(m.opponents) && m.opponents.length > 1);

  const badgeTri = isTriangular ? `<span class="mc-badge badge-tournament">3角戦</span>` : '';
  const heads = (kind === 'next' ? `<span class="mc-badge badge-next">${t('m.next')}</span>` : '') + (live ? `<span class="mc-badge badge-live">${t('m.live')}</span>` : '') + badgeTri + `<span class="mc-badge ${badge.cls}">${esc(badge.label)}</span>` + `<span class="mc-badge badge-ha">${home ? 'HOME' : 'AWAY'}</span>`;

  let teamsWrapperHtml = '';

  if (isTriangular) {
    if (upcoming) {
      const opps = Array.isArray(m.opponents) ? m.opponents : (m.sub_matches || m.subMatches || []);
      const opp1 = d.oppInfo(typeof opps[0] === 'object' ? (opps[0].opponent_id || opps[0]) : { opponent_id: opps[0] }, lang, D.opponents);
      const opp2 = opps[1] ? d.oppInfo(typeof opps[1] === 'object' ? (opps[1].opponent_id || opps[1]) : { opponent_id: opps[1] }, lang, D.opponents) : { name: 'TBD', logo: '' };
      
      teamsWrapperHtml = `<div class="triangular-hero-grid">
        <div class="match-team-col">
          <div class="match-team-logo"><img src="./immagini/logo.png?v=2" alt="Yokohama Calcio"></div>
          <div class="match-team-name">Yokohama Calcio</div>
        </div>
        <span class="tri-vs-label">VS</span>
        <div class="match-team-col">
          <div class="match-team-logo">${d.logoImg(opp1.logo, opp1.name, opp1.avatar)}</div>
          <div class="match-team-name">${esc(opp1.name)}</div>
        </div>
        <span class="tri-vs-label">VS</span>
        <div class="match-team-col">
          <div class="match-team-logo">${opp2.logo ? d.logoImg(opp2.logo, opp2.name, opp2.avatar) : '<div class="match-team-logo"></div>'}</div>
          <div class="match-team-name">${esc(opp2.name)}</div>
        </div>
      </div>`;
    } else {
      const subList = m.sub_matches || m.subMatches || [];
      let rowsHtml = '';
      if (subList.length > 0) {
        rowsHtml = subList.map(sub => {
          const oppId = sub.opponent_id || sub.opponent || m.opponent_id;
          const opp = d.oppInfo({ opponent_id: oppId }, lang, D.opponents);
          const isHomeUs = sub.home === 'us' || sub.isHome === true || sub.home_team === 'us';
          const hName = isHomeUs ? 'Yokohama Calcio' : opp.name;
          const aName = isHomeUs ? opp.name : 'Yokohama Calcio';
          const hLogo = isHomeUs ? './immagini/logo.png?v=2' : opp.logo;
          const aLogo = isHomeUs ? opp.logo : './immagini/logo.png?v=2';
          const hFb = isHomeUs ? '' : opp.avatar;
          const aFb = isHomeUs ? opp.avatar : '';
          return `<div class="triangular-match-row">
            <div class="tri-team tri-home">
              <div class="logo">${d.logoImg(hLogo, hName, hFb)}</div>
              <span class="tri-team-name">${esc(hName)}</span>
            </div>
            <div class="tri-score score-box">${esc(sub.score || '0 - 0')}</div>
            <div class="tri-team tri-away">
              <div class="logo">${d.logoImg(aLogo, aName, aFb)}</div>
              <span class="tri-team-name">${esc(aName)}</span>
            </div>
          </div>`;
        }).join('');
      } else {
        const opps = Array.isArray(m.opponents) ? m.opponents : [m.opponent_id];
        rowsHtml = opps.map(oppId => {
          const o = d.oppInfo({ opponent_id: oppId }, lang, D.opponents);
          return `<div class="triangular-match-row">
            <div class="tri-team tri-home">
              <div class="logo"><img src="./immagini/logo.png?v=2" alt="Yokohama Calcio"></div>
              <span class="tri-team-name">Yokohama Calcio</span>
            </div>
            <div class="tri-score score-box">${esc(m.score || '-')}</div>
            <div class="tri-team tri-away">
              <div class="logo">${d.logoImg(o.logo, o.name, o.avatar)}</div>
              <span class="tri-team-name">${esc(o.name)}</span>
            </div>
          </div>`;
        }).join('');
      }
      teamsWrapperHtml = `<div class="triangular-teams-wrapper">${rowsHtml}</div>`;
    }
  } else {
    const us = { name: 'Yokohama Calcio', logo: './immagini/logo.png?v=2', fb: '' }, them = { name: o.name, logo: o.logo, fb: o.avatar };
    const [L, R] = (upcoming || home) ? [us, them] : [them, us];
    const centerHtml = upcoming ? `<span class="mc-vs">VS</span>` : `<span class="score-box">${esc(sc.left)}</span>`;
    teamsWrapperHtml = `<div class="match-teams-wrapper">
      <div class="match-team-col">
        <div class="match-team-logo">${d.logoImg(L.logo, L.name, L.fb)}</div>
        <div class="match-team-name">${esc(L.name)}</div>
      </div>
      <div class="match-center-score">${centerHtml}</div>
      <div class="match-team-col">
        <div class="match-team-logo">${d.logoImg(R.logo, R.name, R.fb)}</div>
        <div class="match-team-name">${esc(R.name)}</div>
      </div>
    </div>`;
  }

  const resLabel = res ? (res === 'W' ? t('m.win') : res === 'D' ? t('m.draw') : t('m.loss')) : '';
  const meta = (upcoming && m.time ? `<span><i class="far fa-clock"></i> ${esc(m.time)} K.O.</span>` : '') + (res ? `<span class="result-dot ${res}">${resLabel}</span>` : '');
  const ics = upcoming ? `<button type="button" class="mc-btn" data-ics="${id}"><i class="far fa-calendar-plus"></i> ${t('m.ics')}</button>` : '';

  return `<article class="mc ${kind === 'next' ? 'next' : ''}" id="${id}" data-key="${esc(keyOf(m))}">
    <div class="mc-head"><div class="match-badge-group" style="display:flex;gap:6px;flex-wrap:wrap">${heads}</div><span class="mc-date">${esc(d.fmtDate(m.date, lang))}</span></div>
    ${teamsWrapperHtml}
    <div class="mc-foot"><div class="mc-meta">${meta}</div><div class="mc-actions">${ics}<button type="button" class="mc-btn" data-share="${id}" aria-label="${t('m.share')}"><i class="fas fa-share-nodes"></i></button><button type="button" class="mc-btn" data-toggle="${id}" aria-expanded="${isOpen}"><i class="fas fa-chevron-${isOpen ? 'up' : 'down'}"></i> ${isOpen ? t('m.hide') : t('m.details')}</button></div></div>
    <div class="mc-details" ${isOpen ? '' : 'hidden'}>${detailsHtml(m, !upcoming)}</div></article>`;
}

/* ---- render ---- */
function render() {
  if (!D) return;
  const ms = D.matches || [];
  const upcoming = ms.filter(m => m.status === 'upcoming' && pass(m)).sort((a, b) => keyOf(a).localeCompare(keyOf(b)));
  const past = ms.filter(m => (m.status === 'past' || m.status === 'live') && pass(m)).sort((a, b) => keyOf(b).localeCompare(keyOf(a)));

  const years = [...new Set(ms.map(m => String(m.date).slice(0, 4)))].sort().reverse();
  document.getElementById('season').innerHTML = `<option value="all" ${ui.season === 'all' ? 'selected' : ''}>${t('m.all_seasons')}</option>` + years.map(y => `<option value="${y}" ${ui.season === y ? 'selected' : ''}>${y}</option>`).join('');
  document.getElementById('catPills').innerHTML = ['all', 'league', 'cup', 'friendly'].map(c => `<button type="button" class="pill ${ui.cat === c ? 'active' : ''}" data-cat="${c}">${t('m.' + c)}</button>`).join('');

  document.getElementById('upcomingList').innerHTML = upcoming.length ? upcoming.map((m, i) => card(m, i === 0 ? 'next' : 'up')).join('') : `<p class="empty-box">${t('m.no_upcoming')}</p>`;
  const shown = past.slice(0, ui.shown);
  document.getElementById('pastList').innerHTML = shown.length ? shown.map(m => card(m, 'past')).join('') : `<p class="empty-box">${t('m.no_past')}</p>`;
  document.getElementById('counter').textContent = past.length ? t('m.counter').replace('{a}', shown.length).replace('{b}', past.length) : '';
  const btn = document.getElementById('moreBtn');
  btn.hidden = past.length <= PAGE;
  const canMore = ui.shown < past.length;
  btn.innerHTML = `<i class="fas fa-chevron-${canMore ? 'down' : 'up'}"></i> ${(canMore ? t('m.more') : t('m.less')).replace('{n}', PAGE)}`;
  btn.dataset.total = past.length;
}

/* ---- interazioni ---- */
function toast() { const el = document.getElementById('copyToast'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }
function icsFor(id) {
  const m = D.matches.find(x => x.id === id); if (!m) return;
  const lang = YC.lang(), o = YC.data.oppInfo(m, lang, D.opponents), loc = YC.data.locInfo(m.location_id, m.venue, lang, D.locations);
  const s = new Date(YC.data.ts(m.date, m.time || '11:00')), e = new Date(s.getTime() + 2 * 3600e3), f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
  const x = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Yokohama Calcio//Site//EN', 'BEGIN:VEVENT', 'UID:' + id + '@yokohamacalcio.com', 'DTSTAMP:' + f(s), 'DTSTART:' + f(s), 'DTEND:' + f(e), 'SUMMARY:' + x('Yokohama Calcio vs ' + o.name), 'LOCATION:' + x(loc.name), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' })); a.download = id + '.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-cat]'); if (c) { ui.cat = c.dataset.cat; ui.shown = PAGE; render(); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg) { const id = tg.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); render(); return; }
  const ic = e.target.closest('[data-ics]'); if (ic) { icsFor(ic.dataset.ics); return; }
  const sh = e.target.closest('[data-share]');
  if (sh) {
    const url = location.origin + location.pathname + '#' + sh.dataset.share;
    if (navigator.share) { try { await navigator.share({ title: 'Yokohama Calcio', url }); } catch (_) {} return; }
    try { await navigator.clipboard.writeText(url); toast(); } catch (_) { prompt('URL', url); }
    return;
  }
  if (e.target.closest('#moreBtn')) { const total = +document.getElementById('moreBtn').dataset.total; ui.shown = ui.shown < total ? ui.shown + PAGE : PAGE; render(); }
});
document.getElementById('season').addEventListener('change', e => { ui.season = e.target.value; ui.shown = PAGE; render(); });

/* ---- link diretto #match-9: mostra tutto, apre il dettaglio e scorre ---- */
function goToHash() {
  if (!pendingHash || !D) return;
  const m = (D.matches || []).find(x => x.id === pendingHash); pendingHash = '';
  if (!m) return;
  ui.cat = 'all'; ui.season = 'all'; ui.shown = 9999; open.add(m.id); render();
  setTimeout(() => { const el = document.getElementById(m.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); } }, 150);
}

YC.data.load(['matches', 'opponents', 'locations', 'players']).then(d => {
  D = d; D.matches = Array.isArray(d.matches) ? d.matches : [];
  const cur = YC.todayJST().slice(0, 4); ui.season = D.matches.some(m => String(m.date).startsWith(cur)) ? cur : 'all';
  ready = true; render(); goToHash();
});
document.addEventListener('yc:langchange', () => ready && render());
window.addEventListener('hashchange', () => { pendingHash = decodeURIComponent(location.hash.slice(1)); goToHash(); });
</script>
