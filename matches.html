<script>
    const style = document.createElement('style');
    style.innerHTML = `@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }`;
    document.head.appendChild(style);

    if ('scrollRestoration' in history) { history.scrollRestoration = 'auto'; }

    // Lettura iniziale lingua salvata
    let currentLang = localStorage.getItem('preferred_lang') || 'ja';
    let visiblePastMatchesCount = 3;
    let rawMatches = [];
    let playersData = [];

    const translations = {
        ja: {
            "nav.team": "チーム", "nav.about": "チーム紹介", "nav.players": "選手紹介", "nav.stats": "成績・スタッツ",
            "nav.gallery": "ギャラリー", "nav.matches": "試合日程・結果", "nav.shop": "ショップ", "nav.sponsors": "スポンサー",
            "nav.faq": "よくある質問", "nav.contact": "お問い合わせ", "matches_page.title": "試合日程・結果一覧",
            "matches_page.intro": "Yokohama Calcioの試合スケジュールと対戦情報です。", "matches_page.upcoming_title": "試合日程",
            "matches_page.past_title": "試合結果", "matches_page.season_label": "シーズン:", "matches_page.all_seasons": "全期間",
            "filter.all": "すべて", "filter.league": "リーグ戦", "filter.cup": "カップ戦", "filter.friendly": "練習試合",
            "badge.league": "公式戦", "badge.friendly": "練習試合", "badge.tournament": "大会", "badge.cup": "カップ戦",
            "badge.next": "次戦", "badge.live": "🔴 LIVE",
            "label.venue": "会場:", "label.kickoff": "キックオフ:", "label.scorers": "得点者:",
            "label.mvp": "MVP:", "label.yellow_cards": "警告:", "label.red_cards": "退場:",
            "btn.details": "詳細を見る", "btn.close_details": "詳細を閉じる", "btn.load_more_3": "さらに3試合を表示", "btn.show_less": "最初の3試合に戻す", "btn.back_home": "ホームに戻る"
        },
        it: {
            "nav.team": "Squadra", "nav.about": "Info Squadra", "nav.players": "Giocatori", "nav.stats": "Statistiche",
            "nav.gallery": "Galleria", "nav.matches": "Partite", "nav.shop": "Store", "nav.sponsors": "Sponsor",
            "nav.faq": "FAQ", "nav.contact": "Contatti", "matches_page.title": "Calendario & Risultati",
            "matches_page.intro": "Calendario delle partite e dettagli di Yokohama Calcio.", "matches_page.upcoming_title": "Prossime Partite",
            "matches_page.past_title": "Risultati Passati", "matches_page.season_label": "Stagione:", "matches_page.all_seasons": "Tutte",
            "filter.all": "Tutti", "filter.league": "Campionato", "filter.cup": "Coppa", "filter.friendly": "Amichevoli",
            "badge.league": "Campionato", "badge.friendly": "Amichevole", "badge.tournament": "Torneo", "badge.cup": "Coppa",
            "badge.next": "Prossimo Match", "badge.live": "🔴 IN DIRETTA",
            "label.venue": "Campo:", "label.kickoff": "Calcio d'inizio:", "label.scorers": "Marcatori:",
            "label.mvp": "MVP:", "label.yellow_cards": "Ammoniti:", "label.red_cards": "Espulsi:",
            "btn.details": "Mostra dettagli", "btn.close_details": "Chiudi dettagli", "btn.load_more_3": "Mostra le prossime 3 partite", "btn.show_less": "Riduci elenco", "btn.back_home": "Torna alla Home"
        },
        en: {
            "nav.team": "Team", "nav.about": "About Us", "nav.players": "Players", "nav.stats": "Statistics",
            "nav.gallery": "Gallery", "nav.matches": "Matches", "nav.shop": "Shop", "nav.sponsors": "Sponsors",
            "nav.faq": "FAQ", "nav.contact": "Contact", "matches_page.title": "Fixtures & Results",
            "matches_page.intro": "Match schedule and match information for Yokohama Calcio.", "matches_page.upcoming_title": "Upcoming Matches",
            "matches_page.past_title": "Match Results", "matches_page.season_label": "Season:", "matches_page.all_seasons": "All Time",
            "filter.all": "All", "filter.league": "League", "filter.cup": "Cup", "filter.friendly": "Friendly",
            "badge.league": "League", "badge.friendly": "Friendly", "badge.tournament": "Tournament", "badge.cup": "Cup",
            "badge.next": "Next Match", "badge.live": "🔴 LIVE",
            "label.venue": "Venue:", "label.kickoff": "Kick-Off:", "label.scorers": "Scorers:",
            "label.mvp": "MVP:", "label.yellow_cards": "Yellow Cards:", "label.red_cards": "Red Cards:",
            "btn.details": "Show details", "btn.close_details": "Close details", "btn.load_more_3": "Show next 3 matches", "btn.show_less": "Show less", "btn.back_home": "Back to Home"
        }
    };

    function cleanStr(s) {
        return String(s || '').toLowerCase().replace(/[\s\u3000]+/g, '').trim();
    }

    function containsJapaneseChars(text) {
        return /[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\uff00-\uffef\u4e00-\u9faf\u3400-\u4dbf]/.test(text);
    }

    function getAvatarUrl(name, team2Logo) {
        if (team2Logo) return team2Logo;
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'VS')}&background=random&color=ffffff&size=100&bold=true`;
    }

    // Ricerca flessibile del giocatore per nome esatto o parziale
    function findPlayerObj(query) {
        if (!query || query === 'なし' || query === 'Nessuno') return null;
        if (!playersData || playersData.length === 0) return null;

        const target = cleanStr(query);
        if (!target) return null;

        let found = playersData.find(p => {
            const k = cleanStr(p.name_kanji);
            const kn = cleanStr(p.name_kana);
            const r = cleanStr(p.name_romaji);
            return (k && k === target) || (kn && kn === target) || (r && r === target);
        });

        if (found) return found;

        return playersData.find(p => {
            const k = cleanStr(p.name_kanji);
            const kn = cleanStr(p.name_kana);
            const r = cleanStr(p.name_romaji);

            return (k && (k.includes(target) || target.includes(k))) ||
                   (kn && (kn.includes(target) || target.includes(kn))) ||
                   (r && (r.includes(target) || target.includes(r)));
        }) || null;
    }

    function getPlayerNameInLang(query, lang) {
        const player = findPlayerObj(query);
        if (!player) return query;

        if (lang === 'ja') {
            if (player.name_kanji && containsJapaneseChars(player.name_kanji)) {
                return player.name_kanji;
            }
            return player.name_kana || player.name_kanji || player.name_romaji || query;
        } else {
            return player.name_romaji || player.name_kanji || query;
        }
    }

    function translatePlayerText(text, lang) {
        if (!text || typeof text !== 'string') return text || '';
        if (text === 'なし' || text === 'Nessuno') return text;

        const items = text.split(/[,、]/);
        return items.map(item => {
            let str = item.trim();
            if (!str) return '';

            let multiplier = '';
            const multMatch = str.match(/(.*?)\s*(x\d+|\*\d+|\(\d+\))$/i);
            if (multMatch) {
                str = multMatch[1].trim();
                multiplier = ' ' + multMatch[2];
            }

            const match = str.match(/^([^(（]+)[(（]([^)）]+)[)）]$/);
            if (match) {
                const mainName = match[1].trim();
                const extraVal = match[2].trim();

                const translatedMain = getPlayerNameInLang(mainName, lang);
                const translatedExtra = isNaN(extraVal) ? getPlayerNameInLang(extraVal, lang) : extraVal;

                return `${translatedMain} (${translatedExtra})${multiplier}`;
            }

            return `${getPlayerNameInLang(str, lang)}${multiplier}`;
        }).filter(Boolean).join(', ');
    }

    function updateBtnTexts() {
        document.querySelectorAll('.match-detail-card').forEach(card => {
            const isExpanded = card.classList.contains('active');
            const mainBtnText = card.querySelector('.toggle-details-btn .btn-text');
            const mainBtnIcon = card.querySelector('.toggle-details-btn i');
            
            if (mainBtnText) {
                mainBtnText.textContent = isExpanded ? 
                    (translations[currentLang]['btn.close_details'] || 'Chiudi dettagli') : 
                    (translations[currentLang]['btn.details'] || 'Mostra dettagli');
            }
            if (mainBtnIcon) {
                mainBtnIcon.className = isExpanded ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
            }
        });
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;

        currentLang = lang;
        // SALVA LA LINGUA SELEZIONATA
        localStorage.setItem('preferred_lang', lang);

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-lang') === lang));
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                const icon = el.querySelector('i');
                if (icon) {
                    el.childNodes[el.childNodes.length - 1].textContent = " " + translations[lang][key];
                } else {
                    el.textContent = translations[lang][key];
                }
            }
        });

        if (rawMatches.length > 0) {
            renderMatches();
            filterAndPaginateMatches();
        }
    }

    function updateCounter(shown, total) {
        const counterEl = document.getElementById('matchesCounter');
        if (!counterEl) return;
        if (total === 0) {
            counterEl.style.display = 'none';
            return;
        }
        counterEl.style.display = 'block';
        let text = '';
        if (currentLang === 'ja') {
            text = `表示中: ${shown} / ${total} 試合`;
        } else if (currentLang === 'it') {
            text = `Mostrate: ${shown} di ${total} partite`;
        } else {
            text = `Showing: ${shown} of ${total} matches`;
        }
        counterEl.textContent = text;
    }

    function filterAndPaginateMatches() {
        const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
        const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';

        const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
        let visibleMatches = 0;

        pastCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);

            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);

            if (categoryMatch && seasonMatch) {
                visibleMatches++;
                if (visibleMatches <= visiblePastMatchesCount) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            } else {
                card.style.display = 'none';
            }
        });

        const shown = Math.min(visiblePastMatchesCount, visibleMatches);
        updateCounter(shown, visibleMatches);

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            if (visibleMatches > 0) {
                loadMoreBtn.style.display = 'inline-flex';
                if (visibleMatches > visiblePastMatchesCount) {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> <span>${translations[currentLang]['btn.load_more_3']}</span>`;
                } else {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-up"></i> <span>${translations[currentLang]['btn.show_less']}</span>`;
                }
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        const upcomingCards = document.querySelectorAll('#upcomingContainer .match-detail-card');
        upcomingCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);
            card.style.display = (categoryMatch && seasonMatch) ? 'block' : 'none';
        });
    }

    function renderMatches() {
        const upcomingContainer = document.getElementById('upcomingContainer');
        const pastContainer = document.getElementById('pastContainer');
        if (!upcomingContainer || !pastContainer) return;

        upcomingContainer.innerHTML = '';
        pastContainer.innerHTML = '';

        rawMatches.forEach(m => {
            const isPast = m.status === 'past';
            const cardClass = isPast ? 'match-detail-card match-past-item' : 'match-detail-card match-upcoming';
            const scoreClass = isPast ? 'match-vs-score score-past' : 'match-vs-score';
            
            const rawDate = m.date ? m.date.trim().replace(/\./g, '-').substring(0, 10) : '';

            let badgeHtml = '';
            let catKey = 'badge.friendly';
            let catClass = 'badge-friendly';

            if (m.category === 'league' || m.category === 'official') {
                catKey = 'badge.league';
                catClass = 'badge-official';
            } else if (m.category === 'cup') {
                catKey = 'badge.cup';
                catClass = 'badge-cup';
            } else if (m.category === 'tournament') {
                catKey = 'badge.tournament';
                catClass = 'badge-tournament';
            }

            const catText = translations[currentLang][catKey] || m.type || '練習試合';

            if (m.status === 'live') {
                badgeHtml = `<span class="match-badge" style="background: #ef4444; color: white; animation: pulse 1.5s infinite;" data-i18n="badge.live">🔴 LIVE</span>`;
            } else if (isPast) {
                badgeHtml = `<span class="match-badge ${catClass}">${catText}</span>`;
            } else {
                const nextText = translations[currentLang]['badge.next'] || '次戦';
                badgeHtml = `
                    <div class="match-badge-group">
                        <span class="match-badge badge-next">${nextText}</span>
                        <span class="match-badge ${catClass}">${catText}</span>
                    </div>
                `;
            }

            const oppName = m.team2Name || '-';
            const team2Logo = getAvatarUrl(oppName, m.team2Logo);

            const isHome = m.isHome !== undefined ? m.isHome : true;
            let leftTeamName, leftTeamLogo, leftTeamLogoClass, rightTeamName, rightTeamLogo, rightTeamLogoClass, displayScore;

            if (isHome) {
                leftTeamName = m.team1Name || 'Yokohama Calcio';
                leftTeamLogo = './immagini/logo.png';
                leftTeamLogoClass = '';
                rightTeamName = m.team2Name || '-';
                rightTeamLogo = team2Logo;
                rightTeamLogoClass = 'opponent-logo';
                displayScore = m.score;
            } else {
                leftTeamName = m.team2Name || '-';
                leftTeamLogo = team2Logo;
                leftTeamLogoClass = 'opponent-logo';
                rightTeamName = m.team1Name || 'Yokohama Calcio';
                rightTeamLogo = './immagini/logo.png';
                rightTeamLogoClass = '';
                if (m.score && m.score !== 'VS' && m.score.includes('-')) {
                    const parts = m.score.split('-');
                    displayScore = parts.length === 2 ? `${parts[1].trim()} - ${parts[0].trim()}` : m.score;
                } else {
                    displayScore = m.score;
                }
            }

            const displayDateTime = m.time ? `${m.date} ${m.time}` : m.date;

            const scorersTranslated = translatePlayerText(m.scorers, currentLang);
            const mvpTranslated = translatePlayerText(m.mvp, currentLang);
            const yellowCardsTranslated = translatePlayerText(m.yellow_cards, currentLang);
            const redCardsTranslated = translatePlayerText(m.red_cards, currentLang);

            let detailsHtml = `<div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span><strong data-i18n="label.venue">会場:</strong> ${m.venue || '-'}</span></div>`;
            if (m.time) {
                detailsHtml += `<div class="detail-item"><i class="fas fa-clock"></i> <span><strong data-i18n="label.kickoff">キックオフ:</strong> ${m.time}</span></div>`;
            }
            if (scorersTranslated && scorersTranslated !== 'なし' && scorersTranslated !== 'Nessuno') {
                detailsHtml += `<div class="detail-item"><i class="fas fa-futbol"></i> <span><strong data-i18n="label.scorers">得点者:</strong> ${scorersTranslated}</span></div>`;
            }
            if (mvpTranslated && mvpTranslated !== 'なし' && mvpTranslated !== 'Nessuno') {
                detailsHtml += `<div class="detail-item"><i class="fas fa-star" style="color: #f59e0b;"></i> <span><strong data-i18n="label.mvp">MVP:</strong> ${mvpTranslated}</span></div>`;
            }
            if (yellowCardsTranslated && yellowCardsTranslated !== 'なし' && yellowCardsTranslated !== 'Nessuno') {
                detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #eab308;"></i> <span><strong data-i18n="label.yellow_cards">警告:</strong> ${yellowCardsTranslated}</span></div>`;
            }
            if (redCardsTranslated && redCardsTranslated !== 'なし' && redCardsTranslated !== 'Nessuno') {
                detailsHtml += `<div class="detail-item"><i class="fas fa-square" style="color: #ef4444;"></i> <span><strong data-i18n="label.red_cards">退場:</strong> ${redCardsTranslated}</span></div>`;
            }

            const cardHtml = `
                <div class="${cardClass}" id="${m.id}" data-match-category="${m.category}" data-match-date="${rawDate}">
                    <div class="match-header-row">
                        ${badgeHtml}
                        <span class="match-date-text"><i class="far fa-calendar-alt"></i> ${displayDateTime}</span>
                    </div>
                    <div class="match-teams-row">
                        <div class="match-team">
                            <img src="${leftTeamLogo}" alt="${leftTeamName}" class="${leftTeamLogoClass}">
                            <span>${leftTeamName}</span>
                        </div>
                        <div class="${scoreClass}">${displayScore}</div>
                        <div class="match-team">
                            <img src="${rightTeamLogo}" alt="${rightTeamName}" class="${rightTeamLogoClass}">
                            <span>${rightTeamName}</span>
                        </div>
                    </div>
                    <button class="toggle-details-btn"><i class="fas fa-chevron-down"></i> <span class="btn-text" data-i18n="btn.details">詳細を見る</span></button>
                    <div class="match-expand-details" style="display: none;">
                        <div class="details-inner">
                            ${detailsHtml}
                        </div>
                    </div>
                </div>
            `;

            if (isPast) {
                pastContainer.insertAdjacentHTML('beforeend', cardHtml);
            } else {
                upcomingContainer.insertAdjacentHTML('beforeend', cardHtml);
            }
        });

        populateSeasonSelect(rawMatches);

        document.querySelectorAll('.match-detail-card').forEach(card => {
            const toggleBtn = card.querySelector('.toggle-details-btn');
            const details = card.querySelector('.match-expand-details');

            if (toggleBtn) {
                toggleBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const wasActive = card.classList.contains('active');

                    document.querySelectorAll('.match-detail-card').forEach(c => {
                        c.classList.remove('active');
                        const det = c.querySelector('.match-expand-details');
                        if (det) det.style.display = 'none';
                    });

                    if (!wasActive) {
                        card.classList.add('active');
                        if (details) details.style.display = 'block';
                    }
                    updateBtnTexts();
                };
            }
        });

        updateBtnTexts();
    }

    function populateSeasonSelect(matches) {
        const select = document.getElementById('matchSeasonSelect');
        if (!select) return;

        const currentSelected = select.value;
        const yearsSet = new Set();
        matches.forEach(m => {
            if (m.date) {
                const y = m.date.substring(0, 4);
                if (y && !isNaN(y)) yearsSet.add(y);
            }
        });

        let years = Array.from(yearsSet).sort((a, b) => b - a);
        select.innerHTML = '';

        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = translations[currentLang]['matches_page.all_seasons'] || '全期間';
        select.appendChild(allOption);

        years.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = `${year}年`;
            select.appendChild(option);
        });

        if (currentSelected && (years.includes(currentSelected) || currentSelected === 'all')) {
            select.value = currentSelected;
        } else {
            select.value = 'all';
        }
    }

    function handleHashOnLoad() {
        const hash = window.location.hash;
        if (!hash) return;

        const previousCount = visiblePastMatchesCount;
        visiblePastMatchesCount = 1000;
        filterAndPaginateMatches();

        const targetCard = document.querySelector(hash);
        if (targetCard) {
            setTimeout(() => {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('active');
                const details = targetCard.querySelector('.match-expand-details');
                if (details) details.style.display = 'block';

                visiblePastMatchesCount = previousCount;
                filterAndPaginateMatches();
                targetCard.style.display = 'block';
                updateBtnTexts();
            }, 100);
        } else {
            visiblePastMatchesCount = previousCount;
            filterAndPaginateMatches();
        }
    }

    async function loadAllData() {
        try {
            const response = await fetch('matches.json');
            if (!response.ok) throw new Error("matches.json non trovato");
            rawMatches = await response.json();

            try {
                const pResp = await fetch('players.json');
                if (pResp.ok) {
                    playersData = await pResp.json();
                }
            } catch (e) {
                console.warn("players.json non trovato.");
                playersData = [];
            }

            // APPLICA LINGUA PRIMA DEL RENDER E DELLA PAGINAZIONE
            setLanguage(currentLang);
            handleHashOnLoad();
        } catch (error) {
            console.error("Errore nel caricamento dati:", error);
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const currentYearEl = document.getElementById('currentYear');
        if (currentYearEl) currentYearEl.textContent = new Date().getFullYear();

        await loadAllData();

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
        });

        document.querySelectorAll('[data-match-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-match-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        });

        const seasonSelect = document.getElementById('matchSeasonSelect');
        if (seasonSelect) {
            seasonSelect.addEventListener('change', () => {
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        }

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
                const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';
                const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
                let totalPast = 0;
                pastCards.forEach(card => {
                    const category = card.getAttribute('data-match-category');
                    const date = card.getAttribute('data-match-date') || '';
                    const matchYear = date.substring(0, 4);
                    if ((activeCategory === 'all' || category === activeCategory) && (activeSeason === 'all' || matchYear === activeSeason)) {
                        totalPast++;
                    }
                });

                if (visiblePastMatchesCount < totalPast) {
                    visiblePastMatchesCount += 3;
                } else {
                    visiblePastMatchesCount = 3;
                }
                filterAndPaginateMatches();
            });
        }

        const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
        const mobileNav = document.querySelector('.mobile-nav');
        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', () => mobileNav.classList.toggle('hidden'));
        }

        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
if (scrollToTopBtn) {
    const checkScroll = () => {
        if (window.scrollY > 300) {
            scrollToTopBtn.classList.add('show');
        } else {
            scrollToTopBtn.classList.remove('show');
        }
    };
    window.addEventListener('scroll', checkScroll);
    window.addEventListener('load', checkScroll);
    scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}
    });
</script>
</body>
</html>
