<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合日程・結果 | Yokohama Calcio</title>
    <meta name="description" content="Yokohama Calcioの試合日程および過去の対戦結果一覧です。">
    <link rel="icon" href="./immagini/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<!-- (Header invariato) -->

<section class="section matches-page-section">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-trophy"></i> <span data-i18n="matches_page.title">試合日程・結果一覧</span></h2>
        
        <div class="matches-list-wrapper">
            <!-- CALENDARIO -->
            <div class="matches-section-block">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-calendar-check" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.upcoming_title">試合日程</span>
                </h3>
                <div id="upcomingContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>

            <!-- RISULTATI -->
            <div class="matches-section-block" style="margin-top: 50px;">
                <h3 class="ranking-title" style="margin-bottom: 20px;">
                    <i class="fas fa-history" style="color: var(--primary-sky);"></i> <span data-i18n="matches_page.past_title">試合結果</span>
                </h3>
                <div id="pastContainer" style="display: flex; flex-direction: column; gap: 20px;"></div>
            </div>
        </div>
    </div>
</section>

<script>
    async function loadMatches() {
        const response = await fetch('matches.json');
        const matches = await response.json();
        const upcomingContainer = document.getElementById('upcomingContainer');
        const pastContainer = document.getElementById('pastContainer');

        matches.forEach(m => {
            const isPast = m.status === 'past';
            const badgeClass = isPast ? 'badge-friendly' : 'badge-next';
            const badgeText = isPast ? '練習試合' : m.type;
            const liveBadge = m.status === 'live' ? '<span class="match-badge" style="background:#ef4444; color:white; animation: pulse 1.5s infinite;">🔴 LIVE</span>' : `<span class="match-badge ${badgeClass}">${badgeText}</span>`;
            
            const cardHtml = `
                <div class="match-detail-card ${isPast ? 'match-past-item' : 'match-upcoming'}">
                    <div class="match-header-row">
                        ${liveBadge}
                        <span class="match-date-text"><i class="far fa-calendar-alt"></i> ${m.date}</span>
                    </div>
                    <div class="match-teams-row">
                        <div class="match-team"><img src="./immagini/logo.png"><span>${m.team1Name}</span></div>
                        <div class="match-vs-score ${isPast ? 'score-past' : ''}">${m.score}</div>
                        <div class="match-team"><img src="${m.team2Logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.team2Name)}&background=random&color=ffffff&size=100&bold=true`}" class="opponent-logo"><span>${m.team2Name}</span></div>
                    </div>
                    <button class="toggle-details-btn"><i class="fas fa-info-circle"></i> <span>詳細を見る</span></button>
                    <div class="match-expand-details" style="display:none;">
                        <div class="details-inner">
                            <div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span><strong>会場:</strong> ${m.venue}</span></div>
                            ${m.scorers ? `<div class="detail-item"><i class="fas fa-futbol"></i> <span><strong>得点者:</strong> ${m.scorers}</span></div>` : ''}
                        </div>
                    </div>
                </div>
            `;
            (isPast ? pastContainer : upcomingContainer).insertAdjacentHTML('beforeend', cardHtml);
        });

        // Riattiva la logica di apertura/chiusura dettagli
        document.querySelectorAll('.toggle-details-btn').forEach(btn => {
            btn.onclick = () => {
                const details = btn.nextElementSibling;
                details.style.display = details.style.display === 'none' ? 'block' : 'none';
            };
        });
    }
    window.addEventListener('DOMContentLoaded', loadMatches);
</script>
</body>
</html>
