    let currentLang = localStorage.getItem('preferred_lang') || 'ja';
    let cachedMatches = [];
    let locationsData = {};
    let opponentsData = {};

    function getUniqueTeamColor(idOrName) {
        let hash = 0;
        const str = String(idOrName || 'opponent').toLowerCase();
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash) % 360;
        const saturation = 70 + (Math.abs(hash >> 3) % 20);
        const lightness = 35 + (Math.abs(hash >> 5) % 15);
        
        const l = lightness / 100;
        const a = saturation * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + hue / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `${f(0)}${f(8)}${f(4)}`;
    }

    function getRomajiName(match, defaultName) {
        if (match && match.opponent_id && opponentsData[match.opponent_id]) {
            const opp = opponentsData[match.opponent_id];
            if (opp.name) {
                const romaji = opp.name['en'] || opp.name['it'];
                if (romaji) return romaji;
            }
        }

        const rawName = defaultName || '';
        if (commonRomajiMap[rawName]) {
            return commonRomajiMap[rawName];
        }

        const cleanLatin = String(rawName).replace(/[^\x00-\x7F]/g, '').trim();
        if (cleanLatin.length > 0) return cleanLatin;

        return rawName || 'Opponent';
    }

    function getAvatarUrl(matchOrName, romajiFallback) {
        const identifier = (typeof matchOrName === 'object' && matchOrName !== null) 
            ? (matchOrName.opponent_id || matchOrName.team2Name || 'opponent') 
            : String(matchOrName || 'opponent');
            
        const romaji = (typeof matchOrName === 'object' && matchOrName !== null) 
            ? getRomajiName(matchOrName, matchOrName.team2Name) 
            : (romajiFallback || identifier);
        
        const bgHex = getUniqueTeamColor(identifier);
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(romaji)}&background=${bgHex}&color=ffffff&bold=true&size=128`;
    }

    function getOpponentInfo(match, lang) {
        let name = '';
        let logo = '';

        if (match.opponent_id && opponentsData[match.opponent_id]) {
            const opp = opponentsData[match.opponent_id];
            name = (opp.name && (opp.name[lang] || opp.name['ja'])) || match.team2Name || 'Opponent';
            logo = opp.logo || match.team2Logo || '';
        } else {
            name = match.team2Name || 'Opponent';
            logo = match.team2Logo || '';
        }

        const romajiName = getRomajiName(match, name);

        if (!logo || logo.trim() === '') {
            logo = getAvatarUrl(match, romajiName);
        }

        return { name, romajiName, logo };
    }

    function parseMatchDate(dateStr) {
        if (!dateStr) return 0;
        const clean = dateStr.replace(/\./g, '/').replace(/-/g, '/');
        const match = clean.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
        if (match) {
            return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])).getTime();
        }
        return 0;
    }

    function formatDateWithDay(dateStr, lang) {
        if (!dateStr) return '';
        if (dateStr.includes('(')) return dateStr; 

        const dateObj = new Date(dateStr);
        if (isNaN(dateObj)) return dateStr;

        const localeMap = { ja: 'ja-JP', it: 'it-IT', en: 'en-US' };
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
        return new Intl.DateTimeFormat(localeMap[lang] || 'ja-JP', options).format(dateObj);
    }

    function getLocationInfo(locId, venueFallback, lang) {
        const loc = locationsData[locId];
        if (!loc) {
            const fallbackName = venueFallback || locId || '-';
            return { name: fallbackName, url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fallbackName)}`, surface: '' };
        }

        const name = loc[lang] || loc['ja'] || venueFallback || locId;
        const surface = loc.surface ? (loc.surface[lang] || loc.surface['ja'] || '') : '';
        let url = loc.url || loc.maps;
        if (!url) {
            url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
        }
        return { name, url, surface };
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (translations[lang][key]) {
                elem.innerHTML = translations[lang][key];
            }
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        if (cachedMatches.length > 0) {
            renderMatches(cachedMatches);
        }
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
        });
    });

    function renderMatches(matches) {
        const container = document.getElementById('matchesContainer');
        if (!container) return;

        const activeFilterBtn = document.querySelector('[data-match-filter].active');
        const currentFilter = activeFilterBtn ? activeFilterBtn.getAttribute('data-match-filter') : 'all';

        let filtered = [...matches];
        if (currentFilter === 'upcoming') {
            filtered = filtered.filter(m => m.status === 'upcoming');
        } else if (currentFilter === 'past') {
            filtered = filtered.filter(m => m.status === 'past' || m.status === 'live');
        }

        filtered.sort((a, b) => {
            if (a.status === 'upcoming' && b.status !== 'upcoming') return -1;
            if (a.status !== 'upcoming' && b.status === 'upcoming') return 1;
            return parseMatchDate(b.date) - parseMatchDate(a.date);
        });

        if (filtered.length === 0) {
            const emptyKey = `empty.${currentFilter}`;
            container.innerHTML = `
                <div class="empty-matches">
                    <i class="far fa-calendar-times"></i>
                    <p data-i18n="${emptyKey}">${translations[currentLang][emptyKey] || 'Nessuna partita trovata.'}</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(m => createMatchCardHTML(m)).join('');

        const hash = window.location.hash.replace('#', '');
        if (hash) {
            const targetCard = document.getElementById(hash);
            if (targetCard) {
                targetCard.classList.add('highlighted');
                setTimeout(() => {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            }
        }
    }

    function createMatchCardHTML(m) {
        const lang = currentLang;
        const oppInfo = getOpponentInfo(m, lang);
        const locInfo = getLocationInfo(m.location_id, m.venue, lang);
        const formattedDate = formatDateWithDay(m.date, lang);

        const isHome = m.isHome !== undefined ? m.isHome : true;
        let leftTeamName, leftTeamLogo, leftTeamClass, rightTeamName, rightTeamLogo, rightTeamClass;
        let leftErr = "", rightErr = "";

        const fallbackAvatar = getAvatarUrl(m, oppInfo.romajiName);

        if (isHome) {
            leftTeamName = m.team1Name || 'Yokohama Calcio';
            leftTeamLogo = './immagini/logo.png';
            leftTeamClass = 'yokohama-logo';
            rightTeamName = oppInfo.name;
            rightTeamLogo = oppInfo.logo;
            rightTeamClass = 'opponent-logo';
            rightErr = `onerror="this.onerror=null;this.src='${fallbackAvatar}';"`;
        } else {
            leftTeamName = oppInfo.name;
            leftTeamLogo = oppInfo.logo;
            leftTeamClass = 'opponent-logo';
            leftErr = `onerror="this.onerror=null;this.src='${fallbackAvatar}';"`;
            rightTeamName = m.team1Name || 'Yokohama Calcio';
            rightTeamLogo = './immagini/logo.png';
            rightTeamClass = 'yokohama-logo';
        }

        let categoryKey = 'badge.friendly';
        let categoryClass = 'badge-friendly';
        if (m.category === 'league' || m.category === 'official') {
            categoryKey = 'badge.league';
            categoryClass = 'badge-official';
        } else if (m.category === 'cup') {
            categoryKey = 'badge.cup';
            categoryClass = 'badge-cup';
        } else if (m.category === 'tournament') {
            categoryKey = 'badge.tournament';
            categoryClass = 'badge-tournament';
        }

        let scoreDisplay = m.score || 'VS';
        if (m.status === 'past' && !isHome && scoreDisplay.includes('-')) {
            const parts = scoreDisplay.split('-');
            if (parts.length === 2) {
                scoreDisplay = `${parts[1].trim()} - ${parts[0].trim()}`;
            }
        }

        let hasDetails = (m.scorers || m.assists || m.mvp || m.yellow_cards || m.red_cards || m.goalkeepers);
        let detailsAccordionHTML = '';

        if (m.status === 'past' && hasDetails) {
            detailsAccordionHTML = `
                <div class="match-details-accordion">
                    <details>
                        <summary class="details-summary">
                            <span><i class="fas fa-clipboard-list" style="color: var(--primary-sky);"></i> <span data-i18n="btn.details_toggle">詳細・出場メンバー</span></span>
                            <i class="fas fa-chevron-down"></i>
                        </summary>
                        <div class="details-content">
                            ${m.scorers ? `<div class="detail-block"><strong><i class="fas fa-futbol"></i> <span data-i18n="label.scorers">得点者:</span></strong> <span>${m.scorers}</span></div>` : ''}
                            ${m.assists ? `<div class="detail-block"><strong><i class="fas fa-shoe-prints"></i> <span data-i18n="label.assists">アシスト:</span></strong> <span>${m.assists}</span></div>` : ''}
                            ${m.mvp ? `<div class="detail-block"><strong><i class="fas fa-star" style="color: #f59e0b;"></i> <span data-i18n="label.mvp">MVP:</span></strong> <span>${m.mvp}</span></div>` : ''}
                            ${m.goalkeepers ? `<div class="detail-block"><strong><i class="fas fa-hands"></i> <span data-i18n="label.gk">GK:</span></strong> <span>${m.goalkeepers}</span></div>` : ''}
                            ${m.yellow_cards ? `<div class="detail-block"><strong><i class="fas fa-square" style="color: #f59e0b;"></i> <span data-i18n="label.yellows">警告:</span></strong> <span>${m.yellow_cards}</span></div>` : ''}
                            ${m.red_cards ? `<div class="detail-block"><strong><i class="fas fa-square" style="color: #ef4444;"></i> <span data-i18n="label.reds">退場:</span></strong> <span>${m.red_cards}</span></div>` : ''}
                        </div>
                    </details>
                </div>
            `;
        }

        return `
            <div class="match-card-full" id="${m.id || ''}">
                <div class="match-card-header">
                    <div class="match-badge-group">
                        <span class="match-badge ${categoryClass}" data-i18n="${categoryKey}">${translations[lang][categoryKey]}</span>
                        ${m.status === 'upcoming' ? `<span class="match-badge badge-next">NEXT</span>` : ''}
                    </div>
                    <div class="match-card-date"><i class="far fa-calendar-alt"></i> ${formattedDate}</div>
                </div>

                <div class="match-teams-wrapper">
                    <div class="teams-logos-row">
                        <div class="card-logo-wrap"><img src="${leftTeamLogo}" alt="${leftTeamName}" class="${leftTeamClass}" ${leftErr}></div>
                        <div class="match-vs-center">${scoreDisplay}</div>
                        <div class="card-logo-wrap"><img src="${rightTeamLogo}" alt="${rightTeamName}" class="${rightTeamClass}" ${rightErr}></div>
                    </div>
                    <div class="teams-names-row">
                        <div class="team-name-col" title="${leftTeamName}">${leftTeamName}</div>
                        <div></div>
                        <div class="team-name-col" title="${rightTeamName}">${rightTeamName}</div>
                    </div>
                </div>

                <div class="match-info-grid">
                    ${m.time ? `<div class="match-info-item"><i class="fas fa-clock"></i> <strong data-i18n="label.time">時間:</strong> <span>${m.time} K.O.</span></div>` : ''}
                    <div class="match-info-item">
                        <i class="fas fa-map-marker-alt"></i> 
                        <strong data-i18n="label.venue">会場:</strong> 
                        <a href="${locInfo.url}" target="_blank" rel="noopener noreferrer">${locInfo.name} <i class="fas fa-external-link-alt" style="font-size: 0.7rem; opacity: 0.7;"></i></a>
                    </div>
                    ${locInfo.surface ? `<div class="match-info-item"><i class="fas fa-layer-group"></i> <strong data-i18n="label.surface">ピッチ:</strong> <span>${locInfo.surface}</span></div>` : ''}
                </div>

                ${detailsAccordionHTML}
            </div>
        `;
    }

    async function initMatchesPage() {
        try {
            const [mResp, lResp, oResp] = await Promise.allSettled([
                fetch('matches.json'),
                fetch('locations.json'),
                fetch('opponents.json')
            ]);

            if (mResp.status === 'fulfilled' && mResp.value.ok) cachedMatches = await mResp.value.ok ? await mResp.value.json() : [];
            if (lResp.status === 'fulfilled' && lResp.value.ok) locationsData = await lResp.value.ok ? await lResp.value.json() : {};
            if (oResp.status === 'fulfilled' && oResp.value.ok) opponentsData = await oResp.value.ok ? await oResp.value.json() : {};

            renderMatches(cachedMatches);
        } catch (e) {
            console.error("Errore nel caricamento dei dati delle partite:", e);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        initMatchesPage();
    });

    /* LOGICA GESTIONE MENU MOBILE MODALE */
    const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const mobileDropdownToggle = document.querySelector('.mobile-dropdown-toggle');
    const mobileSubmenu = document.querySelector('.mobile-submenu');
    const mobileCloseBtn = document.querySelector('.mobile-nav-close');

    function closeMobileMenu() {
        if (mobileNav) {
            mobileNav.classList.add('hidden');
            if (mobileMenuBtn) {
                const icon = mobileMenuBtn.querySelector('i');
                if (icon) {
                    icon.classList.add('fa-bars');
                    icon.classList.remove('fa-times');
                }
            }
        }
    }

    if (mobileMenuBtn && mobileNav) {
        mobileMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = mobileNav.classList.contains('hidden');
            if (isHidden) {
                mobileNav.classList.remove('hidden');
                const icon = mobileMenuBtn.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                }
            } else {
                closeMobileMenu();
            }
        });

        if (mobileDropdownToggle && mobileSubmenu) {
            mobileDropdownToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                mobileSubmenu.classList.toggle('hidden');
                const arrow = mobileDropdownToggle.querySelector('.mobile-arrow');
                if (arrow) {
                    arrow.classList.toggle('fa-chevron-down');
                    arrow.classList.toggle('fa-chevron-up');
                }
            });
        }

        document.querySelectorAll('.mobile-link, .mobile-cta-btn').forEach(link => {
            link.addEventListener('click', closeMobileMenu);
        });

        if (mobileCloseBtn) {
            mobileCloseBtn.addEventListener('click', closeMobileMenu);
        }

        mobileNav.addEventListener('click', (e) => {
            if (!e.target.closest('.mobile-nav-content') && !mobileMenuBtn.contains(e.target)) {
                closeMobileMenu();
            }
        });
    }

    const filterBtns = document.querySelectorAll('[data-match-filter]');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches(cachedMatches);
        });
    });

    const topBtn = document.getElementById('scrollToTopBtn');
    if (topBtn) {
        const checkScroll = () => {
            if (window.scrollY > 300) {
                topBtn.classList.add('show');
            } else {
                topBtn.classList.remove('show');
            }
        };
        window.addEventListener('scroll', checkScroll);
        window.addEventListener('load', checkScroll);
        topBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    const yearSpan = document.getElementById('currentYear');
    if (yearSpan) yearSpan.textContent = new Date().getFullYear();
</script>
</body>
</html>
