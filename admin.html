<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yokohama Calcio | Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f1f5f9; margin: 0; padding: 15px; }
        .admin-container { max-width: 950px; margin: 10px auto; padding: 25px; background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .admin-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; }
        h2, h3 { color: #003c82; margin: 0; }
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 18px; border-radius: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #003c82; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        @media (max-width: 600px) { .row { flex-direction: column; gap: 0; } }

        /* SCHERMATA LOGIN */
        .login-box { max-width: 450px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 6px 25px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; text-align: center; }
        .login-box i.lock-icon { font-size: 3rem; color: #003c82; margin-bottom: 15px; }
        
        .player-select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
        .player-card { background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-size: 0.85rem; }
        .player-card-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px; color: #003c82; }
        
        .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; background: #f1f5f9; padding: 6px; border-radius: 6px; }
        .role-selector label { font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; color: #334155; }
        .role-selector input[type="radio"] { cursor: pointer; }
        
        .btn-submit { background: #003c82; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.05rem; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-logout { background: #ef4444; color: white; padding: 6px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        
        .lang-switcher-admin { display: flex; gap: 6px; align-items: center; }
        .lang-btn-admin { background: transparent; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; cursor: pointer; color: #475569; }
        .lang-btn-admin.active { background: #003c82; color: white; border-color: #003c82; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- SCHERMATA LOGIN (MOSTRATA DI DEFAULT) -->
<div id="loginSection" class="login-box">
    <i class="fas fa-lock lock-icon"></i>
    <h2 style="margin-bottom: 10px;" data-i18n="login.title">Yokohama Calcio Admin</h2>
    <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 20px;" data-i18n="login.subtitle">Inserisci il GitHub Personal Access Token per sbloccare il pannello.</p>

    <div class="lang-switcher-admin" style="justify-content: center; margin-bottom: 20px;">
        <button class="lang-btn-admin active" data-lang="ja">JP</button>
        <button class="lang-btn-admin" data-lang="it">IT</button>
        <button class="lang-btn-admin" data-lang="en">EN</button>
    </div>

    <form id="loginForm">
        <div class="form-group" style="text-align: left;">
            <label for="inputToken"><i class="fas fa-key"></i> GitHub Token (PAT):</label>
            <input type="password" id="inputToken" class="form-control" placeholder="ghp_... o github_pat_..." required>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn" data-i18n="login.btn">Accedi</button>
    </form>
    <div id="loginError" style="color: #dc2626; font-size: 0.85rem; margin-top: 15px; font-weight: bold;"></div>
</div>

<!-- DASHBOARD ADMIN (NASCOSTA FINO ALL'AUTENTICAZIONE) -->
<div id="adminDashboard" class="admin-container hidden">
    <div class="admin-header-bar">
        <div>
            <h2><i class="fas fa-shield-alt"></i> Yokohama Calcio Admin</h2>
            <span style="font-size: 0.78rem; color: #059669; font-weight: bold;"><i class="fas fa-check-circle"></i> Authenticated</span>
        </div>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="lang-switcher-admin">
                <button class="lang-btn-admin active" data-lang="ja">JP</button>
                <button class="lang-btn-admin" data-lang="it">IT</button>
                <button class="lang-btn-admin" data-lang="en">EN</button>
            </div>
            <button id="logoutBtn" class="btn-logout" data-i18n="admin.logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <form id="matchForm">
        <input type="hidden" id="repoPath" value="yokohamacalcio/yokohamacalcio">

        <!-- 1. INFO MATCH -->
        <div class="section-box">
            <h3 data-i18n="sec1.title">1. Informazioni Partita</h3>
            <div class="row" style="margin-top: 10px;">
                <div class="form-group">
                    <label data-i18n="sec1.match_id">ID Match (es. match-9):</label>
                    <input type="text" id="matchId" class="form-control" placeholder="match-9" required>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.status">Stato Partita:</label>
                    <select id="matchStatus" class="form-control">
                        <option value="past" data-i18n="sec1.status_past">Finita (past)</option>
                        <option value="upcoming" data-i18n="sec1.status_upcoming">In programma (upcoming)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.date">Data:</label>
                    <input type="date" id="matchDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.time">Orario Calcio d'Inizio (K.O.):</label>
                    <input type="time" id="matchTime" class="form-control" value="11:00">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.category">Categoria:</label>
                    <select id="matchCategory" class="form-control">
                        <option value="friendly" data-i18n="sec1.cat_friendly">Amichevole (friendly)</option>
                        <option value="official" data-i18n="sec1.cat_official">Campionato (official)</option>
                        <option value="cup" data-i18n="sec1.cat_cup">Coppa (cup)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.type">Tipo (Etichetta visualizzata):</label>
                    <input type="text" id="matchType" class="form-control" value="練習試合">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.opponent">Avversario (ID da opponents.json):</label>
                    <input type="text" id="opponentId" class="form-control" list="opponentsList" placeholder="es. fc_legend" required>
                    <datalist id="opponentsList"></datalist>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.location">Campo (ID da locations.json):</label>
                    <input type="text" id="locationId" class="form-control" list="locationsList" placeholder="es. tokiwa" required>
                    <datalist id="locationsList"></datalist>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.venue_type">Casa / Trasferta:</label>
                    <select id="isHome" class="form-control">
                        <option value="true" data-i18n="sec1.home">Casa (Yokohama Calcio vs Avversario)</option>
                        <option value="false" data-i18n="sec1.away">Trasferta (Avversario vs Yokohama Calcio)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.score">Risultato (es. 2 - 1 oppure VS):</label>
                    <input type="text" id="matchScore" class="form-control" placeholder="2 - 1" value="VS">
                </div>
            </div>
        </div>

        <!-- 2. EVENTI & PRESTAZIONI -->
        <div class="section-box">
            <h3 data-i18n="sec2.title">2. Eventi & Prestazioni</h3>
            <div class="row" style="margin-top: 10px;">
                <div class="form-group">
                    <label data-i18n="sec2.scorers">Marcatori (es. 小金井 x2, 根本):</label>
                    <input type="text" id="matchScorers" class="form-control" placeholder="小金井 x2">
                </div>
                <div class="form-group">
                    <label data-i18n="sec2.assists">Assistman (es. 道下, 福田):</label>
                    <input type="text" id="matchAssists" class="form-control" placeholder="道下, 福田">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec2.mvp">MVP del Match:</label>
                    <input type="text" id="matchMvp" class="form-control" placeholder="小金井">
                </div>
                <div class="form-group">
                    <label data-i18n="sec2.goalkeepers">Portiere Titolare & Gol Subiti (es. 御村 葵(5)):</label>
                    <input type="text" id="goalkeepers" class="form-control" placeholder="御村 葵(5)">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec2.yellow">Cartellini Gialli:</label>
                    <input type="text" id="yellowCards" class="form-control" placeholder="">
                </div>
                <div class="form-group">
                    <label data-i18n="sec2.red">Cartellini Rossi:</label>
                    <input type="text" id="redCards" class="form-control" placeholder="">
                </div>
            </div>
        </div>

        <!-- 3. FORMAZIONE & CAMBI -->
        <div class="section-box">
            <h3 data-i18n="sec3.title">3. Assetto Tattico & Convocati</h3>
            <div class="row" style="margin-bottom: 12px; margin-top: 10px;">
                <div class="form-group">
                    <label data-i18n="sec3.formation">Modulo (es. 4-4-2):</label>
                    <input type="text" id="formation" class="form-control" value="4-4-2">
                </div>
            </div>
            <p style="font-size: 0.82rem; color: #64748b; margin-bottom: 10px;" data-i18n="sec3.subtitle">
                Seleziona lo stato di ogni giocatore per la partita:
            </p>
            <div class="player-select-grid" id="playersGrid">
                <div style="color: #64748b;">Caricamento rosa...</div>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" data-i18n="admin.save_btn">
            <i class="fas fa-cloud-upload-alt"></i> Salva Partita su matches.json
        </button>
    </form>

    <div id="statusMsg" style="margin-top: 18px; font-weight: bold; text-align: center;"></div>
</div>

<script>
    // --- TRADUZIONI MULTILINGUE ADMIN ---
    const adminTranslations = {
        ja: {
            "login.title": "Yokohama Calcio 管理パネル",
            "login.subtitle": "GitHub Personal Access Tokenを入力してログインしてください。",
            "login.btn": "ログイン",
            "admin.logout": "ログアウト",
            "sec1.title": "1. 試合情報",
            "sec1.match_id": "試合ID (例: match-9):",
            "sec1.status": "試合ステータス:",
            "sec1.status_past": "終了 (past)",
            "sec1.status_upcoming": "予定 (upcoming)",
            "sec1.date": "日付:",

            "sec1.category": "カテゴリー:",
            "sec1.cat_friendly": "練習試合 (friendly)",
            "sec1.cat_official": "公式戦 (official)",
            "sec1.cat_cup": "カップ戦 (cup)",
            "sec1.type": "表示タイプ名:",

            "sec1.away": "アウェイ (対戦相手 vs Yokohama Calcio)",
            "sec1.score": "スコア (例: 2 - 1 または VS):",

            "sec2.scorers": "得点者 (例: 小金井 x2, 根本):",
            "sec2.assists": "アシスト (例: 道下, 福田):",
            "sec2.mvp": "MOM / MVP:",
            "sec2.goalkeepers": "GK・失点数 (例: 御村 葵(5)):",
            "sec2.yellow": "警告 (イエローカード):",
            "sec2.red": "退場 (レッドカード):",
            "sec3.title": "3. 陣形・メンバー選出",
            "sec3.formation": "フォーメーション (例: 4-4-2):",
            "sec3.subtitle": "各選手の試合ステータスを選択してください:",
            "role.absent": "欠席",
            "role.starter": "先発",
            "role.sub_in": "途中出場",
            "role.sub_unused": "ベンチ (出場なし)",
            "admin.save_btn": "試合データを保存して更新"
        },
        it: {
            "login.title": "Pannello Admin Yokohama Calcio",
            "login.subtitle": "Inserisci il GitHub Personal Access Token per sbloccare il pannello.",
            "login.btn": "Accedi",
            "admin.logout": "Logout",
            "sec1.title": "1. Informazioni Partita",
            "sec1.match_id": "ID Match (es. match-9):",
            "sec1.status": "Stato Partita:",
            "sec1.status_past": "Finita (past)",
            "sec1.status_upcoming": "In programma (upcoming)",
            "sec1.date": "Data:",
            "sec1.time": "Orario Calcio d'Inizio (K.O.):",
            "sec1.category": "Categoria:",
            "sec1.cat_friendly": "Amichevole (friendly)",
            "sec1.cat_official": "Campionato (official)",
            "sec1.cat_cup": "Coppa (cup)",
            "sec1.type": "Tipo (Etichetta visualizzata):",
            "sec1.opponent": "Avversario (ID da opponents.json):",
            "sec1.location": "Campo (ID da locations.json):",
            "sec1.venue_type": "Casa / Trasferta:",
            "sec1.home": "Casa (Yokohama Calcio vs Avversario)",
            "sec1.away": "Trasferta (Avversario vs Yokohama Calcio)",
            "sec1.score": "Risultato (es. 2 - 1 oppure VS):",
            "sec2.title": "2. Eventi & Prestazioni",
            "sec2.scorers": "Marcatori (es. 小金井 x2, 根本):",
            "sec2.assists": "Assistman (es. 道下, 福田):",
            "sec2.mvp": "MVP del Match:",
            "sec2.goalkeepers": "Portiere Titolare & Gol Subiti (es. 御村 葵(5)):",
            "sec2.yellow": "Cartellini Gialli:",
            "sec2.red": "Cartellini Rossi:",
            "sec3.title": "3. Assetto Tattico & Convocati",
            "sec3.formation": "Modulo (es. 4-4-2):",
            "sec3.subtitle": "Seleziona lo stato di ogni giocatore per la partita:",
            "role.absent": "Assente",
            "role.starter": "Titolare",
            "role.sub_in": "Subentrato",
            "role.sub_unused": "Panchina (SNG)",
            "admin.save_btn": "Salva Partita su matches.json"
        },
        en: {
            "login.title": "Yokohama Calcio Admin Panel",
            "login.subtitle": "Enter your GitHub Personal Access Token to unlock.",
            "login.btn": "Login",
            "admin.logout": "Logout",
            "sec1.title": "1. Match Details",
            "sec1.match_id": "Match ID (e.g. match-9):",
            "sec1.status": "Match Status:",
            "sec1.status_past": "Completed (past)",
            "sec1.status_upcoming": "Scheduled (upcoming)",
            "sec1.date": "Date:",
            "sec1.time": "Kick-off Time (K.O.):",
            "sec1.category": "Category:",
            "sec1.cat_friendly": "Friendly (friendly)",
            "sec1.cat_official": "League (official)",
            "sec1.cat_cup": "Cup (cup)",
            "sec1.type": "Type Label:",
            "sec1.opponent": "Opponent (ID from opponents.json):",
            "sec1.location": "Venue (ID from locations.json):",
            "sec1.venue_type": "Home / Away:",
            "sec1.home": "Home (Yokohama Calcio vs Opponent)",
            "sec1.away": "Away (Opponent vs Yokohama Calcio)",
            "sec1.score": "Score (e.g. 2 - 1 or VS):",
            "sec2.title": "2. Events & Stats",
            "sec2.scorers": "Scorers (e.g. 小金井 x2, 根本):",
            "sec2.assists": "Assists (e.g. 道下, 福田):",
            "sec2.mvp": "Match MVP:",
            "sec2.goalkeepers": "Goalkeeper & Conceded (e.g. 御村 葵(5)):",
            "sec2.yellow": "Yellow Cards:",
            "sec2.red": "Red Cards:",
            "sec3.title": "3. Formation & Squad Selection",
            "sec3.formation": "Formation (e.g. 4-4-2):",
            "sec3.subtitle": "Select status for each squad member:",
            "role.absent": "Absent",
            "role.starter": "Starter",
            "role.sub_in": "Subbed In",
            "role.sub_unused": "Bench (Unused)",
            "admin.save_btn": "Save Match to matches.json"
        }
    };

    let currentAdminLang = localStorage.getItem('preferred_lang') || 'ja';
    let activeToken = localStorage.getItem('yc_gh_token') || '';
    let globalPlayers = [];

    function setAdminLanguage(lang) {
        currentAdminLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (adminTranslations[lang] && adminTranslations[lang][key]) {
                if (elem.tagName === 'INPUT' && elem.type === 'submit') {
                    elem.value = adminTranslations[lang][key];
                } else {
                    elem.innerHTML = adminTranslations[lang][key];
                }
            }
        });

        document.querySelectorAll('.lang-btn-admin').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        if (globalPlayers.length > 0) renderPlayers();
    }

    document.querySelectorAll('.lang-btn-admin').forEach(btn => {
        btn.addEventListener('click', () => setAdminLanguage(btn.getAttribute('data-lang')));
    });

    // --- AUTENTICAZIONE GITHUB TOKEN ---
    async function verifyAndLoginToken(token) {
        const loginErr = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        loginErr.textContent = '';
        loginBtn.disabled = true;

        try {
            const repo = "yokohamacalcio/yokohamacalcio";
            const res = await fetch(`https://api.github.com/repos/${repo}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                activeToken = token;
                localStorage.setItem('yc_gh_token', token);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                initData();
            } else {
                loginErr.textContent = '❌ Token non valido o permessi insufficienti!';
                localStorage.removeItem('yc_gh_token');
            }
        } catch(e) {
            loginErr.textContent = '❌ Errore di rete durante la verifica.';
        } finally {
            loginBtn.disabled = false;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputVal = document.getElementById('inputToken').value.trim();
        if (inputVal) verifyAndLoginToken(inputVal);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('yc_gh_token');
        activeToken = '';
        location.reload();
    });

    // Controllo automatico token salvato all'avvio
    if (activeToken) {
        verifyAndLoginToken(activeToken);
    }

    // --- CARICAMENTO AUTOCOMPLETE & GIOCATORI ---
    async function initData() {
        try {
            const pRes = await fetch('players.json');
            globalPlayers = await pRes.json();
            renderPlayers();

            try {
                const oRes = await fetch('opponents.json');
                const opps = await oRes.json();
                document.getElementById('opponentsList').innerHTML = Object.keys(opps).map(k => `<option value="${k}">${opps[k].name?.ja || opps[k].name?.en || k}</option>`).join('');
            } catch(e) {}

            try {
                const lRes = await fetch('locations.json');
                const locs = await lRes.json();
                document.getElementById('locationsList').innerHTML = Object.keys(locs).map(k => `<option value="${k}">${locs[k].ja || locs[k].en || k}</option>`).join('');
            } catch(e) {}

        } catch(e) {
            console.error("Errore dati:", e);
        }
    }

    function renderPlayers() {
        const grid = document.getElementById('playersGrid');
        const lang = currentAdminLang;
        const t = adminTranslations[lang] || adminTranslations['ja'];

        grid.innerHTML = globalPlayers.map(p => {
            const pName = (lang === 'ja') ? (p.name_kanji || p.name_romaji) : (p.name_romaji || p.name_kanji);
            return `
                <div class="player-card">
                    <div class="player-card-header">
                        <span>#${p.number || '-'} ${pName}</span>
                        <span style="font-size: 0.75rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">${p.position || 'MF'}</span>
                    </div>
                    <div class="role-selector">
                        <label><input type="radio" name="status_${p.id}" value="absent" checked> ${t["role.absent"]}</label>
                        <label><input type="radio" name="status_${p.id}" value="starter"> ${t["role.starter"]}</label>
                        <label><input type="radio" name="status_${p.id}" value="sub_in"> ${t["role.sub_in"]}</label>
                        <label><input type="radio" name="status_${p.id}" value="sub_unused"> ${t["role.sub_unused"]}</label>
                    </div>
                </div>
            `;
        }).join('');
    }

    setAdminLanguage(currentAdminLang);

    // --- SALVATAGGIO SU GITHUB ACTIONS ---
    document.getElementById('matchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const repo = document.getElementById('repoPath').value.trim();
        if (!activeToken || !repo) return;

        const starters = [];
        const substitutesIn = [];
        const substitutesUnused = [];
        const playedLineup = [];

        globalPlayers.forEach(p => {
            const pName = p.name_kanji || p.name_romaji;
            const selectedStatus = document.querySelector(`input[name="status_${p.id}"]:checked`)?.value;

            if (selectedStatus === 'starter') {
                starters.push(pName);
                playedLineup.push(pName);
            } else if (selectedStatus === 'sub_in') {
                substitutesIn.push(pName);
                playedLineup.push(pName);
            } else if (selectedStatus === 'sub_unused') {
                substitutesUnused.push(pName);
            }
        });

        const matchPayload = {
            id: document.getElementById('matchId').value.trim(),
            category: document.getElementById('matchCategory').value,
            date: document.getElementById('matchDate').value,
            time: document.getElementById('matchTime').value || '11:00',
            status: document.getElementById('matchStatus').value,
            type: document.getElementById('matchType').value.trim() || '練習試合',
            opponent_id: document.getElementById('opponentId').value.trim(),
            isHome: document.getElementById('isHome').value === 'true',
            score: document.getElementById('matchScore').value.trim() || 'VS',
            scorers: document.getElementById('matchScorers').value.trim(),
            assists: document.getElementById('matchAssists').value.trim(),
            mvp: document.getElementById('matchMvp').value.trim(),
            yellow_cards: document.getElementById('yellowCards').value.trim(),
            red_cards: document.getElementById('redCards').value.trim(),
            location_id: document.getElementById('locationId').value.trim(),
            goalkeepers: document.getElementById('goalkeepers').value.trim(),
            formation: document.getElementById('formation').value.trim(),
            starters: starters,
            substitutes_in: substitutesIn,
            substitutes_unused: substitutesUnused,
            lineup: playedLineup
        };

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        submitBtn.disabled = true;
        statusMsg.style.color = '#003c82';
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving to GitHub...';

        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/update-data.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${activeToken}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        action_type: 'add_match',
                        match_data: JSON.stringify(matchPayload)
                    }
                })
            });

            if (response.ok) {
                statusMsg.style.color = '#059669';
                statusMsg.innerHTML = '✅ Saved! Site will update in ~30s.';
            } else {
                const errData = await response.json();
                statusMsg.style.color = '#dc2626';
                statusMsg.innerHTML = '❌ Error: ' + (errData.message || 'Check Token permissions.');
            }
        } catch (err) {
            statusMsg.style.color = '#dc2626';
            statusMsg.innerHTML = '❌ Network Error.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
