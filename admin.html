<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yokohama Calcio | Admin Panel Dynamic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f1f5f9; margin: 0; padding: 15px; }
        .admin-container { max-width: 980px; margin: 10px auto; padding: 25px; background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .admin-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; }
        h2, h3, h4 { color: #003c82; margin: 0; }
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 18px; border-radius: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #003c82; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        @media (max-width: 650px) { .row { flex-direction: column; gap: 0; } }

        /* SCHERMATA LOGIN */
        .login-box { max-width: 450px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 6px 25px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; text-align: center; }
        .login-box i.lock-icon { font-size: 3rem; color: #003c82; margin-bottom: 15px; }
        
        /* CAMPO TATTICO E POSIZIONI TITOLARI */
        .tactical-pitch-container { background: #0f172a; border-radius: 12px; padding: 16px; border: 2px solid #1e293b; margin-top: 10px; }
        .pitch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .pitch-position-card { background: #1e293b; border: 1px solid rgba(135, 206, 235, 0.25); border-radius: 8px; padding: 10px; color: #ffffff; }
        .pitch-pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .pos-badge { background: #87ceeb; color: #00224a; font-weight: 800; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
        
        /* PANCHINA DINAMICA */
        .bench-container { margin-top: 15px; }
        .bench-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
        .bench-card { background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-size: 0.85rem; }
        .bench-card-header { font-weight: bold; color: #003c82; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .bench-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: #f1f5f9; padding: 6px 8px; border-radius: 6px; }
        .bench-sub-row label { font-size: 0.78rem; font-weight: 700; color: #334155; margin: 0; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        /* STATISTICHE DINAMICHE */
        .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .stat-row select { flex: 1; }
        .stat-row input[type="number"] { width: 75px; text-align: center; }
        .btn-remove-row { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .btn-add-row { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: bold; margin-top: 5px; }
        .btn-add-trialist { background: #059669; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; width: 100%; margin-top: 12px; }
        
        .btn-submit { background: #003c82; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.05rem; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-logout { background: #ef4444; color: white; padding: 6px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-load { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.88rem; }
        .btn-load:hover { background: #0369a1; }
        .btn-reset { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        
        .lang-switcher-admin { display: flex; gap: 6px; align-items: center; }
        .lang-btn-admin { background: transparent; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; cursor: pointer; color: #475569; }
        .lang-btn-admin.active { background: #003c82; color: white; border-color: #003c82; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- SCHERMATA LOGIN -->
<div id="loginSection" class="login-box">
    <i class="fas fa-lock lock-icon"></i>
    <h2 style="margin-bottom: 10px;" data-i18n="login.title">Yokohama Calcio Admin</h2>
    <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 20px;" data-i18n="login.subtitle">Inserisci il GitHub Token per sbloccare.</p>

    <div class="lang-switcher-admin" style="justify-content: center; margin-bottom: 20px;">
        <button class="lang-btn-admin active" data-lang="ja">JP</button>
        <button class="lang-btn-admin" data-lang="it">IT</button>
        <button class="lang-btn-admin" data-lang="en">EN</button>
    </div>

    <form id="loginForm">
        <div class="form-group" style="text-align: left;">
            <label for="inputToken"><i class="fas fa-key"></i> GitHub Token (PAT):</label>
            <input type="password" id="inputToken" class="form-control" placeholder="ghp_... o github_pat_..." required>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn" data-i18n="login.btn">Accedi</button>
    </form>
    <div id="loginError" style="color: #dc2626; font-size: 0.85rem; margin-top: 15px; font-weight: bold;"></div>
</div>

<!-- DASHBOARD ADMIN -->
<div id="adminDashboard" class="admin-container hidden">
    <div class="admin-header-bar">
        <div>
            <h2><i class="fas fa-shield-alt"></i> Yokohama Calcio Admin</h2>
            <span style="font-size: 0.78rem; color: #059669; font-weight: bold;"><i class="fas fa-check-circle"></i> Authenticated</span>
        </div>
        
        <div style="display: flex; gap: 12px; align-items: center;">
            <button type="button" onclick="resetForm()" class="btn-reset" title="Pulisci Modulo"><i class="fas fa-redo"></i> Reset</button>
            <div class="lang-switcher-admin">
                <button class="lang-btn-admin active" data-lang="ja">JP</button>
                <button class="lang-btn-admin" data-lang="it">IT</button>
                <button class="lang-btn-admin" data-lang="en">EN</button>
            </div>
            <button id="logoutBtn" class="btn-logout" data-i18n="admin.logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <form id="matchForm">
        <input type="hidden" id="repoPath" value="yokohamacalcio/yokohamacalcio">

        <!-- 1. INFORMAZIONI PARTITA -->
        <div class="section-box">
            <h3 data-i18n="sec1.title">1. Informazioni Partita</h3>
            <div class="row" style="margin-top: 10px; align-items: flex-end;">
                <div class="form-group" style="flex: 2;">
                    <label data-i18n="sec1.match_id">ID Match (es. match-9):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="matchId" class="form-control" placeholder="match-9" required>
                        <button type="button" class="btn-load" onclick="loadExistingMatchData()"><i class="fas fa-search"></i> <span data-i18n="btn.load">Carica</span></button>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.status">Stato Partita:</label>
                    <select id="matchStatus" class="form-control">
                        <option value="past" data-i18n="sec1.status_past">Finita (past)</option>
                        <option value="upcoming" data-i18n="sec1.status_upcoming">In programma (upcoming)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.date">Data:</label>
                    <input type="date" id="matchDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.time">Orario Calcio d'Inizio (K.O.):</label>
                    <input type="time" id="matchTime" class="form-control" value="11:00">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.category">Categoria:</label>
                    <select id="matchCategory" class="form-control">
                        <option value="friendly" data-i18n="sec1.cat_friendly">Amichevole (friendly)</option>
                        <option value="official" data-i18n="sec1.cat_official">Campionato (official)</option>
                        <option value="cup" data-i18n="sec1.cat_cup">Coppa (cup)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.type">Tipo (Etichetta visualizzata):</label>
                    <input type="text" id="matchType" class="form-control" value="練習試合">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.opponent">Avversario (da opponents.json):</label>
                    <select id="opponentSelect" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.location">Campo (da locations.json):</label>
                    <select id="locationSelect" class="form-control" required></select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec1.venue_type">Casa / Trasferta:</label>
                    <select id="isHome" class="form-control">
                        <option value="true" data-i18n="sec1.home">Casa (Yokohama Calcio vs Avversario)</option>
                        <option value="false" data-i18n="sec1.away">Trasferta (Avversario vs Yokohama Calcio)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="sec1.score">Risultato (es. 2 - 1 oppure VS):</label>
                    <input type="text" id="matchScore" class="form-control" placeholder="2 - 1" value="VS">
                </div>
            </div>
        </div>

        <!-- 2. EVENTI & PRESTAZIONI -->
        <div class="section-box">
            <h3 data-i18n="sec2.title">2. Eventi & Prestazioni (Selezione da Rosa)</h3>
            
            <!-- MARCATORI -->
            <div class="form-group">
                <label data-i18n="sec2.scorers"><i class="fas fa-futbol"></i> Marcatori (Gol segnati):</label>
                <div id="scorersContainer"></div>
                <button type="button" class="btn-add-row" onclick="addScorerRow()"><i class="fas fa-plus"></i> <span data-i18n="sec2.add_scorer">Aggiungi Marcatore</span></button>
            </div>

            <!-- ASSISTMAN -->
            <div class="form-group">
                <label data-i18n="sec2.assists"><i class="fas fa-handshake"></i> Assistman (Assist effettuati):</label>
                <div id="assistsContainer"></div>
                <button type="button" class="btn-add-row" onclick="addAssistRow()"><i class="fas fa-plus"></i> <span data-i18n="sec2.add_assist">Aggiungi Assistman</span></button>
            </div>

            <!-- PORTIERI & GOL SUBITI -->
            <div class="form-group">
                <label data-i18n="sec2.goalkeepers"><i class="fas fa-mitten"></i> Portieri & Gol Subiti:</label>
                <div id="gkContainer"></div>
                <button type="button" class="btn-add-row" onclick="addGkRow()"><i class="fas fa-plus"></i> <span data-i18n="sec2.add_gk">Aggiungi Portiere</span></button>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec2.mvp"><i class="fas fa-star"></i> MVP del Match:</label>
                    <select id="mvpSelect" class="form-control"></select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label data-i18n="sec2.yellow">Cartellini Gialli:</label>
                    <div id="yellowCardsContainer"></div>
                    <button type="button" class="btn-add-row" onclick="addYellowCardRow()"><i class="fas fa-plus"></i> Aggiungi Ammonito</button>
                </div>
                <div class="form-group">
                    <label data-i18n="sec2.red">Cartellini Rossi:</label>
                    <div id="redCardsContainer"></div>
                    <button type="button" class="btn-add-row" onclick="addRedCardRow()"><i class="fas fa-plus"></i> Aggiungi Espulso</button>
                </div>
            </div>
        </div>

        <!-- 3. ASSETTO TATTICO, TITOLARI & PANCHINA DINAMICA -->
        <div class="section-box">
            <h3 data-i18n="sec3.title">3. Assetto Tattico & Convocati</h3>
            
            <div class="row" style="margin-top: 10px;">
                <div class="form-group">
                    <label data-i18n="sec3.formation_select"><i class="fas fa-chess-board"></i> Modulo Tattico / フォーメーション:</label>
                    <select id="formationSelect" class="form-control">
                        <option value="4-4-2">4-4-2 (Classico)</option>
                        <option value="4-3-3">4-3-3 (Tridente)</option>
                        <option value="4-2-3-1">4-2-3-1</option>
                        <option value="3-5-2">3-5-2</option>
                        <option value="3-4-3">3-4-3</option>
                        <option value="5-3-2">5-3-2</option>
                        <option value="4-1-4-1">4-1-4-1</option>
                        <option value="custom">Personalizzata / Custom</option>
                    </select>
                </div>
            </div>

            <!-- TITOLARI SUL CAMPO (11 POSIZIONI) -->
            <div class="tactical-pitch-container">
                <h4 style="color: #87ceeb; margin-bottom: 12px; font-size: 0.95rem;" data-i18n="sec3.starters_title">
                    <i class="fas fa-users"></i> Titolari in Campo (11 Giocatori)
                </h4>
                <div class="pitch-grid" id="pitchGrid">
                    <!-- Generato dinamicamente -->
                </div>
            </div>

            <!-- PANCHINA (10 CASALLE) -->
            <div class="bench-container">
                <h4 style="color: #003c82; margin-top: 20px; margin-bottom: 10px; font-size: 0.95rem;" data-i18n="sec3.bench_title">
                    <i class="fas fa-chair"></i> Panchina (10 Posti)
                </h4>
                <div class="bench-grid" id="benchGrid">
                    <!-- Generato dinamicamente -->
                </div>
            </div>

            <button type="button" class="btn-add-trialist" onclick="addTrialistPlayer()">
                <i class="fas fa-user-plus"></i> <span data-i18n="sec3.add_trialist">+ Aggiungi Giocatore in Prova (Trialist)</span>
            </button>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" data-i18n="admin.save_btn">
            <i class="fas fa-cloud-upload-alt"></i> Salva Partita su matches.json
        </button>
    </form>

    <div id="statusMsg" style="margin-top: 18px; font-weight: bold; text-align: center;"></div>
</div>

    function setAdminLanguage(lang) {
        currentAdminLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (adminTranslations[lang] && adminTranslations[lang][key]) {
                elem.innerHTML = adminTranslations[lang][key];
            }
        });

        document.querySelectorAll('.lang-btn-admin').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        if (globalPlayers.length > 0) {
            renderPitchAndBench();
            updateAllPlayerDropdowns();
        }

        btn.addEventListener('click', () => setAdminLanguage(btn.getAttribute('data-lang')));
    });

    async function verifyAndLoginToken(token) {
        const loginErr = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        loginErr.textContent = '';
        loginBtn.disabled = true;

        try {
            const repo = "yokohamacalcio/yokohamacalcio";
            const res = await fetch(`https://api.github.com/repos/${repo}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                activeToken = token;
                localStorage.setItem('yc_gh_token', token);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                initData();
            } else {
                loginErr.textContent = '❌ Token non valido o permessi insufficienti!';
                localStorage.removeItem('yc_gh_token');
            }
        } catch(e) {
            loginErr.textContent = '❌ Errore di rete durante la verifica.';
        } finally {
            loginBtn.disabled = false;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputVal = document.getElementById('inputToken').value.trim();
        if (inputVal) verifyAndLoginToken(inputVal);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('yc_gh_token');
        activeToken = '';
        location.reload();
    });

    if (activeToken) verifyAndLoginToken(activeToken);

    async function initData() {
        try {
            // 1. Opponents
            try {
                const oRes = await fetch('opponents.json');
                const opps = await oRes.json();
                const sortedOppKeys = Object.keys(opps).sort((a, b) => {
                    const nameA = opps[a].name?.ja || opps[a].name?.en || a;
                    const nameB = opps[b].name?.ja || opps[b].name?.en || b;
                    return nameA.localeCompare(nameB, currentAdminLang);
                });
                
                document.getElementById('opponentSelect').innerHTML = sortedOppKeys.map(k => {
                    const name = opps[k].name?.ja || opps[k].name?.en || k;
                    return `<option value="${k}">${name} (${k})</option>`;
                }).join('');
            } catch(e) {}

            // 2. Locations
            try {
                const lRes = await fetch('locations.json');
                const locs = await lRes.json();
                const sortedLocKeys = Object.keys(locs).sort((a, b) => {
                    const nameA = locs[a].ja || locs[a].en || a;
                    const nameB = locs[b].ja || locs[b].en || b;
                    return nameA.localeCompare(nameB, currentAdminLang);
                });

                document.getElementById('locationSelect').innerHTML = sortedLocKeys.map(k => {
                    const name = locs[k].ja || locs[k].en || k;
                    return `<option value="${k}">${name} (${k})</option>`;
                }).join('');
            } catch(e) {}

            // 3. Players
            const pRes = await fetch('players.json');
            globalPlayers = await pRes.json();
            
            // 4. Matches (per ricerca automatica)
            try {
                const mRes = await fetch('matches.json');
                allMatchesData = await mRes.json();
            } catch(e) { console.error("matches.json non trovato."); }

            renderPitchAndBench();
            updateAllPlayerDropdowns();

            // Evento ricerca automatica su blur da ID
            document.getElementById('matchId').addEventListener('blur', () => {
                const val = document.getElementById('matchId').value.trim();
                if (val) loadExistingMatchData(false);
            });

        } catch(e) {
            console.error("Errore caricamento dati:", e);
        }
    }

    function getPlayerDisplayName(player) {
        if (currentAdminLang === 'ja') {
            return player.name_kanji || player.name_romaji;
        } else {
            return player.name_romaji || player.name_kanji;
        }
    }

    function renderPitchAndBench() {
        const formationKey = document.getElementById('formationSelect').value;
        const positions = FORMATIONS[formationKey] || FORMATIONS["4-4-2"];
        
        // 1. Titolari
        const pitchGrid = document.getElementById('pitchGrid');
        pitchGrid.innerHTML = positions.map((posTag, idx) => `
            <div class="pitch-position-card">
                <div class="pitch-pos-header">
                    <span class="pos-badge">${posTag}</span>
                    <span style="font-size: 0.72rem; color: #94a3b8;">Pos #${idx + 1}</span>
                </div>
                <select class="form-control player-dropdown-dynamic starter-player-select match-squad-select" data-pos="${posTag}">
                </select>
            </div>
        `).join('');

        // 2. Panchina (10 Slots)
        const benchGrid = document.getElementById('benchGrid');
        const t = adminTranslations[currentAdminLang] || adminTranslations['ja'];
        
        let benchHTML = '';
        for (let i = 1; i <= 10; i++) {
            benchHTML += `
                <div class="bench-card" id="benchSlot_${i}">
                    <div class="bench-card-header">
                        <span>#${i} Panchina</span>
                    </div>
                    <select class="form-control player-dropdown-dynamic bench-player-select match-squad-select">
                    </select>
                    <div class="bench-sub-row">
                        <label>
                            <input type="checkbox" class="bench-subbed-in" onchange="toggleBenchPosSelect(this)"> ${t["sec3.subbed_in"]}
                        </label>
                        <select class="form-control bench-pos-select" style="font-size: 0.8rem; padding: 4px;" disabled>
                            ${positions.map(p => `<option value="${p}">${p}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
        }
        benchGrid.innerHTML = benchHTML;

        updateAllPlayerDropdowns();
    }

    function toggleBenchPosSelect(checkboxElem) {
        const posSelect = checkboxElem.parentElement.parentElement.querySelector('.bench-pos-select');
        if (posSelect) {
            posSelect.disabled = !checkboxElem.checked;
        }
    }

    document.getElementById('formationSelect').addEventListener('change', renderPitchAndBench);

    // --- CARICAMENTO AUTOMATICO DATI PARTITA ESISTENTE ---
    async function loadExistingMatchData(showAlerts = true) {
        const searchId = document.getElementById('matchId').value.trim().toLowerCase();
        if (!searchId) return;

        const statusMsg = document.getElementById('statusMsg');
        
        // Ricarica sempre l'ultimo matches.json per avere i dati aggiornati
        try {
            const mRes = await fetch('matches.json?t=' + Date.now());
            if (mRes.ok) allMatchesData = await mRes.json();
        } catch(e) {}

        const match = allMatchesData.find(m => String(m.id).toLowerCase() === searchId);

        if (!match) {
            if (showAlerts) {
                statusMsg.style.color = '#d97706';
                statusMsg.innerHTML = `ℹ️ Nessuna partita trovata con ID "${searchId}". Inserisci i nuovi dati.`;
            }
            return;
        }

        statusMsg.style.color = '#0284c7';
        statusMsg.innerHTML = `✅ Dati trovati per ${match.id}! Compilazione automatica...`;

        // 1. Compilazione Campi Generali
        if (match.status) document.getElementById('matchStatus').value = match.status;
        if (match.date) document.getElementById('matchDate').value = match.date;
        if (match.time) document.getElementById('matchTime').value = match.time;
        if (match.category) document.getElementById('matchCategory').value = match.category;
        if (match.type) document.getElementById('matchType').value = match.type;
        if (match.opponent_id) document.getElementById('opponentSelect').value = match.opponent_id;
        if (match.location_id) document.getElementById('locationSelect').value = match.location_id;
        if (match.isHome !== undefined) document.getElementById('isHome').value = String(match.isHome);
        if (match.score) document.getElementById('matchScore').value = match.score;

        // 2. Modulo Tattico
        if (match.formation) {
            const formSel = document.getElementById('formationSelect');
            formSel.value = FORMATIONS[match.formation] ? match.formation : 'custom';
            renderPitchAndBench();
        }

        // 3. Titolari e Posizioni
        if (match.starters_positions) {
            Object.entries(match.starters_positions).forEach(([posTag, pName]) => {
                const targetSel = document.querySelector(`#pitchGrid .starter-player-select[data-pos="${posTag}"]`);
                if (targetSel) targetSel.value = pName;
            });
        } else if (Array.isArray(match.starters)) {
            const startersSelects = document.querySelectorAll('#pitchGrid .starter-player-select');
            match.starters.forEach((pName, idx) => {
                if (startersSelects[idx]) startersSelects[idx].value = pName;
            });
        }

        // 4. Panchina e Sostituzioni
        if (Array.isArray(match.bench_details)) {
            match.bench_details.forEach((bItem, idx) => {
                const slotElem = document.getElementById(`benchSlot_${idx + 1}`);
                if (slotElem) {
                    const pSelect = slotElem.querySelector('.bench-player-select');
                    const chkSub = slotElem.querySelector('.bench-subbed-in');
                    const posSel = slotElem.querySelector('.bench-pos-select');

                    if (pSelect) pSelect.value = bItem.player || '';
                    if (chkSub) {
                        chkSub.checked = !!bItem.subbed_in;
                        toggleBenchPosSelect(chkSub);
                    }
                    if (posSel && bItem.position_played) posSel.value = bItem.position_played;
                }
            });
        } else if (Array.isArray(match.substitutes_in) || Array.isArray(match.substitutes_unused)) {
            const allBench = [...(match.substitutes_in || []), ...(match.substitutes_unused || [])];
            allBench.forEach((pName, idx) => {
                const slotElem = document.getElementById(`benchSlot_${idx + 1}`);
                if (slotElem) {
                    const pSelect = slotElem.querySelector('.bench-player-select');
                    const chkSub = slotElem.querySelector('.bench-subbed-in');
                    if (pSelect) pSelect.value = pName;
                    if (chkSub && match.substitutes_in && match.substitutes_in.includes(pName)) {
                        chkSub.checked = true;
                        toggleBenchPosSelect(chkSub);
                    }
                }
            });
        }

        // 5. Statistiche Dinamiche (Pulisci container prima di ricostruire)
        document.getElementById('scorersContainer').innerHTML = '';
        document.getElementById('assistsContainer').innerHTML = '';
        document.getElementById('gkContainer').innerHTML = '';
        document.getElementById('yellowCardsContainer').innerHTML = '';
        document.getElementById('redCardsContainer').innerHTML = '';

        // Marcatori
        if (match.scorers && match.scorers !== 'なし' && match.scorers !== 'Nessuno') {
            match.scorers.split(/[,、]/).forEach(entry => {
                let text = entry.trim();
                let count = 1;
                const multMatch = text.match(/(.*?)\s*(?:[xX\*])\s*(\d+)/);
                if (multMatch) {
                    text = multMatch[1].trim();
                    count = parseInt(multMatch[2], 10) || 1;
                }
                addScorerRow();
                const lastRow = document.querySelector('#scorersContainer .stat-row:last-child');
                if (lastRow) {
                    lastRow.querySelector('.scorer-player-select').value = text;
                    lastRow.querySelector('.row-count-input').value = count;
                }
            });
        }

        // Assist
        if (match.assists && match.assists !== 'なし' && match.assists !== 'Nessuno') {
            match.assists.split(/[,、]/).forEach(entry => {
                let text = entry.trim();
                let count = 1;
                const multMatch = text.match(/(.*?)\s*(?:[xX\*])\s*(\d+)/);
                if (multMatch) {
                    text = multMatch[1].trim();
                    count = parseInt(multMatch[2], 10) || 1;
                }
                addAssistRow();
                const lastRow = document.querySelector('#assistsContainer .stat-row:last-child');
                if (lastRow) {
                    lastRow.querySelector('.assist-player-select').value = text;
                    lastRow.querySelector('.row-count-input').value = count;
                }
            });
        }

        // Portieri
        if (match.goalkeepers) {
            match.goalkeepers.split(/[,、]/).forEach(entry => {
                const gkMatch = entry.trim().match(/^([^(（]+)[(（]\s*(\d+)\s*[)）]$/);
                let rawGk = entry.trim();
                let gkGa = 0;
                if (gkMatch) {
                    rawGk = gkMatch[1].trim();
                    gkGa = parseInt(gkMatch[2], 10) || 0;
                }
                addGkRow();
                const lastRow = document.querySelector('#gkContainer .stat-row:last-child');
                if (lastRow) {
                    lastRow.querySelector('.gk-player-select').value = rawGk;
                    lastRow.querySelector('.row-count-input').value = gkGa;
                }
            });
        }

        // MVP
        if (match.mvp) document.getElementById('mvpSelect').value = match.mvp;

        // Cartellini
        if (match.yellow_cards) {
            match.yellow_cards.split(/[,、]/).forEach(name => {
                if (name.trim()) {
                    addYellowCardRow();
                    const lastRow = document.querySelector('#yellowCardsContainer .stat-row:last-child');
                    if (lastRow) lastRow.querySelector('.yellow-player-select').value = name.trim();
                }
            });
        }
        if (match.red_cards) {
            match.red_cards.split(/[,、]/).forEach(name => {
                if (name.trim()) {
                    addRedCardRow();
                    const lastRow = document.querySelector('#redCardsContainer .stat-row:last-child');
                    if (lastRow) lastRow.querySelector('.red-player-select').value = name.trim();
                }
            });
        }

        updatePlayerExclusions();
    }

        document.getElementById('matchForm').reset();
        document.getElementById('scorersContainer').innerHTML = '';
        document.getElementById('assistsContainer').innerHTML = '';
        document.getElementById('gkContainer').innerHTML = '';
        document.getElementById('yellowCardsContainer').innerHTML = '';
        document.getElementById('redCardsContainer').innerHTML = '';
        document.getElementById('statusMsg').innerHTML = '';
        renderPitchAndBench();
    }

    function addTrialistPlayer() {
        trialistCount++;
        const tId = `trialist_${trialistCount}`;
        const namePrompt = prompt("Nome del giocatore in prova (es. 山田 太郎):", "Giocatore In Prova " + trialistCount);
        if (!namePrompt) return;

        globalPlayers.push({ id: tId, name_kanji: namePrompt, name_romaji: namePrompt, position: 'TRIAL' });
        updateAllPlayerDropdowns();
    }

    function getAllAvailablePlayers(onlyGoalkeepers = false) {
        const list = [{ name: "Nessuno / なし", value: "" }];
        
        let filtered = globalPlayers;
        if (onlyGoalkeepers) {
            filtered = globalPlayers.filter(p => p.position === 'GK' || p.position === 'TRIAL');
        }

        filtered.sort((a, b) => getPlayerDisplayName(a).localeCompare(getPlayerDisplayName(b), currentAdminLang));

        filtered.forEach(p => {
            const isTrial = p.position === 'TRIAL' ? ' (PROVA)' : '';
            list.push({
                name: getPlayerDisplayName(p) + isTrial,
                value: p.name_kanji || p.name_romaji
            });
        });
        return list;
    }

    function updateAllPlayerDropdowns() {
        const allPlayers = getAllAvailablePlayers(false);
        const gkPlayers = getAllAvailablePlayers(true);

        const allOptionsHTML = allPlayers.map(p => `<option value="${p.value}">${p.name}</option>`).join('');
        const gkOptionsHTML = gkPlayers.map(p => `<option value="${p.value}">${p.name}</option>`).join('');

        const mvpSelect = document.getElementById('mvpSelect');
        const currentMvp = mvpSelect.value;
        mvpSelect.innerHTML = allOptionsHTML;
        mvpSelect.value = currentMvp;

        document.querySelectorAll('.player-dropdown-dynamic').forEach(select => {
            const currentVal = select.value;
            if (select.classList.contains('gk-player-select')) {
                select.innerHTML = gkOptionsHTML;
            } else {
                select.innerHTML = allOptionsHTML;
            }
            select.value = currentVal;
            
            if (select.classList.contains('match-squad-select')) {
                select.removeEventListener('change', updatePlayerExclusions);
                select.addEventListener('change', updatePlayerExclusions);
            }
        });

        updatePlayerExclusions();
    }

    function updatePlayerExclusions() {
        const squadSelects = document.querySelectorAll('.match-squad-select');
        const selectedValues = new Set();

        squadSelects.forEach(select => {
            if (select.value) selectedValues.add(select.value);
        });

        squadSelects.forEach(select => {
            const currentValue = select.value;
            Array.from(select.options).forEach(option => {
                if (!option.value) return;
                
                if (selectedValues.has(option.value) && option.value !== currentValue) {
                    option.disabled = true;
                    option.textContent = option.textContent.replace(' (Selezionato)', '') + ' (Selezionato)';
                } else {
                    option.disabled = false;
                    option.textContent = option.textContent.replace(' (Selezionato)', '');
                }
            });
        });
    }

    function createDynamicRow(selectClass, hasCountInput = true, countLabel = "Gol:", onlyGK = false) {
        const players = getAllAvailablePlayers(onlyGK);
        const div = document.createElement('div');
        div.className = 'stat-row';
        div.innerHTML = `
            <select class="form-control player-dropdown-dynamic ${selectClass}">
                ${players.map(p => `<option value="${p.value}">${p.name}</option>`).join('')}
            </select>
            ${hasCountInput ? `<label>${countLabel}</label><input type="number" class="form-control row-count-input" value="1" min="0" max="20">` : ''}
            <button type="button" class="btn-remove-row" onclick="this.parentElement.remove(); updatePlayerExclusions();"><i class="fas fa-trash"></i></button>
        `;
        return div;
    }

    function addScorerRow() { document.getElementById('scorersContainer').appendChild(createDynamicRow('scorer-player-select', true, "Gol:", false)); }
    function addAssistRow() { document.getElementById('assistsContainer').appendChild(createDynamicRow('assist-player-select', true, "Assist:", false)); }
    function addGkRow() { document.getElementById('gkContainer').appendChild(createDynamicRow('gk-player-select', true, "Gol Subiti:", true)); }
    function addYellowCardRow() { document.getElementById('yellowCardsContainer').appendChild(createDynamicRow('yellow-player-select', false, "", false)); }
    function addRedCardRow() { document.getElementById('redCardsContainer').appendChild(createDynamicRow('red-player-select', false, "", false)); }

    setAdminLanguage(currentAdminLang);

    // --- SALVATAGGIO & INVIO A GITHUB ---
    document.getElementById('matchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const repo = document.getElementById('repoPath').value.trim();
        if (!activeToken || !repo) return;

        // 1. Titolari e Formazione
        const starters = [];
        const startersPositions = {};

        document.querySelectorAll('#pitchGrid .starter-player-select').forEach(sel => {
            const pName = sel.value;
            const posTag = sel.getAttribute('data-pos');
            if (pName) {
                starters.push(pName);
                startersPositions[posTag] = pName;
            }
        });

        // 2. Panchina e Sostituzioni
        const benchDetails = [];
        const substitutesIn = [];
        const substitutesUnused = [];

        document.querySelectorAll('#benchGrid .bench-card').forEach(card => {
            const pName = card.querySelector('.bench-player-select').value;
            const isSubbed = card.querySelector('.bench-subbed-in').checked;
            const posPlayed = card.querySelector('.bench-pos-select').value;

            if (pName) {
                benchDetails.push({
                    player: pName,
                    subbed_in: isSubbed,
                    position_played: isSubbed ? posPlayed : null
                });

                if (isSubbed) {
                    substitutesIn.push(pName);
                } else {
                    substitutesUnused.push(pName);
                }
            }
        });

        const playedLineup = [...starters, ...substitutesIn];

        // 3. Format Marcatori
        const scorerMap = {};
        document.querySelectorAll('.stat-row .scorer-player-select').forEach(sel => {
            const pName = sel.value;
            const count = parseInt(sel.parentElement.querySelector('.row-count-input').value) || 1;
            if (pName) scorerMap[pName] = (scorerMap[pName] || 0) + count;
        });
        const scorersString = Object.keys(scorerMap).map(k => scorerMap[k] > 1 ? `${k} x${scorerMap[k]}` : k).join(', ');

        // 4. Format Assistman
        const assistMap = {};
        document.querySelectorAll('.stat-row .assist-player-select').forEach(sel => {
            const pName = sel.value;
            const count = parseInt(sel.parentElement.querySelector('.row-count-input').value) || 1;
            if (pName) assistMap[pName] = (assistMap[pName] || 0) + count;
        });
        const assistsString = Object.keys(assistMap).map(k => assistMap[k] > 1 ? `${k} x${assistMap[k]}` : k).join(', ');

        // 5. Format Portieri
        const gkList = [];
        document.querySelectorAll('.stat-row .gk-player-select').forEach(sel => {
            const pName = sel.value;
            const conceded = parseInt(sel.parentElement.querySelector('.row-count-input').value) || 0;
            if (pName) gkList.push(`${pName}(${conceded})`);
        });
        const goalkeepersString = gkList.join(', ');

        // 6. Cartellini
        const yellowsList = [];
        document.querySelectorAll('.stat-row .yellow-player-select').forEach(sel => { if (sel.value) yellowsList.push(sel.value); });
        const redsList = [];
        document.querySelectorAll('.stat-row .red-player-select').forEach(sel => { if (sel.value) redsList.push(sel.value); });

        const matchPayload = {
            id: document.getElementById('matchId').value.trim(),
            category: document.getElementById('matchCategory').value,
            date: document.getElementById('matchDate').value,
            time: document.getElementById('matchTime').value || '11:00',
            status: document.getElementById('matchStatus').value,
            type: document.getElementById('matchType').value.trim() || '練習試合',
            opponent_id: document.getElementById('opponentSelect').value,
            isHome: document.getElementById('isHome').value === 'true',
            score: document.getElementById('matchScore').value.trim() || 'VS',
            scorers: scorersString,
            assists: assistsString,
            mvp: document.getElementById('mvpSelect').value,
            yellow_cards: yellowsList.join(', '),
            red_cards: redsList.join(', '),
            location_id: document.getElementById('locationSelect').value,
            goalkeepers: goalkeepersString,
            formation: document.getElementById('formationSelect').value,
            starters_positions: startersPositions,
            starters: starters,
            substitutes_in: substitutesIn,
            substitutes_unused: substitutesUnused,
            bench_details: benchDetails,
            lineup: playedLineup
        };

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        submitBtn.disabled = true;
        statusMsg.style.color = '#003c82';
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Invio in corso a GitHub...';

        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/update-data.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${activeToken}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        action_type: 'add_match',
                        match_data: JSON.stringify(matchPayload)
                    }
                })
            });

            if (response.ok) {
                statusMsg.style.color = '#059669';
                statusMsg.innerHTML = '✅ Partita salvata! Il sito si aggiornerà in ~30 secondi.';
            } else {
                const errData = await response.json();
                statusMsg.style.color = '#dc2626';
                statusMsg.innerHTML = '❌ Errore API: ' + (errData.message || 'Verifica Token o Permessi.');
            }
        } catch (err) {
            statusMsg.style.color = '#dc2626';
            statusMsg.innerHTML = '❌ Errore di connessione.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
