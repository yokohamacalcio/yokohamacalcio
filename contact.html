    <style>
        /* --- OVERLAY MENU MOBILE SCURO COMPATTO --- */
        .mobile-nav {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 10, 25, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 15px; box-sizing: border-box;
        }
        .mobile-nav.hidden { display: none !important; }
        .mobile-nav-content {
            background: linear-gradient(145deg, #00224a 0%, #001229 100%);
            color: #ffffff;
            width: 100%; max-width: 380px; max-height: 85vh;
            overflow-y: auto; border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(135, 206, 235, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; margin-top: 10px;
        }
        .mobile-nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 12px; margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .mobile-nav-header .brand-name { color: #ffffff; font-size: 1.15rem; font-weight: 800; letter-spacing: 1px; }
        .mobile-nav-header .brand-sub { color: #87ceeb; }
        .mobile-nav-close {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.1rem; color: #ffffff; cursor: pointer;
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .mobile-nav-close:active { background: #87ceeb; color: #00224a; }
        .mobile-link {
            color: #ffffff !important;
            font-size: 0.95rem; font-weight: 600;
            padding: 10px 12px; border-radius: 8px;
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .mobile-link:hover, .mobile-link:active { background: rgba(255, 255, 255, 0.08); }

        .mobile-nav .menu-icon {
            width: 24px !important;
            min-width: 24px !important;
            text-align: center !important;
            color: #87ceeb !important;
            font-size: 1.05rem !important;
            display: inline-block !important;
            flex-shrink: 0 !important;
        }

        .mobile-dropdown-toggle {
            width: 100%; background: transparent; border: none;
            color: #ffffff !important; font-size: 0.95rem; font-weight: 600;
            padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 8px; cursor: pointer; box-sizing: border-box;
        }
        .mobile-dropdown-toggle-left { display: flex; align-items: center; gap: 12px; }
        .mobile-submenu {
            background: rgba(0, 0, 0, 0.25); border-radius: 8px;
            padding: 4px 0 4px 10px; margin: 4px 0 8px 8px;
            border-left: 2px solid #87ceeb;
        }
        .mobile-submenu .mobile-link.sub {
            font-size: 0.88rem; padding: 8px 10px;
            color: #e2e8f0 !important;
        }
        .mobile-cta-wrapper {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        .mobile-cta-btn {
            background: #87ceeb; color: #00224a !important;
            font-weight: 800; text-align: center;
            padding: 10px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; text-decoration: none;
        }

        /* --- DESKTOP NAV --- */
        .desktop-nav-wrapper { display: flex; align-items: center; }
        .main-nav { display: flex !important; align-items: center !important; gap: 16px; white-space: nowrap; }
        .main-nav .nav-item { position: relative !important; display: inline-flex; align-items: center; }
        
        .main-nav > a,
        .main-nav .dropdown-toggle {
            display: inline-flex !important;
            align-items: center !important;
            gap: 5px !important;
            padding: 8px 10px !important;
            font-family: inherit !important;
            font-size: 0.92rem !important;
            font-weight: 700 !important;
            color: var(--dark-navy, #003c82) !important;
            text-decoration: none !important;
            border: none !important;
            background: transparent !important;
            cursor: pointer !important;
            user-select: none !important;
            line-height: 1.2 !important;
            transition: color 0.2s ease, opacity 0.2s ease !important;
            box-sizing: border-box !important;
            margin: 0 !important;
        }

        .main-nav > a:hover,
        .main-nav .dropdown-toggle:hover {
            color: var(--primary-sky, #87ceeb) !important;
        }

        .main-nav .nav-cta-btn {
            background: var(--dark-navy, #003c82) !important;
            color: #ffffff !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            font-weight: 800 !important;
        }
        .main-nav .nav-cta-btn:hover {
            background: var(--primary-sky, #87ceeb) !important;
            color: var(--dark-navy, #003c82) !important;
        }

        .main-nav .dropdown-menu {
            display: none;
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            z-index: 1000 !important;
            min-width: 190px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            padding: 8px 0;
            margin-top: 2px;
            white-space: nowrap;
        }

        .main-nav .dropdown-menu a {
            display: block !important;
            padding: 10px 16px !important;
            color: var(--dark-navy, #003c82) !important;
            text-decoration: none !important;
            font-size: 0.88rem !important;
            font-weight: 600 !important;
            transition: background 0.2s ease, color 0.2s ease !important;
            text-align: left !important;
        }

        .main-nav .dropdown-menu a:hover {
            background-color: #f1f5f9 !important;
            color: var(--primary-sky, #87ceeb) !important;
        }

        .nav-item.dropdown:hover > .dropdown-menu,
        .nav-item.dropdown.open > .dropdown-menu {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
        }
        .nav-item.dropdown:hover > .dropdown-toggle .nav-arrow,
        .nav-item.dropdown.open > .dropdown-toggle .nav-arrow {
            transform: rotate(180deg);
        }

        @media (min-width: 1025px) and (max-width: 1200px) {
            .main-nav { gap: 8px !important; }
            .main-nav > a, .main-nav .dropdown-toggle { padding: 6px 6px !important; font-size: 0.85rem !important; }
            .main-nav .nav-cta-btn { padding: 6px 12px !important; font-size: 0.85rem !important; }
        }

        @media (max-width: 900px) and (orientation: portrait) {
            .desktop-nav-wrapper { display: none !important; }
            .mobile-menu-toggle { display: flex !important; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .desktop-nav-wrapper { display: flex !important; }
            .mobile-menu-toggle { display: none !important; }
            .main-nav { gap: 4px !important; }
            .main-nav > a, .main-nav .dropdown-toggle { padding: 4px 5px !important; font-size: 0.78rem !important; }
            .main-nav .nav-cta-btn { padding: 5px 10px !important; font-size: 0.75rem !important; }
            .logo-title img { height: 30px !important; }
            .brand-name { font-size: 0.95rem !important; }
        }

        /* --- LAYOUT FORM CONTACT --- */
        .contact-grid-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        @media (max-width: 880px) {
            .contact-grid-container { grid-template-columns: 1fr; }
        }

        .contact-form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 550px) {
            .form-row-2 { grid-template-columns: 1fr; }
        }

        /* ROW STABILIZZATA PER DATA DI NASCITA ED ETÀ */
        .form-row-date-age {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .form-row-date-age > div {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-width: 0;
        }
        .form-row-date-age label {
            min-height: 24px;
            white-space: nowrap;
            margin-bottom: 6px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--dark-navy, #003c82);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label .required-tag {
            background: #ef4444;
            color: #ffffff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
        }

        .form-control {
            width: 100%;
            min-width: 0;
            height: 46px;
            padding: 0 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s ease;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* FRECCIA PERSONALIZZATA CHIARA ED ELEGANTE PER TUTTI I SELECT */
        select.form-control {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23003c82' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
            cursor: pointer;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-sky, #87ceeb);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.25);
        }

        /* DESIGN USER-FRIENDLY PER INPUT DATE */
        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="date"].form-control {
            height: 46px;
            padding: 0 14px;
            line-height: 46px;
            background-color: #f8fafc;
            cursor: pointer;
        }

        /* LIVE VALIDATION STYLES */
        .form-control.is-valid {
            border-color: #10b981 !important;
            background-color: #f0fdf4 !important;
        }
        .form-control.is-invalid {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
        }

        .form-control.readonly-age {
            height: 46px;
            background-color: #e2e8f0;
            color: #00224a;
            font-weight: 800;
            cursor: not-allowed;
            text-align: center;
            padding: 0 6px;
            line-height: 46px;
        }

        textarea.form-control {
            height: auto;
            min-height: 120px;
            padding: 12px 14px;
        }

        /* Dynamic Checkboxes for Sub-roles */
        .sub-pos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 6px 0;
        }
        .checkbox-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s ease;
            user-select: none;
        }
        .checkbox-tag:hover { background: #e2e8f0; }
        .checkbox-tag input[type="checkbox"] {
            accent-color: #003c82;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* PRIVACY CHECKBOX BOX E EVIDENZIAZIONE ERRORE */
        .privacy-box {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .privacy-box.is-invalid-box {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }
        .privacy-checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            color: #334155;
            cursor: pointer;
            font-weight: 600;
            line-height: 1.45;
        }
        .privacy-checkbox-label input[type="checkbox"] {
            accent-color: #003c82;
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .privacy-link {
            color: #003c82;
            text-decoration: underline;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .privacy-link:hover {
            color: #87ceeb;
        }

        .field-section-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: #00224a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin: 20px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CARD INFORMAZIONI E DIRECT MAIL */
        .contact-info-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-box {
            background: #ffffff;

        }
        .info-box h4 {

        }
        .info-box p {
            font-size: 0.88rem;
            color: #475569;

            margin-bottom: 12px;
        }
        
        .direct-email-box {
            background: linear-gradient(135deg, #00224a 0%, #001229 100%);
            color: #ffffff;

            border: 1px solid rgba(135, 206, 235, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }
        .direct-email-box h4 {
            color: #87ceeb;

            font-weight: 800;

            background: rgba(255, 255, 255, 0.1);

        .btn-copy-email {
            width: 100%;

            color: #00224a;

            border-radius: 8px;

        .submit-btn {

        .submit-btn:hover {
            background: #002b5c;
            transform: translateY(-1px);

        .toast-copy {
            position: fixed;

            background: #10b981;

        .error-banner {

            display: none;

            margin-top: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);

        /* --- MODAL DI CONFERMA CUSTOM --- */
        .confirm-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 10, 25, 0.7);
            backdrop-filter: blur(5px);
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .confirm-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .confirm-modal-card {
            background: #ffffff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            border: 2px solid #87ceeb;
        }
        .confirm-modal-overlay.show .confirm-modal-card {
            transform: translateY(0);
        }
        .confirm-modal-icon {
            width: 70px;
            height: 70px;
            background: #f0fdf4;
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 18px auto;
            border: 2px solid #a7f3d0;
        }
        .confirm-modal-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #00224a;
            margin-bottom: 12px;
        }
        .confirm-modal-text {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
