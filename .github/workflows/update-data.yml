name: Update Match Data & Lineups

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Tipo di operazione (add_match)'
        required: true
        default: 'add_match'
      match_data:
        description: 'JSON String della partita'
        required: true

# 🔑 FONDAMENTALE: Concede i permessi di scrittura al bot che fa il commit
permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update JSON Files
        run: |
          node -e '
          const fs = require("fs");
          const inputData = JSON.parse(process.env.MATCH_DATA);
          
          // 1. Leggi o inizializza matches.json
          let matches = [];
          if (fs.existsSync("matches.json")) {
            matches = JSON.parse(fs.readFileSync("matches.json", "utf8"));
          }
          
          // Se la partita esiste già aggiorna, altrimenti aggiungi
          const existingIdx = matches.findIndex(m => m.id === inputData.id);
          if (existingIdx >= 0) {
            matches[existingIdx] = inputData;
          } else {
            matches.push(inputData);
          }
          
          // Ordina le partite per data decrescente (dalla più recente)
          matches.sort((a, b) => new Date(b.date) - new Date(a.date));
          
          // Salva matches.json formattato
          fs.writeFileSync("matches.json", JSON.stringify(matches, null, 2), "utf8");
          console.log("✅ matches.json aggiornato con successo.");

          // 2. Ricalcola Presenze (Caps) su players.json se il file esiste
          if (fs.existsSync("players.json")) {
            let players = JSON.parse(fs.readFileSync("players.json", "utf8"));
            
            // Calcola le presenze per ogni giocatore dalle lineup delle partite "past"
            const capsMap = {};
            matches.forEach(m => {
              if (m.status === "past" && Array.isArray(m.lineup)) {
                m.lineup.forEach(pName => {
                  capsMap[pName] = (capsMap[pName] || 0) + 1;
                });
              }
            });

            // Aggiorna il campo caps in players.json
            players = players.map(p => {
              const pName = p.name_kanji || p.name_romaji;
              p.caps = capsMap[pName] || 0;
              return p;
            });

            fs.writeFileSync("players.json", JSON.stringify(players, null, 2), "utf8");
            console.log("✅ players.json (Caps presenze) aggiornato con successo.");
          }
          '
        env:
          MATCH_DATA: ${{ github.event.inputs.match_data }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Yokohama Calcio Admin Bot"
          git config --global user.email "bot@yokohamacalcio.com"
          git add matches.json players.json || exit 0
          git commit -m "Update match data & player caps via Admin Dashboard [skip ci]" || exit 0
          git push
