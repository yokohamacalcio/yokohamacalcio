name: Auto SEO, Static HTML & Google Notification

on:
  push:
    paths:
      - 'matches.json'
      - 'players.json'
      - 'opponents.json'
      - 'locations.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 1. VALIDAZIONE JSON
      - name: Validate JSON files
        run: |
          node -e '
          const fs = require("fs");
          ["matches.json", "players.json", "opponents.json", "locations.json"].forEach(f => {
            if (fs.existsSync(f)) {
              try {
                JSON.parse(fs.readFileSync(f, "utf8"));
                console.log(`✅ ${f} è valido.`);
              } catch (e) {
                console.error(`❌ ERRORE SINTASSI IN ${f}:`, e.message);
                process.exit(1);
              }
            } else {
              console.log(`⚠️ ${f} non trovato, salto.`);
            }
          });
          '

      # 2. GENERAZIONE HTML STATICO E SCHEMA-EVENTS.JSON TRAMITE PYTHON
      - name: Run Python Static HTML Generator
        run: python scripts/generate_seo.py

      # 3. AGGIORNAMENTO SITEMAP
      - name: Update Sitemap
        run: |
          node -e '
          const fs = require("fs");
          const today = new Date().toISOString().split("T")[0];
          if (fs.existsSync("sitemap.xml")) {
            let sitemap = fs.readFileSync("sitemap.xml", "utf8");
            sitemap = sitemap.replace(/<lastmod>.*?<\/lastmod>/g, `<lastmod>${today}</lastmod>`);
            fs.writeFileSync("sitemap.xml", sitemap);
            console.log("✅ Sitemap.xml aggiornata.");
          } else {
            console.log("⚠️ sitemap.xml non trovato, salto.");
          }
          '

      # 4. COMMIT & PUSH SICURO
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Nessuna modifica da committare."
          else
            git commit -m "Auto-generate static HTML & SEO [skip ci]"
            git push
          fi

      # 5. PING GOOGLE SEARCH CONSOLE
      - name: Ping Google Search Console
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://yokohamacalcio.com/sitemap.xml" || true