name: Update Team Statistics

on:
  push:
    paths:
      - 'matches.json'
      - 'players.json'
      - 'build-stats.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # <-- Dà esplicitamente il permesso di scrittura al workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Stats JSON
        run: node build-stats.js

      - name: Commit and Push updated stats.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stats.json from matches/players data" && git push)
