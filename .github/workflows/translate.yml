name: Auto Translate News

on:
  push:
    paths:
      - 'news.json'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Esegui lo script di traduzione
        run: python scripts/translate_news.py

      - name: Salva e fai il commit di news.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: traduzione automatica news.json"
          file_pattern: 'news.json'
