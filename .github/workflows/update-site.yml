name: Update static content

# Si avvia quando cambiano i dati (l'admin li salva tutti in UN commit) o lo script.
# Le pagine .html NON sono nei trigger: il commit del bot non rilancia il workflow.
on:
  push:
    branches: [main]
    paths:
      - matches.json
      - players.json
      - opponents.json
      - locations.json
      - competitions.json
      - trainings.json
      - news.json
      - stats.json
      - scripts/generate_seo.py
      - .github/workflows/update-site.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false   # accoda, non scartare: così non si perde nessun aggiornamento

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # serve alla sitemap per leggere le date dei commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Genera HTML statico, sitemap e calendario
        run: python scripts/generate_seo.py

      - name: Commit e push (solo se qualcosa è cambiato)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html matches.html players.html stats.html sitemap.xml calendar.ics
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "chore: aggiorna contenuti statici [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
