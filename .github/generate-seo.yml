name: Generate Dynamic SEO & Sitemap

on:
  push:
    paths:
      - 'matches.json'
      - 'players.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Sitemap
        run: |
          node -e '
          const fs = require("fs");
          const today = new Date().toISOString().split("T")[0];
          const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://yokohamacalcio.com/</loc>
              <lastmod>${today}</lastmod>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://yokohamacalcio.com/matches.html</loc>
              <lastmod>${today}</lastmod>
              <changefreq>daily</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://yokohamacalcio.com/players.html</loc>
              <lastmod>${today}</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.7</priority>
            </url>
            <url>
              <loc>https://yokohamacalcio.com/stats.html</loc>
              <lastmod>${today}</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.7</priority>
            </url>
          </urlset>`;
          fs.writeFileSync("sitemap.xml", sitemap);
          '

      - name: Commit and Push Updated Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sitemap.xml [skip ci]" && git push)
