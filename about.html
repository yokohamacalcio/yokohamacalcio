      if (k === 's3' && i === 4) h += `<p class="motto" style="margin-top:20px;font-size:1.05rem">${esc(s.sub)}</p>`;
      h += `<p class="${k === 's5' && i === p.length - 1 ? 'last' : ''}">${esc(txt)}</p>`;
      if (k === 's4' && i === 3) h += `<div class="principles-list">${s.pr.map(([ic, ti, de]) => `<div class="principle-item"><div class="principle-title"><i class="fas ${ic}"></i> ${esc(ti)}</div><p>${esc(de)}</p></div>`).join('')}</div>`;
    });
    return `<section class="about-block" id="sec-${id}"><span class="about-block-subtitle">${label}</span><h2><i class="fas ${icon}"></i> ${esc(s.t)}</h2>${h}</section>`;
  }).join('');
  renderLeaders();
}

/* leadership: legge leadership_role da players.json (più vice capitani consentiti) */
function renderLeaders() {
  const box = document.getElementById('leaders'), lang = YC.lang();
  const byRole = r => PL.filter(p => p.leadership_role === r).sort((a, b) => (a.number ?? 999) - (b.number ?? 999));
  let manager = PL.filter(p => p.leadership_role === 'manager' || p.leadership_role === 'founder');
  if (!manager.length) manager = PL.filter(p => p.id === 'di-rubbo-luca');   // fallback finché non aggiungi leadership_role: "manager"
  const list = [...manager.map(p => ['manager', p]), ...byRole('captain').map(p => ['captain', p]), ...byRole('vice_captain').map(p => ['vice_captain', p])];
  document.getElementById('sec-leadership').style.display = list.length ? '' : 'none';
  box.innerHTML = list.map(([role, p]) => `<a class="leader-card ${role}" href="players.html#${esc(p.id)}"><div class="leader-num">${p.number != null ? '#' + p.number : '&nbsp;'}</div><div class="leader-role">${YC.t('a.role_' + role)}</div><div class="leader-name">${esc(YC.data.playerName(p, lang))} <i class="fas fa-external-link-alt" style="font-size:.7rem"></i></div></a>`).join('');
}

/* evidenzia la voce del menu in pagina mentre si scorre */
(function () {
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('#chipNav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
  const wait = setInterval(() => { const s = document.querySelectorAll('.about-block'); if (s.length > 1) { s.forEach(x => io.observe(x)); clearInterval(wait); } }, 300);
})();

render();
YC.data.load(['players']).then(d => { PL = (d.players || []).filter(p => p.role !== 'staff'); renderLeaders(); });
document.addEventListener('yc:langchange', render);
</script>
