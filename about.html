    function t(key) {
        return (translations[currentLang] && translations[currentLang][key]) || key;
    }

    function cleanStr(s) {
        return String(s || '').toLowerCase().replace(/[\s\u3000]+/g, '').trim();
    }

    function containsJapaneseChars(text) {
        return /[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\uff00-\uffef\u4e00-\u9faf\u3400-\u4dbf]/.test(text);
    }

    function getUniqueTeamColor(idOrName) {
        let hash = 0;
        const str = String(idOrName || 'opponent').toLowerCase();
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash) % 360;
        const saturation = 70 + (Math.abs(hash >> 3) % 20);
        const lightness = 35 + (Math.abs(hash >> 5) % 15);
        const l = lightness / 100;
        const a = saturation * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + hue / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `${f(0)}${f(8)}${f(4)}`;
    }

    function getRomajiName(match, defaultName) {
        if (match && match.opponent_id && opponentsData[match.opponent_id]) {
            const opp = opponentsData[match.opponent_id];
            if (opp.name) {
                const romaji = opp.name['en'] || opp.name['it'];
                if (romaji) return romaji;
            }
        }
        const rawName = defaultName || '';
        if (commonRomajiMap[rawName]) return commonRomajiMap[rawName];
        const cleanLatin = String(rawName).replace(/[^\x00-\x7F]/g, '').trim();
        if (cleanLatin.length > 0) return cleanLatin;
        return rawName || 'Opponent';
    }

    function getAvatarUrl(matchOrName, romajiFallback) {
        const identifier = (typeof matchOrName === 'object' && matchOrName !== null) 
            ? (matchOrName.opponent_id || matchOrName.opponent_name || matchOrName.team2Name || 'opponent') 
            : String(matchOrName || 'opponent');
        const romaji = (typeof matchOrName === 'object' && matchOrName !== null) 
            ? getRomajiName(matchOrName, romajiFallback) 
            : (romajiFallback || identifier);
        const bgHex = getUniqueTeamColor(identifier);
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(romaji)}&background=${bgHex}&color=ffffff&bold=true&size=128`;
    }

    function getOpponentInfo(match, lang) {
        let name = '';
        let logo = '';
        if (match.opponent_id && opponentsData[match.opponent_id]) {
            const opp = opponentsData[match.opponent_id];
            name = (opp.name && (opp.name[lang] || opp.name['ja'])) || match.opponent_name || match.team2Name || 'Opponent';
            logo = opp.logo || match.opponent_logo || match.team2Logo || '';
        } else {
            name = match.opponent_name || match.team2Name || 'Opponent';
            logo = match.opponent_logo || match.team2Logo || '';
        }
        const romajiName = getRomajiName(match, name);
        if (!logo || logo.trim() === '') {
            logo = getAvatarUrl(match, romajiName);
        }
        return { name, romajiName, logo };
    }

    function formatDateWithDay(dateStr, lang) {
        if (!dateStr) return '';
        if (dateStr.includes('(')) return dateStr;
        const dateObj = new Date(dateStr);
        if (isNaN(dateObj)) return dateStr;
        const localeMap = { ja: 'ja-JP', it: 'it-IT', en: 'en-US' };
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
        return new Intl.DateTimeFormat(localeMap[lang] || 'ja-JP', options).format(dateObj);
    }

    function getLocationInfo(locId, venueFallback, lang) {
        const loc = locationsData[locId];
        if (!loc) {
            const fallbackName = venueFallback || locId || '-';
            return { name: fallbackName, maps: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fallbackName)}`, surface: '' };
        }
        const name = loc[lang] || loc['ja'] || venueFallback || locId;
        const surface = loc.surface ? (loc.surface[lang] || loc.surface['ja'] || '') : '';
        const maps = loc.maps || loc.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
        return { name, maps, surface };
    }

    function findPlayerObj(query) {
        if (!query || query === 'なし' || query === 'Nessuno') return null;
        if (!playersData || playersData.length === 0) return null;
        const target = cleanStr(query);
        if (!target) return null;

        let found = playersData.find(p => {
            const k = cleanStr(p.name_kanji);
            const kn = cleanStr(p.name_kana);
            const r = cleanStr(p.name_romaji);
            const pid = cleanStr(p.id);
            return (k && k === target) || (kn && kn === target) || (r && r === target) || (pid && pid === target);
        });
        if (found) return found;

        if (target.length >= 2) {
            return playersData.find(p => {
                const k = cleanStr(p.name_kanji);
                const kn = cleanStr(p.name_kana);
                const r = cleanStr(p.name_romaji);
                return (k && (k.includes(target) || target.includes(k))) ||
                       (kn && (kn.includes(target) || target.includes(kn))) ||
                       (r && (r.includes(target) || target.includes(r)));
            }) || null;
        }

        return null;
    }

    function getPlayerNameInLang(query, lang) {
        const player = findPlayerObj(query);
        if (!player) return query;
        if (lang === 'ja') {
            if (player.name_kanji && containsJapaneseChars(player.name_kanji)) return player.name_kanji;
            return player.name_kana || player.name_kanji || player.name_romaji || query;
        }
        return player.name_romaji || player.name_kanji || query;
    }

    function translatePlayerText(text, lang) {
        if (!text || typeof text !== 'string') return text || '';
        if (text === 'なし' || text === 'Nessuno') return text;

        const items = text.split(/[,、]/);
        return items.map(item => {
            let str = item.trim();
            if (!str) return '';

            let multiplier = '';
            const multMatch = str.match(/(.*?)\s*(x\d+|\*\d+|\(\d+\))$/i);
            if (multMatch) {
                str = multMatch[1].trim();
                multiplier = ' ' + multMatch[2];
            }

            const match = str.match(/^([^(（]+)[(（]([^)）]+)[)）]$/);
            if (match) {
                const mainName = match[1].trim();
                const extraVal = match[2].trim();
                const translatedMain = getPlayerNameInLang(mainName, lang);
                const translatedExtra = isNaN(extraVal) ? getPlayerNameInLang(extraVal, lang) : extraVal;
                return `${translatedMain} (${translatedExtra})${multiplier}`;
            }

            return `${getPlayerNameInLang(str, lang)}${multiplier}`;
        }).filter(Boolean).join(', ');
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('preferred_lang', lang);

        if (pageTitles[lang]) {
            document.title = pageTitles[lang];
            const ogTitle = document.querySelector('meta[property="og:title"]');
            const twitterTitle = document.querySelector('meta[name="twitter:title"]');
            if (ogTitle) ogTitle.setAttribute('content', pageTitles[lang]);
            if (twitterTitle) twitterTitle.setAttribute('content', pageTitles[lang]);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => 
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang)
        );

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key]) {
                const icon = el.querySelector('i');
                if (icon) {
                    el.childNodes[el.childNodes.length - 1].textContent = " " + translations[lang][key];
                } else {
                    el.textContent = translations[lang][key];
                }
            }
        });

        if (rawMatches.length > 0) {
            renderMatches();
            filterAndPaginateMatches();
        }
    }

    function updateCounter(shown, total) {
        const counterEl = document.getElementById('matchesCounter');
        if (!counterEl) return;
        if (total === 0) {
            counterEl.style.display = 'none';
            return;
        }
        counterEl.style.display = 'block';
        let text = '';
        if (currentLang === 'ja') text = `表示中: ${shown} / ${total} 試合`;
        else if (currentLang === 'it') text = `Mostrate: ${shown} di ${total} partite`;
        else text = `Showing: ${shown} of ${total} matches`;
        counterEl.textContent = text;
    }

    function filterAndPaginateMatches() {
        const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
        const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';

        const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
        let visibleMatches = 0;

        pastCards.forEach(card => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);

            if (categoryMatch && seasonMatch) {
                visibleMatches++;
                card.style.display = (visibleMatches <= visiblePastMatchesCount) ? 'block' : 'none';
            } else {
                card.style.display = 'none';
            }
        });

        const shown = Math.min(visiblePastMatchesCount, visibleMatches);
        updateCounter(shown, visibleMatches);

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            if (visibleMatches > 0) {
                loadMoreBtn.style.display = 'inline-flex';
                if (visibleMatches > visiblePastMatchesCount) {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> <span>${t('btn.load_more_3')}</span>`;
                } else {
                    loadMoreBtn.innerHTML = `<i class="fas fa-chevron-up"></i> <span>${t('btn.show_less')}</span>`;
                }
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        const upcomingCards = document.querySelectorAll('#upcomingContainer .upcoming-item');
        upcomingCards.forEach((card, index) => {
            const category = card.getAttribute('data-match-category');
            const date = card.getAttribute('data-match-date') || '';
            const matchYear = date.substring(0, 4);
            const categoryMatch = (activeCategory === 'all' || category === activeCategory);
            const seasonMatch = (activeSeason === 'all' || matchYear === activeSeason);

            if (categoryMatch && seasonMatch) {
                if (index === 0 || isAllUpcomingVisible) card.style.display = 'block';
                else card.style.display = 'none';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function populateSeasonSelect(matches) {
        const select = document.getElementById('matchSeasonSelect');
        if (!select) return;

        const isUserSelected = select.dataset.userModified === "true";
        const currentSelected = select.value;
        
        const yearsSet = new Set();
        matches.forEach(m => {
            if (m.date) {
                const y = m.date.substring(0, 4);
                if (y && !isNaN(y)) yearsSet.add(y);
            }
        });

        let years = Array.from(yearsSet).sort((a, b) => b - a);
        const currentYearStr = new Date().getFullYear().toString();

        select.innerHTML = '';

        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = t('matches_page.all_seasons');
        select.appendChild(allOption);

        years.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = `${year}年`;
            select.appendChild(option);
        });

        if (isUserSelected && currentSelected) {
            select.value = currentSelected;
        } else if (years.includes(currentYearStr)) {
            select.value = currentYearStr;
        } else if (years.length > 0) {
            select.value = years[0];
        } else {
            select.value = 'all';
        }
    }

        filterAndPaginateMatches();

        const targetCard = document.querySelector(hash);
        if (targetCard) {
            setTimeout(() => {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('active');
                const details = targetCard.querySelector('.match-expand-details');
                if (details) details.style.display = 'block';

                visiblePastMatchesCount = previousCount;
                filterAndPaginateMatches();
                targetCard.style.display = 'block';
                updateBtnTexts();

                if (history.replaceState) {
                    history.replaceState(null, "", window.location.pathname + window.location.search);
                }
            }, 100);
        } else {
            visiblePastMatchesCount = previousCount;
            filterAndPaginateMatches();
        }
    }

    async function loadAllData() {
        try {
            const [mResp, lResp, pResp, oResp] = await Promise.allSettled([
                fetch('matches.json'),
                fetch('locations.json'),
                fetch('players.json'),
                fetch('opponents.json')
            ]);
            
            if (mResp.status === 'fulfilled' && mResp.value.ok) rawMatches = await mResp.value.json();
            if (lResp.status === 'fulfilled' && lResp.value.ok) locationsData = await lResp.value.json();
            if (pResp.status === 'fulfilled' && pResp.value.ok) playersData = await pResp.value.json();
            if (oResp.status === 'fulfilled' && oResp.value.ok) opponentsData = await oResp.value.json();

            setLanguage(currentLang);
            handleHashOnLoad();
        } catch (error) {
            console.error("Errore nel caricamento dati:", error);
        }
    }

    function initDesktopDropdowns() {
        const dropdownItems = document.querySelectorAll('.main-nav .nav-item.dropdown');

        dropdownItems.forEach(item => {
            const toggle = item.querySelector('.dropdown-toggle');
            if (!toggle) return;

            toggle.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                dropdownItems.forEach(d => {
                    if (d !== item) {
                        d.classList.remove('open');
                        const t = d.querySelector('.dropdown-toggle');
                        if (t) t.setAttribute('aria-expanded', 'false');
                    }
                });

                const willOpen = !item.classList.contains('open');
                item.classList.toggle('open', willOpen);
                toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            });

            item.addEventListener('mouseleave', () => {
                item.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
            });

            toggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggle.click();
                }
                if (e.key === 'Escape') {
                    item.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.main-nav .nav-item.dropdown')) {
                dropdownItems.forEach(d => {
                    d.classList.remove('open');
                    const t = d.querySelector('.dropdown-toggle');
                    if (t) t.setAttribute('aria-expanded', 'false');
                });
            }
        });

        document.querySelectorAll('.main-nav .dropdown-menu a').forEach(link => {
            link.addEventListener('click', () => {
                dropdownItems.forEach(d => {
                    d.classList.remove('open');
                    const t = d.querySelector('.dropdown-toggle');
                    if (t) t.setAttribute('aria-expanded', 'false');
                });
            });
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const currentYearEl = document.getElementById('currentYear');
        if (currentYearEl) currentYearEl.textContent = new Date().getFullYear();

        initDesktopDropdowns();
        await loadAllData();

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
        });

        document.querySelectorAll('[data-match-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-match-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        });

        const seasonSelect = document.getElementById('matchSeasonSelect');
        if (seasonSelect) {
            seasonSelect.addEventListener('change', function() {
                this.dataset.userModified = "true";
                visiblePastMatchesCount = 3;
                filterAndPaginateMatches();
            });
        }

        const loadMoreBtn = document.getElementById('loadMoreMatchesBtn');
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const activeCategory = document.querySelector('.filter-btn.active[data-match-filter]')?.getAttribute('data-match-filter') || 'all';
                const activeSeason = document.getElementById('matchSeasonSelect')?.value || 'all';
                const pastCards = document.querySelectorAll('#pastContainer .match-detail-card');
                let totalPast = 0;
                pastCards.forEach(card => {
                    const category = card.getAttribute('data-match-category');
                    const date = card.getAttribute('data-match-date') || '';
                    const matchYear = date.substring(0, 4);
                    if ((activeCategory === 'all' || category === activeCategory) && (activeSeason === 'all' || matchYear === activeSeason)) {
                        totalPast++;
                    }
                });

                if (visiblePastMatchesCount < totalPast) {
                    visiblePastMatchesCount += 3;
                } else {
                    visiblePastMatchesCount = 3;
                }
                filterAndPaginateMatches();
            });
        }

        const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
        const mobileNav = document.querySelector('.mobile-nav');
        const mobileDropdownToggle = document.querySelector('.mobile-dropdown-toggle');
        const mobileSubmenu = document.querySelector('.mobile-submenu');
        const mobileCloseBtn = document.querySelector('.mobile-nav-close');

        function closeMobileMenu() {
            if (mobileNav) {
                mobileNav.classList.add('hidden');
                if (mobileMenuBtn) {
                    const icon = mobileMenuBtn.querySelector('i');
                    if (icon) {
                        icon.classList.add('fa-bars');
                        icon.classList.remove('fa-times');
                    }
                }
            }
        }

        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = mobileNav.classList.contains('hidden');
                if (isHidden) {
                    mobileNav.classList.remove('hidden');
                    const icon = mobileMenuBtn.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-times');
                    }
                } else {
                    closeMobileMenu();
                }
            });

            if (mobileDropdownToggle && mobileSubmenu) {
                mobileDropdownToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    mobileSubmenu.classList.toggle('hidden');
                    const arrow = mobileDropdownToggle.querySelector('.mobile-arrow');
                    if (arrow) {
                        arrow.classList.toggle('fa-chevron-down');
                        arrow.classList.toggle('fa-chevron-up');
                    }
                });
            }

            document.querySelectorAll('.mobile-link, .mobile-cta-btn').forEach(link => {
                link.addEventListener('click', closeMobileMenu);
            });

            if (mobileCloseBtn) {
                mobileCloseBtn.addEventListener('click', closeMobileMenu);
            }

            mobileNav.addEventListener('click', (e) => {
                if (!e.target.closest('.mobile-nav-content') && !mobileMenuBtn.contains(e.target)) {
                    closeMobileMenu();
                }
            });
        }

        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            const checkScroll = () => {
                if (window.scrollY > 300) {
                    scrollToTopBtn.classList.add('show');
                } else {
                    scrollToTopBtn.classList.remove('show');
                }
            };
            window.addEventListener('scroll', checkScroll);
            window.addEventListener('load', checkScroll);
            scrollToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    });
</script>
</body>
</html>
