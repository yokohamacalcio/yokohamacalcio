<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yokohama Calcio - 横浜のイタリアンサッカークラブ</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="logo-title">
      <img src="./immagini/logo.png" alt="Yokohama Calcio" class="logo">
      <h1>Yokohama Calcio</h1>
    </div>

    <div class="desktop-nav-wrapper">
      <nav class="main-nav">
        <a href="#about">チーム紹介</a>
        <a href="#gallery">ギャラリー</a>
        <a href="#sponsors">スポンサー</a>
        <a href="#contact">お問い合わせ</a>
      </nav>
      <div class="header-social-icons">
        <a href="https://x.com/yokohamacalcio" target="_blank"><i class="fab fa-x-twitter"></i></a>
        <a href="https://instagram.com/yokohamacalcio" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </div>

    <button class="mobile-menu-toggle" aria-label="Menu">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <nav class="mobile-nav hidden">
    <a href="#about">チーム紹介</a>
    <a href="#gallery">ギャラリー</a>
    <a href="#sponsors">スポンサー</a>
    <a href="#contact">お問い合わせ</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>横浜に咲くイタリアの情熱</h2>
    <p>サッカーで心をつなぐ場所</p>
    <div class="color-stripes">
        <div class="stripe blue"></div>
        <div class="stripe white"></div>
    </div>
  </div>
</section>

<section class="section" id="about">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-flag"></i> Yokohama Calcioとは</h2>
        <div class="mission-box">
            <h3>私たちの信念</h3>
            <ul>
                <li>サッカーの<strong>楽しさ</strong>を第一に</li>
                <li>スキルを問わない<strong>オープンな参加</strong></li>
                <li>地域に根ざした<strong>コミュニティ活動</strong></li>
            </ul>
        </div>
    </div>
</section>

<section class="carousel-section" id="gallery">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-camera"></i> フォトギャラリー</h2>
        <div class="carousel-container">
            <button class="carousel-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="carousel-slide">
                <img id="mainImage" src="./immagini/gallery/allenamento1.jpg" alt="Gallery">
                <div class="carousel-caption" id="captionText">チーム練習風景 #1</div>
            </div>
            <button class="carousel-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="carousel-indicators">
            <span class="indicator active" data-index="0"></span>
            <span class="indicator" data-index="1"></span>
            <span class="indicator" data-index="2"></span>
            <span class="indicator" data-index="3"></span>
        </div>
    </div>
</section>

<section class="section" id="contact">
    <div class="container">
        <h2 class="section-title"><i class="fas fa-envelope"></i> お問い合わせ</h2>
        <div class="contact-container">
            <form action="https://formsubmit.co/yokohamacalcio@gmail.com" method="POST">
                <div class="form-group">
                    <label>お名前</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>メールアドレス</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>メッセージ</label>
                    <textarea name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">送信する</button>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <p>&copy; 2025 Yokohama Calcio. All Rights Reserved.</p>
</footer>

<script>
    // JavaScript per Menu e Carousel
    const menuBtn = document.querySelector('.mobile-menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    
    menuBtn.addEventListener('click', () => {
        mobileNav.classList.toggle('hidden');
        menuBtn.querySelector('i').classList.toggle('fa-bars');
        menuBtn.querySelector('i').classList.toggle('fa-times');
    });

    const galleryData = [
        { src: './immagini/gallery/allenamento1.jpg', text: 'チーム練習風景 #1' },
        { src: './immagini/gallery/allenamento2.jpg', text: '技術トレーニング' },
        { src: './immagini/gallery/allenamento3.jpg', text: 'フィジカルチェック' },
        { src: './immagini/gallery/allenamento4.jpg', text: 'ミニゲーム' }
    ];

    let currentIndex = 0;
    const mainImg = document.getElementById('mainImage');
    const captionText = document.getElementById('captionText');
    const dots = document.querySelectorAll('.indicator');

    function updateSlide(index) {
        mainImg.style.opacity = '0';
        setTimeout(() => {
            currentIndex = index;
            mainImg.src = galleryData[currentIndex].src;
            captionText.textContent = galleryData[currentIndex].text;
            dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
            mainImg.style.opacity = '1';
        }, 300);
    }

    document.getElementById('nextBtn').addEventListener('click', () => updateSlide((currentIndex + 1) % galleryData.length));
    document.getElementById('prevBtn').addEventListener('click', () => updateSlide((currentIndex - 1 + galleryData.length) % galleryData.length));
    dots.forEach((dot, i) => dot.addEventListener('click', () => updateSlide(i)));
</script>
</body>
</html>
